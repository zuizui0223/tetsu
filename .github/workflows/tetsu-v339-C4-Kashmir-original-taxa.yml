name: "v339 Kashmir C4 original source taxa-only audit"
on:
  push:
    branches:
      - research/tetsu-Kashmir-C4-thermal-mechanism-v339-20261123
    paths:
      - 'scripts/audit_Kashmir_C4_candidate_taxa_v339.py'
      - '.github/workflows/tetsu-v339-C4-Kashmir-original-taxa.yml'
  pull_request:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/audit_Kashmir_C4_candidate_taxa_v339.py'
      - '.github/workflows/tetsu-v339-C4-Kashmir-original-taxa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-C4-species-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source reader
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Download immutable original Dryad version and verify SHA256
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir() and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1: raise ValueError('Original Dryad matrix must appear exactly once')
              with z.open(files[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Show authentic source taxa (species list ONLY, no plot records)
        run: |
          python -u scripts/audit_Kashmir_C4_candidate_taxa_v339.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --output results/audit/v339_Kashmir_taxon_names_only.json
      - name: Archive taxon inventory only (no source plot rows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v339-authentic-Kashmir-species-name-inventory-only
          path: results/audit/v339_Kashmir_taxon_names_only.json
          if-no-files-found: warn
