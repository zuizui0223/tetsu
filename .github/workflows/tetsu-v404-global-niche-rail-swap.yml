name: "v404 original shared rarefied climate niche conditional rail exposure swaps"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_niche_rail_swap_v404.py'
      - 'tests/test_global_niche_rail_swap_v404.py'
      - '.github/workflows/tetsu-v404-global-niche-rail-swap.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_niche_rail_swap_v404.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v401-original-shared-taxa-coarse
          run-id: 45560358505
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v404/shared
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v404/niche
      - run: python -u scripts/analyze_global_niche_rail_swap_v404.py --source source/v404/shared/v401_original_shared_taxa_coarse.json --niche source/v404/niche/v399_original_niche_coarse_aggregates.json --out results/audit/v404_original_niche_rail_swap.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v404-original-niche-rail-swap
          path: results/audit/v404_original_niche_rail_swap.json
          if-no-files-found: error
