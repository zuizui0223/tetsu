name: "v22.3 source-verified Slovenia BS BT functional responses by OSM main branch usage"
on:
  push:
    branches: [research/tetsu-slovenia-identity-guild-v210-20261116]
    paths:
      - 'scripts/audit_Slovenia_genuine_rail_main_branch_vegetation_v223.py'
      - '.github/workflows/tetsu-Slovenia-rail-main-branch-vegetation-v223.yml'
      - 'tests/test_Slovenia_original_main_branch_v223.py'
  workflow_dispatch:
concurrency:
  group: tetsu-v223-slovenia-rail-main-branch-source
  cancel-in-progress: true
jobs:
  original-2022-23-plant-sites-historic-2024-OSM-tag-support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install exact source-classification GIS and science dependencies
        run: python -m pip install 'osmium==4.2.0' 'numpy==2.1.3' 'scipy==1.14.1'
      - name: Unit tests synthetic tags only, not biological results
        run: python -m unittest discover -s tests -p 'test_Slovenia_original_main_branch_v223.py' -v
      - name: Retrieve original genuine Slovenia 2026 author species survey source artifact
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v223/Slovenia
      - name: Gate original Slovenian published author XLSX
        run: |
          set -euo pipefail
          F='source/v223/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx'
          test "$(stat -c%s "$F")" = '401279'
          printf '%s  %s\n' '26be7ca9513dd54136d4ec499d8413c1cb288045f87fe3cf8814731f2edac99f' "$F" | sha256sum -c -
      - name: Download genuine 2024-01-01 Geofabrik historic source PBF directly (branch cache unavailable)
        run: |
          set -euo pipefail
          mkdir -p source/SLO151/osm
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 \
            --user-agent 'tetsu-v223-historical-source/1.0' \
            --output source/SLO151/osm/slovenia-240101.osm.pbf \
            'https://download.geofabrik.de/europe/slovenia-240101.osm.pbf'
      - name: Hard original-publisher PBF SHA / size check
        run: |
          set -euo pipefail
          F='source/SLO151/osm/slovenia-240101.osm.pbf'
          test "$(stat -c%s "$F")" = '280842431'
          printf '%s  %s\n' 'b572258fe000d6dfc76dc63afe5456121c5f463995e132a5dcd79957d819ae39' "$F" | sha256sum -c -
      - name: Join nearest tagged 2024 OSM usage main branch to actual 89 original 2022-23 vegetation plot GPS
        run: |
          python -u scripts/audit_Slovenia_genuine_rail_main_branch_vegetation_v223.py \
            --source-xlsx source/v223/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit source/v223/Slovenia/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --osm-pbf source/SLO151/osm/slovenia-240101.osm.pbf \
            --output results/audit/v223_slovenia_89site_main_branch_usage_trait_and_identity_SUPPORT.json
      - name: Archive only derived aggregate and tag support, never source coordinates/PBF/XLSX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v223-authentic-89-slovenian-rail-main-branch-GIS-usage-support
          path: results/audit/v223_slovenia_89site_main_branch_usage_trait_and_identity_SUPPORT.json
          if-no-files-found: warn
