name: "v413 original rainfall-adjusted annual niche influence audit"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/audit_global_niche_weather_influence_v413.py'
      - 'tests/test_global_niche_weather_influence_v413.py'
      - '.github/workflows/tetsu-v413-weather-influence.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'netCDF4>=1.6,<2' 'boto3>=1.35,<2'
      - run: python -m unittest discover -s tests -p 'test_global_niche_weather_influence_v413.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v405-original-niche-temporal-coarse
          run-id: 45568291544
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v413/annual
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v413/niche
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v411-original-CPC-annual-cell-precip
          run-id: 45573280418
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v413/weather
      - run: python -u scripts/audit_global_niche_weather_influence_v413.py --source source/v413/annual/v405_original_niche_temporal_coarse.json --niche source/v413/niche/v399_original_niche_coarse_aggregates.json --weather source/v413/weather/v411_original_CPC_annual_cell_precip.json --verified data/derived/v412_verified_v411_precip.json --out results/audit/v413_original_weather_influence.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v413-original-weather-influence
          path: results/audit/v413_original_weather_influence.json
          if-no-files-found: error
