name: "v390 original GloNAF list quality and common geographic effort support"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_naturalized_quality_effort_v390.py'
      - 'tests/test_global_naturalized_quality_effort_v390.py'
      - '.github/workflows/tetsu-v390-naturalized-quality-effort.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_naturalized_quality_effort_v390.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v383-coarse-cell-naturalized-counts-only
          run-id: 45404886620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v390/cells
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v390/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v390/road
      - name: Retrieve original GloNAF list and region metadata
        run: |
          set -euo pipefail
          mkdir -p source/v390/glonaf
          for f in glonaf_list.csv glonaf_region.csv; do
            curl -LfS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 "https://zenodo.org/records/17105725/files/$f?download=1" -o "source/v390/glonaf/$f"
          done
      - name: Exact v389 replay and fixed list quality and geographic support tests
        run: |
          python -u scripts/analyze_global_naturalized_quality_effort_v390.py \
            --cells source/v390/cells/v383_original_coarse_cell_counts.json \
            --tree source/v390/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road source/v390/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --glonaf source/v390/glonaf \
            --out results/audit/v390_original_naturalized_quality_effort.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v390-original-naturalized-quality-effort
          path: results/audit/v390_original_naturalized_quality_effort.json
          if-no-files-found: error
