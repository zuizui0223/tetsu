name: "v329 exact source Kashmir thermal trait taxon loss and gain decomposition"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_Kashmir_EIVE_loss_gain_identity_v329.py'
      - 'tests/test_Kashmir_EIVE_loss_gain_identity_v329.py'
      - '.github/workflows/tetsu-v329-Kashmir-EIVE-loss-gain-mechanistic-accounting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-field-loss-gain-thermal-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine Dryad read-only original source XLSX reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Test additive species appearance-disappearance EIVE accounting and source missingness
        run: python -m unittest discover -s tests -p 'test_Kashmir_EIVE_loss_gain_identity_v329.py' -v
      - name: Source original 2021 Kashmir official Dryad archive SHA256
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/dryad_original_version_99735.zip
          python - <<'PY'
          from pathlib import Path
          import shutil,zipfile
          with zipfile.ZipFile('source/Kashmir/dryad_original_version_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir()
                    and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Expected one authentic original publisher Kashmir workbook')
              with z.open(files[0]) as fin,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as fout:
                  shutil.copyfileobj(fin,fout)
          PY
          printf '%s  %s\n' \
           '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
           source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: EIVE independently published European ecological temperature indicator exact source
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
           '0f0ce19cd2a781eeed027d8b0acadbcb' \
           source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Source-backed exact 2014-2017 taxon gain versus loss contributions for railway and interior habitats
        run: |
          python -u scripts/analyze_Kashmir_EIVE_loss_gain_identity_v329.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v329_Kashmir_real_EIVE_loss_gain_thermal_accounting.json
      - name: Archive derived aggregate and exclusions only, not original plant source rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v329-Kashmir-source-thermal-turnover-gains-losses-aggregate
          path: results/audit/v329_Kashmir_real_EIVE_loss_gain_thermal_accounting.json
          if-no-files-found: warn
