name: "railstatus: global adjacent four-taxon beta and observer-disjoint split"
on:
  push:
    branches: [research/tetsu-railstatus-placebo-20261125]
    paths:
      - 'scripts/scan_world_railstatus_observer_split_beta.py'
      - 'tests/test_world_railstatus_observer_split_beta.py'
      - '.github/workflows/tetsu-railstatus-observer-split-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: railstatus-observer-split-beta
  cancel-in-progress: true
jobs:
  observer_split_beta:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2' 'pyproj>=3.6,<4'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_world_railstatus_observer_split_beta.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-four-taxa-2025-grid-counts
          run-id: 45560367041
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsob/taxa
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsob/plants
      - name: Exact complete original observation and observer-split replay
        run: |
          python -u scripts/scan_world_railstatus_observer_split_beta.py \
            --prior source/rsob/taxa/four_taxa_counts.json \
            --plant source/rsob/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --out results/railstatus/observer_split_beta.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-railstatus-observer-split-beta
          path: results/railstatus/observer_split_beta.json
          if-no-files-found: error
