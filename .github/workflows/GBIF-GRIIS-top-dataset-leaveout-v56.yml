name: "v5.6 Country-GRIIS introduced plant SPECIES_KEY source split dominant GBIF dataset vs all other datasets"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_gbif_griis_dominant_dataset_leaveout_v56.py'
      - 'tests/test_GBIF_GRIIS_dominant_dataset_leaveout_v56.py'
      - '.github/workflows/GBIF-GRIIS-top-dataset-leaveout-v56.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-GRIIS-species-dominant-dataset-source-v56
  cancel-in-progress: true
jobs:
  real-country-introduced-species-dataset-source:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        block:
          - us_midwest
          - fr_burgundy
          - ca_ontario
          - gb_yorkshire
          - de_saxony
          - au_southeast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GBIF and country spatial source libraries
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'requests>=2.31,<3' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Unit tests for strict GBIF full/filtered speciesKey partition and non-detection source quality
        run: python -m unittest discover -s tests -p 'test_GBIF_GRIIS_dominant_dataset_leaveout_v56.py' -v
      - name: Original 8-country country GRIIS INTRODUCED speciesKey × 50km cell source
        uses: actions/download-artifact@v4
        with:
          name: griis-50km-10block-8country-introduced-species-source-v36
          run-id: 42761140912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/flora
      - name: True independent original nine-country GRIIS accepted botanical taxon backbone keys
        uses: actions/download-artifact@v4
        with:
          name: griis-9country-real-introduced-plants-backbone-nub-v24
          run-id: 42730506112
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/griis
      - name: Actual all-plants full GBIF datasetKey country cell composition from v5.0
        uses: actions/download-artifact@v4
        with:
          name: tetsu-GBIF-50km-dataset-composition-${{ matrix.block }}-v50
          run-id: 42796286437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/datasets
      - name: Query new official full all-source and top-dataset speciesKey facets, derive other-datasets source counts for real GRIIS aliens
        run: |
          python -u scripts/audit_gbif_griis_dominant_dataset_leaveout_v56.py \
            --block ${{ matrix.block }} \
            --flora source/flora/griis_50km_10blocks_country_mask_v36.json \
            --source-datasets source/datasets/dataset_source_${{ matrix.block }}_v50.json \
            --griis-accepted-keys source/griis/griis_9country_alien_backbone_keys_v24.json \
            --output results/audit/GBIF_GRIIS_top_dataset_source_${{ matrix.block }}_v56.json
      - name: Preserve current source country-introduced taxa partition, with non-detection gate but no individual occurrence IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-GRIIS-50km-dominant-dataset-vs-other-${{ matrix.block }}-v56
          path: results/audit/GBIF_GRIIS_top_dataset_source_${{ matrix.block }}_v56.json
          if-no-files-found: warn
