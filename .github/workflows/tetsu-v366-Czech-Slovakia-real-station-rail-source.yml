name: "v366 independent original Czech35 and Slovak19 railway station GERS source coverage"
on:
  push:
    branches: [research/tetsu-v364-geodesic-network-distance-20261124]
    paths:
      - 'scripts/audit_original_CZ_SK_station_GERS_topology_v366.py'
      - 'tests/test_original_CZ_SK_GERS_source_locations_v366.py'
      - '.github/workflows/tetsu-v366-Czech-Slovakia-real-station-rail-source.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v366-two-independent-studies-original-Oveture-rail-source
  cancel-in-progress: true
jobs:
  true_Czech_and_Slovakia_original_railway_station_GERS_geography:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        study: [CZ,SK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original original-publisher botanical parser, true GERS geodetic GIS
        run: python -m pip install 'overturemaps==2.1.1' 'networkx>=3.4,<4' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pyarrow>=18,<25' 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'PyMuPDF==1.24.14'
      - name: Synthetic source Czech SR70 centroid versus author original Slovak DMS distance and no-outcome-guess tests
        run: |
          python -m unittest discover -s tests -p 'test_original_CZ_SK_GERS_source_locations_v366.py' -v
          python -m py_compile scripts/audit_original_CZ_SK_station_GERS_topology_v366.py
      - name: Download exact original Czech source 2024 railway station S1, corrected S2 and derived official SR70 station centroids
        if: matrix.study == 'CZ'
        run: |
          set -euo pipefail
          mkdir -p source/v366/CZ
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 25 --max-time 240 \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx' \
            -o source/v366/CZ/S1.xlsx
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 25 --max-time 240 \
            'https://preslia.cz/appendix/file?id=540' \
            -o source/v366/CZ/S2.xlsx
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 25 --max-time 240 \
            'https://raw.githubusercontent.com/Sap1k/jrunify-ext-geodata/main/rail/SR70.csv' \
            -o source/v366/CZ/SR70.csv
          test "$(stat -c%s source/v366/CZ/S1.xlsx)" = 79261
          test "$(stat -c%s source/v366/CZ/S2.xlsx)" = 13533
          printf '%s  %s\n' \
            df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06 source/v366/CZ/S1.xlsx \
            00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2 source/v366/CZ/S2.xlsx \
            fc43a1969af64f17285c7c6e3a30b00c3994d0ba1cfda6db09d8e4baaa166019 source/v366/CZ/SR70.csv | sha256sum --check
      - name: Download author original 2016 Slovakia 19 stations 318 taxa and original site DMS print
        if: matrix.study == 'SK'
        run: |
          set -euo pipefail
          mkdir -p source/v366/SK
          curl -LfsS --retry 4 --retry-all-errors --retry-delay 4 --connect-timeout 25 --max-time 240 \
            'https://cbrb.sav.sk/usr/Janka/docs/BulletinSBS_2016_Majekova-Limanek.pdf' \
            -o source/v366/SK/original2016.pdf
          test "$(stat -c%s source/v366/SK/original2016.pdf)" = 249373
          printf '%s  %s\n' \
            99465bdd7ed56985e65b1163f16eca4f702fc821619d84c89bf986d4d3736ae1 source/v366/SK/original2016.pdf | sha256sum --check
      - name: True source Overture worldwide rail graph locally joined to source 35 Czech and 19 Slovak real botanical station proxies, independent source audit
        run: |
          mkdir -p results/audit
          if [[ '${{ matrix.study }}' == 'CZ' ]]; then
            python -u scripts/audit_original_CZ_SK_station_GERS_topology_v366.py \
              --study CZ --s1 source/v366/CZ/S1.xlsx --s2 source/v366/CZ/S2.xlsx \
              --sr70 source/v366/CZ/SR70.csv \
              --output results/audit/v366_CZ_source_original_station_GERS_topology.json
          else
            python -u scripts/audit_original_CZ_SK_station_GERS_topology_v366.py \
              --study SK --pdf source/v366/SK/original2016.pdf \
              --output results/audit/v366_SK_source_original_station_GERS_topology.json
          fi
      - name: Archive original study-level only station-to-source network support counts and source provenance, no station coordinates or species
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v366-original-independent-${{ matrix.study }}-railway-station-GERS-source
          path: results/audit/v366_${{ matrix.study }}_source_original_station_GERS_topology.json
          if-no-files-found: warn
