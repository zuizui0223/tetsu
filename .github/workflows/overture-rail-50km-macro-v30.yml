name: v3.0 mapped Overture rail topology for independent 50km macro regions (3-region gate)
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_50km_macro_rail_v30.py'
      - 'src/tetsu/rail_graph.py'
      - 'tests/test_rail_graph_macro.py'
      - 'tests/test_overture_50km_macro_rail_v30.py'
      - '.github/workflows/overture-rail-50km-macro-v30.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-macro-rail-50km-v30
  cancel-in-progress: true
jobs:
  three-independent-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Overture geospatial connector source clients
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Validate 50km EPSG6933 node presence and locality + 75km halo
        run: python -m unittest discover -s tests -p 'test_overture_50km_macro_rail_v30.py' -v
      - name: Fetch mapped actual Overture physical rail connectors in 3 fixed independent source regions
        run: |
          python -u scripts/audit_overture_50km_macro_rail_v30.py \
            --blocks jp_tohoku us_midwest fr_burgundy \
            --output results/audit/overture_50km_3macro_rail_v30.json
      - name: Archive source-backed macro cell graph support without effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-50km-macro-rail-three-outcome-blind-blocks-v30
          path: results/audit/overture_50km_3macro_rail_v30.json
          if-no-files-found: warn
