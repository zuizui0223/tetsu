name: Overture real railway connector topology across Japan and Germany geo cells
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_rail_cell_graph_v21.py'
      - 'tests/test_overture_rail_cell_graph_v21.py'
      - '.github/workflows/overture-rail-graph-v21.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-overture-rail-graph-v21
  cancel-in-progress: true
jobs:
  real-city-rail-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Overture remote geospatial parquet and physical graph clients
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Validate fake connector lines before real graph analysis
        run: python -m unittest discover -s tests -p 'test_overture_rail_cell_graph_v21.py' -v
      - name: Fetch actual Overture mapped rail line geometry with connectors and compute source cell graph
        run: |
          python -u scripts/audit_overture_rail_cell_graph_v21.py \
            --regions jp_sendai de_leipzig \
            --output results/audit/overture_rail_connectors_jp_de_v21.json
      - name: Archive city-level aggregate graph components and mapped connectivity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-actual-rail-connectors-jp-de-v21
          path: results/audit/overture_rail_connectors_jp_de_v21.json
          if-no-files-found: warn
