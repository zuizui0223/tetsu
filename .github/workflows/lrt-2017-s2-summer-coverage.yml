name: LRT 2017 same-season cloud-permissive S2 catalogue (SCL still strict)
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_lrt_2017_july_aug_s2_dates.py'
      - '.github/workflows/lrt-2017-s2-summer-coverage.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-2017-mid-summer-s2-catalogue
  cancel-in-progress: true
jobs:
  seasonal-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public S2 STAC source client
        run: pip install 'requests>=2.31,<3'
      - name: Find 2017 preconstruction same-season acquisitions with verified BOA offsets
        run: python scripts/audit_lrt_2017_july_aug_s2_dates.py --output results/audit/lrt_2017_july_aug_sentinel_scl_candidate_dates.json
      - name: Upload only source acquisition metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utsunomiya-lrt-2017-july-august-sentinel-acquisitions
          path: results/audit/lrt_2017_july_aug_sentinel_scl_candidate_dates.json
          if-no-files-found: warn
