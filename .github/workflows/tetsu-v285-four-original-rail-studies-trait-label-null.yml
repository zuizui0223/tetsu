name: "v28.5 original four railway studies trait-label null: fixed plant communities"
on:
  push:
    branches: [research/tetsu-fourstudy-trait-label-null-v285-20261118]
    paths:
      - 'scripts/audit_Europe_4independent_railstudies_fixed_community_trait_label_null_v285.py'
      - 'tests/test_Europe_4study_fixed_taxa_paired_trait_label_null_v285.py'
      - '.github/workflows/tetsu-v285-four-original-rail-studies-trait-label-null.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: tetsu-v285-original-four-rail-studies-fixed-plant-assemblages-trait-label-null
  cancel-in-progress: true
jobs:
  original-four-independent-publisher-studies-source-gated:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install source authentic XLSX/PDF and numerical readers
        run: python -m pip install 'PyMuPDF==1.24.14' 'openpyxl==3.1.5' 'numpy>=1.26,<3'
      - name: Five mathematical synthetic tests paired 2D trait vectors, frozen source taxon sites and geo bands
        run: python -m unittest discover -s tests -p 'test_Europe_4study_fixed_taxa_paired_trait_label_null_v285.py' -v
      - name: Authenticate Preslia original 2024 39-station S1 and erratum S2
        run: |
          set -euo pipefail
          mkdir -p source/v285/CZ source/v285/IT source/v285/HR source/v285/LEDA results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx' -o source/v285/CZ/S1.xlsx
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://preslia.cz/appendix/file?id=540' -o source/v285/CZ/S2.xlsx
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/v285/CZ/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/v285/CZ/S2.xlsx | sha256sum --check
      - name: Authenticate Italian 2020 Parma 28 true station source museum PDF SHA
        run: |
          set -euo pipefail
          # Original institution TLS expiration documented in original v24.5;
          # this is safe only because source PDF bytes MUST match pinned SHA.
          curl --insecure -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://www.museocivico.rovereto.tn.it/UploadDocs/21188_Art08_Adorni_C_agg_min.pdf' \
            -o source/v285/IT/Parma2020.pdf
          printf '%s  %s\n' \
            'c09bd96ff7307a936030195cc4510bf2591576a713de54019625c04aa9333787' \
            source/v285/IT/Parma2020.pdf | sha256sum --check
      - name: Authenticate genuine Croatian Bosnian one 2017 publisher study original PDF
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://hrcak.srce.hr/file/282429' -o source/v285/HR/Jasprica2017.pdf
          printf '%s  %s\n' \
            '90d489ca8cbc29464d3e6a2b1d8b5d9568c9940e953b1ce720964991366ab956' \
            source/v285/HR/Jasprica2017.pdf | sha256sum --check
      - name: Restore authenticated Slovenian 2026 original author 89 genuine 100m railway sites and metadata
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v285/SI
      - name: Source immutable Slovenian original XLSX checksum
        run: |
          set -euo pipefail
          SRC='source/v285/SI/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx'
          test "$(stat -c%s "$SRC")" = '401279'
          printf '%s  %s\n' \
            '26be7ca9513dd54136d4ec499d8413c1cb288045f87fe3cf8814731f2edac99f' \
            "$SRC" | sha256sum --check
      - name: Restore exact previous original study 82 station functional axes and source audit JSON v24.5
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v245-genuine-Czech39-Italy28-CroatiaBosnia15-stations-shared-LEDA-2D-source-null
          run-id: 44010794675
          github-token: GITHUB_TOKEN_EXPR
          path: source/v285/ref245
      - name: Restore exact previous original independent Slovenian source 89 real field sites audit v24.6
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v246-SI-fourth-independent-author-89-track-locations-Europe-frozen-LEDA-2D-study-comparison
          run-id: 44011602082
          github-token: GITHUB_TOKEN_EXPR
          path: source/v285/ref246
      - name: Restore pinned original Oldenburg University LEDA paired trait coordinates
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source/v285/LEDA/canopy_height.txt
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source/v285/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source/v285/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source/v285/LEDA/seed_mass.txt | sha256sum --check
      - name: Execute FOUR independent source studies fixed floras two-trait-vector permutations preserving study trait covariance
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/audit_Europe_4independent_railstudies_fixed_community_trait_label_null_v285.py \
            --cz-s1 source/v285/CZ/S1.xlsx --cz-s2 source/v285/CZ/S2.xlsx \
            --it-pdf source/v285/IT/Parma2020.pdf --hr-pdf source/v285/HR/Jasprica2017.pdf \
            --si-xlsx source/v285/SI/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --si-audit source/v285/SI/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --v245-audit source/v285/ref245/v245_Europe_3_real_rail_flora_studies_82stations_same_2D_LEDA_beta_source_null.json \
            --v246-audit source/v285/ref246/v246_fourth_independent_Slovenia_89_author_rail_track_locations_European_frozen_trait_axes.json \
            --height source/v285/LEDA/canopy_height.txt \
            --seed source/v285/LEDA/seed_mass.txt \
            --output results/audit/v285_Europe_4_original_rail_field_studies_frozen_plant_matrix_permutes_trait_names.json \
            --draws 299
      - name: Archive ONLY four separate original study macro trait results, not raw PDF or station species
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v285-four-authentic-European-rail-studies-fixed-plant-site-trait-label-null
          path: results/audit/v285_Europe_4_original_rail_field_studies_frozen_plant_matrix_permutes_trait_names.json
          if-no-files-found: warn
