name: "v4.3a Four independent 50km macro RAIL shortest-path source blocks"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - '.github/workflows/rail-50km-expansion-v43.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-rail-50km-four-new-blocks-v43
  cancel-in-progress: true
jobs:
  source-rail-paths:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        block:
          - ca_ontario
          - gb_yorkshire
          - de_saxony
          - au_southeast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Overture 50km geographic graph clients
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Validate physical rail path and map junction integrity
        run: python -m unittest discover -s tests -p 'test_overture_50km_rail_paths_v32.py' -v
      - name: Query actual 2026-10 Overture physical rail paths on source-frozen equal-area macro block
        run: |
          python -u scripts/audit_overture_50km_rail_paths_v32.py \
            --blocks ${{ matrix.block }} \
            --output results/audit/overture_50km_rail_paths_${{ matrix.block }}_v43.json
      - name: Preserve source rail paths and both outcome-blind anchor strategies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-50km-rail-physical-paths-${{ matrix.block }}-v43
          path: results/audit/overture_50km_rail_paths_${{ matrix.block }}_v43.json
          if-no-files-found: warn
