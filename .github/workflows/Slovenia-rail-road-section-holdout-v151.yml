name: "v15.1 REAL Slovenia rail-vs-road path held-out taxonomic identity and source fixed-margins null"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - 'scripts/analyze_Slovenia_rail_road_heldout_species_identity_v151.py'
      - 'tests/test_Slovenia_rail_road_heldout_identity_v151.py'
      - '.github/workflows/Slovenia-rail-road-section-holdout-v151.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v151-2024-osm-89-real-field-road-control-cv
  cancel-in-progress: true
jobs:
  true-public-author-data-section-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install physical real-graph original OSM parser and stable numeric dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'osmium==4.2.0'
      - name: Verify section-holdout outcome-leakage and source-collinearity nonidentification before field result
        run: |
          python -m unittest discover -s tests -p 'test_Slovenia_true_OSM_rail_road_paths_v150.py' -v
          python -m unittest discover -s tests -p 'test_Slovenia_rail_road_heldout_identity_v151.py' -v
      - name: Fetch same original 2022-2023 Slovenian 89-site author plant source with SHA audit
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/SLO151/authentic
      - name: Check retained fixed-date Geofabrik Slovenia 2024 OSM PBF from runner cache
        uses: actions/cache@v4
        with:
          path: source/SLO151/osm/slovenia-240101.osm.pbf
          key: tetsu-Geofabrik-Slovenia-20240101-source-file-280842431-bytes-v1
      - name: Fetch exact archive only if absent from source cache; never commit/rehost OSM PBF
        run: |
          set -euo pipefail
          mkdir -p source/SLO151/osm
          if ! test -s source/SLO151/osm/slovenia-240101.osm.pbf; then
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 900 \
              --user-agent 'tetsu-research-topology-audit/1.0' \
              --output source/SLO151/osm/slovenia-240101.osm.pbf \
              'https://download.geofabrik.de/europe/slovenia-240101.osm.pbf'
          fi
          test "$(stat --format=%s source/SLO151/osm/slovenia-240101.osm.pbf)" = "280842431"
          sha256sum source/SLO151/osm/slovenia-240101.osm.pbf
      - name: Fit actual 15-line-section-heldout road-control rail-increment CV and conditioned identity fixed-source-frequency null
        run: |
          python -u scripts/analyze_Slovenia_rail_road_heldout_species_identity_v151.py \
            --original-xlsx source/SLO151/authentic/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit102 source/SLO151/authentic/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --osm-pbf source/SLO151/osm/slovenia-240101.osm.pbf \
            --output results/audit/SLO_2024_OSM_real_rail_road_species_identity_heldout_v151.json
      - name: Archive aggregate source-provenance/statistical diagnostic only; no original source PBF/XLSX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Slovenia-real-rail-road-conditional-identity-v151
          path: results/audit/SLO_2024_OSM_real_rail_road_species_identity_heldout_v151.json
          if-no-files-found: warn
