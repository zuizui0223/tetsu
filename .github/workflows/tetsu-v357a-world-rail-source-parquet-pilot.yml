name: "v357a source Overture public S3 parquet rail-only scanner pilot"
on:
  push:
    branches: [research/tetsu-v356-global-complete-rail-graph-20261124]
    paths:
      - 'scripts/extract_entire_world_Overture_rail_parquet_v357.py'
      - 'tests/test_global_Overture_all_rail_scan_v357.py'
      - '.github/workflows/tetsu-v357a-world-rail-source-parquet-pilot.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: v357a-Overture-original-one-file-source-pilot
  cancel-in-progress: true
jobs:
  original_s3_rail_reader_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install official Arrow S3 anonymous reader and geodesic source tools
        run: python -m pip install 'boto3>=1.35,<2' 'pyarrow>=18,<25' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Frozen source inventory and all rail class semantics tests
        run: |
          python -m unittest discover -s tests -p 'test_global_Overture_all_rail_scan_v357.py' -v
          python -m py_compile scripts/extract_entire_world_Overture_rail_parquet_v357.py
      - name: Read original first worldwide Overture source Parquet 65k rows only (not global result)
        run: |
          python -u scripts/extract_entire_world_Overture_rail_parquet_v357.py \
            --mode pilot --shard 0 \
            --output results/audit/v357a_source_rail_parquet_reader_pilot_only.json
      - name: Archive first genuine source 65k row reader QA, not full railway census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v357a-one-global-source-parquet-reader-pilot-only
          path: results/audit/v357a_source_rail_parquet_reader_pilot_only.json
          if-no-files-found: warn
