name: "v5.4 All pre-frozen eight-country ten-block 50km GRIIS source K20-K320 replication feasibility"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_all_frozen_macro_K80_support_v54.py'
      - 'tests/test_all_frozen_macro_K80_support_v54.py'
      - '.github/workflows/frozen-macro-K80-feasibility-v54.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-frozen-10macroblock-record-source-opportunity-v54
  cancel-in-progress: true
jobs:
  original-geography-outcome-blind-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original EPSG6933 macro source registry dependencies
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Test no-outcome-driven region K20 to K320 indexed source opportunity gates
        run: python -m unittest discover -s tests -p 'test_all_frozen_macro_K80_support_v54.py' -v
      - name: Retrieve frozen 10-block original historical country-GRIIS introduced-plant speciesKey indexed source
        uses: actions/download-artifact@v4
        with:
          name: griis-50km-10block-8country-introduced-species-source-v36
          run-id: 42761140912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/flora
      - name: Count actual K20 K40 K80 K160 K320 source-eligible equal-area geography BEFORE rail/road matching
        run: |
          python -u scripts/audit_all_frozen_macro_K80_support_v54.py \
            --flora source/flora/griis_50km_10blocks_country_mask_v36.json \
            --output results/audit/frozen_10macroblock_K80_source_feasibility_v54.json
      - name: Preserve ALL ten source-country block eligibility including JP NZ low recorded source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-predeclared-10macroblock-GRIIS-source-depth-feasibility-v54
          path: results/audit/frozen_10macroblock_K80_source_feasibility_v54.json
          if-no-files-found: warn
