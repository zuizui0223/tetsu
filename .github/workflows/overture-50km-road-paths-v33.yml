name: v3.3 Continuous Overture ROAD network shortest paths for 50km macro source cells
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_50km_road_paths_v33.py'
      - 'tests/test_overture_50km_road_paths_v33.py'
      - '.github/workflows/overture-50km-road-paths-v33.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-overture-road-50km-continuous-v33
  cancel-in-progress: true
jobs:
  us-fr-two-block-source-road-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Overture cloud parquet and GIS clients
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Verify equal-area ROAD network source endpoints and real shortest path calculations
        run: python -m unittest discover -s tests -p 'test_overture_50km_road_paths_v33.py' -v
      - name: Fetch actual Overture 2026-10 ROAD connections and continuous routes in US FR 50km study blocks
        run: |
          python -u scripts/audit_overture_50km_road_paths_v33.py \
            --blocks us_midwest fr_burgundy \
            --output results/audit/overture_50km_macro_road_paths_v33.json
      - name: Archive road cell-to-cell physical path distances and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-50km-continuous-road-physical-paths-us-fr-v33
          path: results/audit/overture_50km_macro_road_paths_v33.json
          if-no-files-found: warn
