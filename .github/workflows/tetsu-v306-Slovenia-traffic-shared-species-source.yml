name: "v306 authentic Slovenia freight-shared plant species and occupancy null"
on:
  push:
    branches: [research/tetsu-v306-SI-traffic-shared-species-20261120]
    paths:
      - 'scripts/analyze_Slovenia_traffic_shared_species_v306.py'
      - 'tests/test_Slovenia_traffic_shared_species_v306.py'
      - '.github/workflows/tetsu-v306-Slovenia-traffic-shared-species-source.yml'
      - 'docs/tetsu_v306_shared_species_traffic_falsification_prereg_ja.md'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: tetsu-v306-genuine-SI-2020-freight-taxon-and-margins
  cancel-in-progress: true
jobs:
  source-original-plant-taxonomy-historical-traffic-and-margins:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install genuine station operator PDF tables decoder, not OCR
        run: python -m pip install 'numpy>=1.26,<3' 'pdfplumber==0.11.7'
      - name: Mathematical physical segment and exact original 48 within-line traffic reassignments
        run: |
          python -m unittest discover -s tests -p 'test_Slovenia_traffic_shared_species_v306.py' -v
          python -m unittest discover -s tests -p 'test_Slovenia_real_train_freight_local_species_coupling_v275.py' -v
      - name: Restore source authentic author Slovenia original plant XLSX
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v306/Slovenia
      - name: Verify original CC-BY publisher source sha256 401279 bytes
        run: |
          set -euo pipefail
          SOURCE='source/v306/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx'
          test "$(stat -c%s "$SOURCE")" = '401279'
          printf '%s  %s\n' \
            '26be7ca9513dd54136d4ec499d8413c1cb288045f87fe3cf8814731f2edac99f' \
            "$SOURCE" | sha256sum --check
      - name: Retrieve operator 2023 TRUE railway station route chainage PDF and verify SHA in source code
        run: |
          set -euo pipefail
          mkdir -p source/v306/official results/audit
          curl -LfsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'tetsu-v306-original-shared-species-freight/1.0' \
            'https://infrastruktura.sz.si/wp-content/uploads/2023/02/NS_2023_1.2_Annex_2B_Stations.pdf' \
            -o source/v306/official/NS_2023_1.2_Annex_2B_Stations.pdf
          test "$(stat -c%s source/v306/official/NS_2023_1.2_Annex_2B_Stations.pdf)" -gt 50000
          sha256sum source/v306/official/NS_2023_1.2_Annex_2B_Stations.pdf
      - name: Original source exact v305 baseline and new taxon-level freight coefficients with fixed site/frequency margins
        run: |
          python -u scripts/analyze_Slovenia_traffic_shared_species_v306.py \
            --source-xlsx source/v306/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit source/v306/Slovenia/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --station-pdf source/v306/official/NS_2023_1.2_Annex_2B_Stations.pdf \
            --v305-frozen data/derived/v305_traffic_urbanization.json \
            --output results/audit/v306_source_Slovenia_traffic_shared_species.json

      - name: Independent aggregate consistency and full source support gating
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,math
          j=json.loads(Path("results/audit/v306_source_Slovenia_traffic_shared_species.json").read_text())
          assert (j["n_true_original_botanical_sites"],j["n_mapped_traffic_sites"],
                  j["n_true_traffic_segments"],j["n_DEpendent_segment_pairs_not_independent"],
                  j["n_original_study_programmes"])==(89,27,9,36,1)
          for zone,z in j["zones"].items():
              assert z["sum_taxon_contributions_reproduces_v305"]
              b=z["no_urban_observed_freight_slope"]
              g=z["source_defined_guilds"]
              assert math.isclose(b,g["explicit_alien"]["signed_contribution_sum"]+
                  g["not_explicitly_alien_INCLUDES_native_unknown_crop"]["signed_contribution_sum"],abs_tol=1e-10)
              for null in z["source_full_89_site_frequency_fixed_null"].values():
                  assert null["source_full_89_site_taxon_incidence_margins_FROZEN"]
                  assert null["n_technical_correlated_draws_NOT_field_replicates"]==398
              assert z["true_national_line_48_freight_label_assignments"]["n_permuted_traffic_assignments_within_true_lines"]==48
          print("Original-source v306 ecology/mathematical independent aggregate QA PASS")
          PY
      - name: Archive only nine-source physical segment aggregate, no site GPS or species
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v306-original-SI-traffic-shared-species-frequency-null
          path: results/audit/v306_source_Slovenia_traffic_shared_species.json
          if-no-files-found: warn
