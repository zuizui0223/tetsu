name: "v339 Kashmir C4 attribution on authentic source railway plots"
on:
  push:
    branches:
      - research/tetsu-Kashmir-C4-thermal-mechanism-v339-20261123
    paths:
      - 'scripts/analyze_Kashmir_C4_mechanism_v339.py'
      - 'tests/test_Kashmir_C4_mechanism_v339.py'
      - '.github/workflows/tetsu-v339-C4-Kashmir-thermal-attribution.yml'
  pull_request:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_Kashmir_C4_mechanism_v339.py'
      - 'tests/test_Kashmir_C4_mechanism_v339.py'
      - '.github/workflows/tetsu-v339-C4-Kashmir-thermal-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-original-rail-C4-thermal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source EIVE and geospatial 1-to-1 matching libraries
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Verify 6 synthetic C4 mathematical and source-classification tests
        run: python -m unittest discover -s tests -p 'test_Kashmir_C4_mechanism_v339.py' -v
      - name: Verify post-result C4 versus Cynodon taxon shuffle tests
        run: python -m unittest discover -s tests -p 'test_Kashmir_C4_Cynodon_specificity_v339b.py' -v
      - name: Acquire SHA-frozen genuine Kashmir 2014/2017 railway plant field plots
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir()
                  and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Source XLSX file must be unique')
              with z.open(files[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
           '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
           source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Acquire SHA-frozen independently published EIVE temperature niches
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
           '0f0ce19cd2a781eeed027d8b0acadbcb' \
           source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Reproduce original rail CWM and test exact C4-deletion effects
        run: |
          python -u scripts/analyze_Kashmir_C4_mechanism_v339.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v339_Kashmir_C4_thermal_attribution_aggregate.json
      - name: Post-result taxon-level grass-label shuffle and one-species specificity
        run: |
          python -u scripts/analyze_Kashmir_C4_Cynodon_specificity_v339b.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v339b_Kashmir_C4_vs_Cynodon_aggregate.json
      - name: Archive only aggregate C4 and EIVE effects, never original site x species matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v339-authentic-Kashmir-C4-thermal-mechanism-aggregates
          path: |
            results/audit/v339_Kashmir_C4_thermal_attribution_aggregate.json
            results/audit/v339b_Kashmir_C4_vs_Cynodon_aggregate.json
          if-no-files-found: warn
