name: "v337 Kashmir quadrat-abundance vs occurrence within-plot thermal trait covariance"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_Kashmir_abundance_trait_covariance_withinplot_v337.py'
      - 'tests/test_Kashmir_abundance_trait_covariance_withinplot_v337.py'
      - '.github/workflows/tetsu-v337-Kashmir-source-abundance-EIVE-plot-shuffle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-railway-same-plot-abundance-temperature-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original XLSX reader, scientific matching requirements
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Test source-abundance EIVE covariance identity and conditional plot null
        run: python -m unittest discover -s tests -p 'test_Kashmir_abundance_trait_covariance_withinplot_v337.py' -v
      - name: Source authentic Kashmir original Dryad version 99735 species abundance workbook
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir()
                      and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:
                  raise ValueError('Not exactly one authentic original Dryad Kashmir source matrix')
              with z.open(files[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Independently verify EIVE ecological temperature indicator source
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: True same-site, source-abundance vs presence thermal covariance and within-plot abundance-null
        run: |
          python -u scripts/analyze_Kashmir_abundance_trait_covariance_withinplot_v337.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v337_Kashmir_quadrat_abundance_temperature_withinplot_shuffle.json
      - name: Archive only source-authenticated aggregate abundance-temperature covariance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v337-Kashmir-field-abundance-thermal-withinplot-null-aggregate
          path: results/audit/v337_Kashmir_quadrat_abundance_temperature_withinplot_shuffle.json
          if-no-files-found: warn
