name: "v328 genuine Kashmir paired-year track and interior EIVE turnover audit"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_Kashmir_EIVE_temporal_community_turnover_v328.py'
      - 'tests/test_Kashmir_EIVE_temporal_community_turnover_v328.py'
      - '.github/workflows/tetsu-v328-Kashmir-temporal-thermal-turnover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-original-rail-temporal-thermal-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source XLSX reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Run seven synthetic tests of paired temporal source EIVE and missing data
        run: python -m unittest discover -s tests -p 'test_Kashmir_EIVE_temporal_community_turnover_v328.py' -v
      - name: Get official Dryad source version 99735 and exact SHA
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              found=[f for f in z.infolist() if not f.is_dir()
                     and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(found)!=1:raise ValueError('Original Dryad version must contain exactly one original Matrix_plot.xlsx')
              with z.open(found[0]) as infile,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as outfile:
                  shutil.copyfileobj(infile,outfile)
          PY
          printf '%s  %s\n' \
           '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
           source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Get external EIVE thermal species preference and width source SM08
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
           '0f0ce19cd2a781eeed027d8b0acadbcb' \
           source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Reanalyze source-verified original 2014 and 2017 recorded taxon changes in railway plot and interior
        run: |
          python -u scripts/analyze_Kashmir_EIVE_temporal_community_turnover_v328.py \
           --kashmir-original source/Kashmir/Matrix_plot.xlsx \
           --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
           --output results/audit/v328_Kashmir_2014_2017_original_source_thermal_turnover.json
      - name: Archive summary only, not original Dryad field plot by species matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v328-India-original-temporal-thermal-turnover-aggregate
          path: results/audit/v328_Kashmir_2014_2017_original_source_thermal_turnover.json
          if-no-files-found: warn
