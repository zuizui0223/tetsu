name: "v396 original optimal matched mapped rail presence"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_rail_presence_matched_v396.py'
      - 'tests/test_global_rail_presence_matched_v396.py'
      - '.github/workflows/tetsu-v396-rail-presence-matched.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_rail_presence_matched_v396.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v383-coarse-cell-naturalized-counts-only
          run-id: 45404886620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v396/cells
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v396/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v396/road
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v391-original-JRC-GHS-POP2020-global-coarse-counts
          run-id: 45425219960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v396/pop
      - name: Exact v395 binary replay then optimal local matching
        run: |
          python -u scripts/analyze_global_rail_presence_matched_v396.py \
            --cells source/v396/cells/v383_original_coarse_cell_counts.json \
            --tree source/v396/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road source/v396/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --population source/v396/pop/v391_original_global_GHS_POP2020_100km_200km.json \
            --out results/audit/v396_original_rail_presence_matched.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v396-original-rail-presence-matched
          path: results/audit/v396_original_rail_presence_matched.json
          if-no-files-found: error
