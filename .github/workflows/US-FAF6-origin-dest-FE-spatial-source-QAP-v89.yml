name: "v8.9 REAL US 2022 FAF6 directional freight vs 48-state GRIIS recorded flora origin/dest FE + Census-constrained node null"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/validate_US_FAF6_GRIIS_dyadic_FE_spatial_QAP_v89.py'
      - 'tests/test_US_FAF6_GRIIS_dyadic_FE_spatial_QAP_v89.py'
      - '.github/workflows/US-FAF6-origin-dest-FE-spatial-source-QAP-v89.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-US-2022-FAF-GRIIS-origin-dest-FE-QAP-v89
  cancel-in-progress: true
jobs:
  true-source-directed-state-FE-QAP:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine Census GBIF GRIIS FAF6 network math dependencies
        run: pip install 'requests>=2.31,<3' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Test exact directed state-pair fixed effect controls and region-constrained node relabeling
        run: |
          OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_US_FAF6_GRIIS_dyadic_FE_spatial_QAP_v89.py' -v
      - name: Download 2022 real FAF6 original crop RAIL vs TRUCK directed state OD economic source
        uses: actions/download-artifact@v4
        with:
          name: real-US-2022-FAF6-RAIL-TRUCK-crop-state-OD-network-v80
          run-id: 43142647675
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/FA80
      - name: Download 51 Census-state GBIF country-listed GRIIS recorded source
        uses: actions/download-artifact@v4
        with:
          name: real-US-all51-state-GRIIS-GBIF-2018-25-v82
          run-id: 43144396513
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/GBIF82
      - name: Download 2018-21 vs 2023-25 pre/post US48 GRIIS source taxon records
        uses: actions/download-artifact@v4
        with:
          name: real-US51-state-GRIIS-GBIF-before-after-FAF2022-v85
          run-id: 43153476962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/GBIF85
      - name: Download successful verified original directional source rho baseline v8.6
        uses: actions/download-artifact@v4
        with:
          name: real-US-FAF6-2022-directional-recorded-source-taxa-v86
          run-id: 43154108559
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/BASE86
      - name: Fit actual 48-state origin+destination FE and run Census-stratified 2022 RAIL/TRUCK network node-label null source diagnostics
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/validate_US_FAF6_GRIIS_dyadic_FE_spatial_QAP_v89.py \
            --temporal85 source/GBIF85/US_51_state_GRIIS_GBIF_pre2018_21_post2023_25_v85.json \
            --freight80 source/FA80/BTS_FAF6_2022_crop_OD_RAIL_vs_TRUCK_network_v80.json \
            --flora82 source/GBIF82/US_all51_state_GRIIS_GBIF_2018_25_source_v82.json \
            --baseline86 source/BASE86/US_FA6_2022_directional_source_recorded_taxa_v86.json \
            --output results/audit/US_FA6_2022_directed_state_FEs_spatial_node_null_v89.json
      - name: Preserve ALL restricted null modes, original rho and source limitations without biological causal claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-US48-FAF6-GRIIS-origin-destination-FE-node-null-v89
          path: results/audit/US_FA6_2022_directed_state_FEs_spatial_node_null_v89.json
          if-no-files-found: warn
