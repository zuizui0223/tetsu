name: "v28.6 genuine Czech 14 rail stations vs 70 local nonrail-context plots canopy height beta"
on:
  push:
    branches: [research/tetsu-Czech-nearby-nonrail-height-beta-v286-20261118]
    paths:
      - 'scripts/audit_Czech_original_rail_vs_local_CzechVeg_height_seed_beta_v286.py'
      - 'tests/test_Czech_14station_local_nonrail_height_beta_v286.py'
      - '.github/workflows/tetsu-v286-Czech-14rail-70nonrail-height-beta.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v286-genuine-CZ-station-rail-vs-local-independent-reference-height
  cancel-in-progress: true
jobs:
  genuine-publisher-railway-and-independent-geo-unique-local-plant-source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original Preslia/CzechVeg source readers and EXACT 0/1 MILP solver
        run: python -m pip install 'openpyxl==3.1.5' 'numpy==2.1.3' 'scipy==1.14.1'
      - name: Independent 1D height/seed CWM, source geo-strata and no-fake-reference QA
        run: python -m unittest discover -s tests -p 'test_Czech_14station_local_nonrail_height_beta_v286.py' -v
      - name: Retrieve author original Czech railway 39 station 2020-22 S1 and corrected S2
        run: |
          set -euo pipefail
          mkdir -p source/v286/Preslia source/v286/CzechVeg source/v286/LEDA results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx' -o source/v286/Preslia/S1.xlsx
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://preslia.cz/appendix/file?id=540' -o source/v286/Preslia/S2.xlsx
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/v286/Preslia/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/v286/Preslia/S2.xlsx | sha256sum --check
      - name: Obtain independently derived Czech railway SR70 official station registry with original source SHA
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://raw.githubusercontent.com/Sap1k/jrunify-ext-geodata/main/rail/SR70.csv' -o source/v286/Preslia/SR70.csv
          printf '%s  %s\n' \
            'fc43a1969af64f17285c7c6e3a30b00c3994d0ba1cfda6db09d8e4baaa166019' source/v286/Preslia/SR70.csv | sha256sum --check
      - name: True CzechVeg source 2026 original 117739 plot headers and all 2510340 species observations
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 750 \
            'https://zenodo.org/api/records/19231152/files/CzechVeg-Open_headers_v1-1_2026-03-26.csv/content' \
            -o source/v286/CzechVeg/headers.csv
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 1400 \
            'https://zenodo.org/api/records/19231152/files/CzechVeg_Open_species_v1-1_2026-03-26.csv/content' \
            -o source/v286/CzechVeg/species.csv
          printf '%s  %s\n' \
            '0bc920462d1f9eac473e7b2a231e6782' source/v286/CzechVeg/headers.csv \
            'b296e5e19f03fb3bad0a8347c317f8a3' source/v286/CzechVeg/species.csv | md5sum --check
      - name: Original Oldenburg LEDA 2D species height seed median trait tables strict source SHA256
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' -o source/v286/LEDA/canopy_height.txt
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' -o source/v286/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source/v286/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source/v286/LEDA/seed_mass.txt | sha256sum --check
      - name: Certify original v24.4 14 railway 70 fully unique reference plot MILP source then calculate HEIGHT vs SEED CWM beta
        env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
        run: |
          python -u scripts/audit_Czech_original_rail_vs_local_CzechVeg_height_seed_beta_v286.py \
            --s1 source/v286/Preslia/S1.xlsx \
            --s2 source/v286/Preslia/S2.xlsx \
            --sr70 source/v286/Preslia/SR70.csv \
            --headers source/v286/CzechVeg/headers.csv \
            --species source/v286/CzechVeg/species.csv \
            --height source/v286/LEDA/canopy_height.txt \
            --seed source/v286/LEDA/seed_mass.txt \
            --output results/audit/v286_source_Czech14_station_70_nontransport_plant_height_seed_beta.json \
            --draws 100
      - name: Publish only original study data-derived macro height/seed CWM statistics and original-source QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v286-Czech-Preslia14-rail-vs-70-true-local-CzechVeg-height-seed-beta
          path: results/audit/v286_source_Czech14_station_70_nontransport_plant_height_seed_beta.json
          if-no-files-found: warn
