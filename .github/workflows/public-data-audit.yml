name: Public-source reproducibility audit (not an ecological test)

on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_public_data.py'
      - 'scripts/summarize_alien_checklist.py'
      - '.github/workflows/public-data-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: pip install 'requests>=2.31,<3' 'openpyxl>=3.1,<4' 'pyshp>=2.3,<3'
      - name: Audit Japanese rail, alien plant checklist and GBIF counts
        run: python scripts/audit_public_data.py --strict --output results/audit/public_sources.json
      - name: Summarize real introduced-taxon pathway labels
        run: python scripts/summarize_alien_checklist.py
      - name: Upload source audit (no licensed raw data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-source-audit
          path: results/audit/*.json
          if-no-files-found: warn
