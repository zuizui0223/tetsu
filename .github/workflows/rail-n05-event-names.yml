name: N05 recent rail opening and provisional terminal route-label verification
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_n05_event_name_candidates.py'
      - '.github/workflows/rail-n05-event-names.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-n05-route-label-review
  cancel-in-progress: true
jobs:
  route-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source readers
        run: pip install 'requests>=2.31,<3' 'pyshp>=2.3,<3'
      - name: Verify route name and transition code for candidate event groups
        run: python scripts/audit_n05_event_name_candidates.py --output results/audit/n05_recent_route_names_for_source_verification.json
      - name: Preserve only derived route labels, no licensed line geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n05-rail-2010-2025-candidate-route-verified-names
          path: results/audit/n05_recent_route_names_for_source_verification.json
          if-no-files-found: warn
