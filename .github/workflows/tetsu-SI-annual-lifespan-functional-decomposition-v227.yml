name: "v22.7 real Slovenia BS BT annual lifespan decomposition of 2D continuous functional breadth"
on:
  push:
    branches: [research/tetsu-slovenia-identity-guild-v210-20261116]
    paths:
      - 'scripts/analyze_Slovenia_annual_trait_variance_decomposition_v227.py'
      - 'tests/test_SI_annual_trait_variance_decomposition_v227.py'
      - '.github/workflows/tetsu-SI-annual-lifespan-functional-decomposition-v227.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v227-real-SI-annual-within-between-variance
  cancel-in-progress: true
jobs:
  original-rail-site-breadth-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify mathematical variance identity and annual mix null on synthetic examples only
        run: python -m unittest discover -s tests -p 'test_SI_annual_trait_variance_decomposition_v227.py' -v
      - name: Retrieve authentic source-locked Slovenian author original 2026 plant-zone XLSX and SHA audit
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v227/Slovenia
      - name: Exact original-author source SHA fingerprint
        run: |
          set -euo pipefail
          F='source/v227/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx'
          test "$(stat -c%s "$F")" = 401279
          printf '%s  %s\n' '26be7ca9513dd54136d4ec499d8413c1cb288045f87fe3cf8814731f2edac99f' "$F" | sha256sum --check
      - name: Download original LEDA height and seed mass tables from academic source
        run: |
          set -euo pipefail
          mkdir -p source/v227/LEDA
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source/v227/LEDA/canopy_height.txt
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source/v227/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source/v227/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source/v227/LEDA/seed_mass.txt \
            | sha256sum --check
      - name: Real original-source life-history trait variance within between decomposition + locally matched null
        run: |
          python -u scripts/analyze_Slovenia_annual_trait_variance_decomposition_v227.py \
            --original-xlsx source/v227/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit source/v227/Slovenia/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --height source/v227/LEDA/canopy_height.txt \
            --seed source/v227/LEDA/seed_mass.txt \
            --output results/audit/v227_SI_real_annual_mixture_trait_spread.json
      - name: Archive reproducible aggregate metrics only; no author source species×site rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v227-source-SI-annual-composition-2D-variance-decomposition
          path: results/audit/v227_SI_real_annual_mixture_trait_spread.json
          if-no-files-found: warn
