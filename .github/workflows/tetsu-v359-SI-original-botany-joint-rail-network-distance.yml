name: "v359 original Slovenian rail botany joint real network and geographic distance"
on:
  push:
    branches: [research/tetsu-v356-global-complete-rail-graph-20261124]
    paths:
      - 'scripts/analyze_Slovenia_geod_and_rail_distance_matched_v359.py'
      - 'tests/test_Slovenia_original_geod_and_rail_distance_v359.py'
      - '.github/workflows/tetsu-v359-SI-original-botany-joint-rail-network-distance.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v359-Slovenia-authentic-rail-network-and-geodesic-matched
  cancel-in-progress: true
jobs:
  original_source_89site_Slovenia_physical_rail_distance_contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install genuine original Overture rail graph source and ecological analysis tools
        run: python -m pip install 'overturemaps==2.1.1' 'networkx>=3.4,<4' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pyarrow>=18,<25'
      - name: Numeric and nonbiological original joint-network-distance site matching QA
        run: |
          python -m unittest discover -s tests -p 'test_Slovenia_original_geod_and_rail_distance_v359.py' -v
          python -m py_compile scripts/analyze_Slovenia_geod_and_rail_distance_matched_v359.py
      - name: Fetch original genuine 401279-byte Slovenian publisher botanical supplementary and its source audit
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v359/slovenia
      - name: Validate 2026 original Springer botanical data bytes and SHA
        run: |
          set -euo pipefail
          FILE=source/v359/slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx
          test "$(stat -c%s "$FILE")" = 401279
          printf '%s  %s\n' \
            26be7ca9513dd54136d4ec499d8413c1cb288045f87fe3cf8814731f2edac99f \
            "$FILE" | sha256sum --check
      - name: True source physical connector railway km matched to actual 89 plant transects, no post hoc source site selection
        run: |
          python -u scripts/analyze_Slovenia_geod_and_rail_distance_matched_v359.py \
            --original-xlsx source/v359/slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit source/v359/slovenia/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --output results/audit/v359_Slovenia_original_botany_joint_rail_geo_distance_matched.json
      - name: Archive ONLY source section-level true network matched Jaccard aggregates (no original field identities)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v359-real-source-Slovenia-line-botany-joint-Overture-distance
          path: results/audit/v359_Slovenia_original_botany_joint_rail_geo_distance_matched.json
          if-no-files-found: warn
