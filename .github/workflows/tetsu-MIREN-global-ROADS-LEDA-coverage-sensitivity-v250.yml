name: "v25.0 global MIREN mountain ROADS functional beta missing trait sensitivity, 5/10 taxa 25/50pct thresholds"
on:
  push:
    branches: [research/tetsu-slovenia-identity-guild-v210-20261116]
    paths:
      - 'scripts/validate_MIREN_global_ROAD_2D_LEDA_coverage_sensitivity_v250.py'
      - 'tests/test_MIREN_global_ROADS_trait_missingness_v250.py'
      - '.github/workflows/tetsu-MIREN-global-ROADS-LEDA-coverage-sensitivity-v250.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v250-original-global-MIREN-LEDA-sensitivity
  cancel-in-progress: true
jobs:
  authentic-source-global-roads-LEDA-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify original region road site year plot pairing, no repeated source year and same survey area
        run: python -m unittest discover -s tests -p 'test_global_MIREN_road_interior_not_railway_v249.py' -v
      - name: Retrieve first-party global MIREN mountain ROADS original Zenodo v3 17.9MB 2007-2023 25region plant survey
        run: |
          set -euo pipefail
          mkdir -p source_original/v250/MIREN
          curl -LfsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 350 \
            'https://zenodo.org/records/15749536/files/MIREN_road_survey_%282007-2023%29_zen_v3_002507.csv?download=1' \
            -o source_original/v250/MIREN/MIREN_original_2007_2023.csv
          printf '%s  %s\n' 'b640195cc44f252ccb6ddb28eb6fff13' \
            source_original/v250/MIREN/MIREN_original_2007_2023.csv | md5sum --check
      - name: Retrieve source original Oldenburg LEDA canopy height and seed mass with fixed SHA
        run: |
          set -euo pipefail
          mkdir -p source_original/v250/LEDA
          curl -LfsS --retry 4 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source_original/v250/LEDA/canopy_height.txt
          curl -LfsS --retry 4 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source_original/v250/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source_original/v250/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source_original/v250/LEDA/seed_mass.txt \
            | sha256sum --check
      - name: "MIREN 25-region roads source species×plot functional beta threshold sensitivity at 5/10 original species and 25/50 percent LEDA coverage"
        run: |
          python -u scripts/validate_MIREN_global_ROAD_2D_LEDA_coverage_sensitivity_v250.py \
            --miren source_original/v250/MIREN/MIREN_original_2007_2023.csv \
            --height source_original/v250/LEDA/canopy_height.txt \
            --seed source_original/v250/LEDA/seed_mass.txt \
            --output results/audit/v250_MIREN_global_ROAD_25region_2D_LEDA_trait_missingness_threshold_sensitivity.json
      - name: Archive only source real global region aggregates and all-source QA, not raw original CSV/GPS/taxa×plot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v250-source-verified-MIREN-global-ROADS-25region-LEDA25pct50pct-five-ten-taxon-QA
          path: results/audit/v250_MIREN_global_ROAD_25region_2D_LEDA_trait_missingness_threshold_sensitivity.json
          if-no-files-found: warn
