name: "v15.7 REAL Czech Preslia original archaeophyte versus neophyte geography and source frequencies"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - 'scripts/analyze_Czech_2024_real_archaeophyte_neophyte_geographic_identity_v157.py'
      - 'tests/test_Czech_2024_original_alien_status_spatial_identity_v157.py'
      - '.github/workflows/Czech-original-arch-neo-geographic-source-v157.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-czech-v157-original-archaeophyte-neophyte-source-by-geography
  cancel-in-progress: true
jobs:
  authentic-original-Czech-railway-arch-neo-flora:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed author-original source XLSX reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Assert explicit author original alien categories and valid fixed species-frequency nulls
        run: python -m unittest discover -s tests -p 'test_Czech_2024_original_alien_status_spatial_identity_v157.py' -v
      - name: Download exact same original Czech 2024 Preslia S1 corrected S2 and source Pladias trait tables
        run: |
          set -euo pipefail
          mkdir -p source/CZE157
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE157/S1.xlsx \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE157/S2.xlsx \
            'https://preslia.cz/appendix/file?id=540'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE157/diaspore.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/141/lang/en'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE157/lifeform.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/136/lang/en'
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/CZE157/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/CZE157/S2.xlsx | sha256sum --check
      - name: Download independent official-derived SR70 point register fixed 2026 original source
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE157/SR70.csv \
            'https://raw.githubusercontent.com/Sap1k/jrunify-ext-geodata/main/rail/SR70.csv'
          printf '%s  %s\n' \
            'fc43a1969af64f17285c7c6e3a30b00c3994d0ba1cfda6db09d8e4baaa166019' source/CZE157/SR70.csv | sha256sum --check
      - name: Reanalyse real source archaeo/neophyte-only species incidence and geographic/fixed source frequency nulls
        run: |
          python -u scripts/analyze_Czech_2024_real_archaeophyte_neophyte_geographic_identity_v157.py \
            --s1 source/CZE157/S1.xlsx \
            --s2 source/CZE157/S2.xlsx \
            --pladias-diaspore source/CZE157/diaspore.xlsx \
            --pladias-lifeform source/CZE157/lifeform.xlsx \
            --sr70 source/CZE157/SR70.csv \
            --output results/audit/Czech_2024_original_35_station_arch_neo_source_geography_v157.json
      - name: Save original author source provenance and stage-specific aggregate status results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Czech-original-35-station-arch-neophyte-geo-v157
          path: results/audit/Czech_2024_original_35_station_arch_neo_source_geography_v157.json
          if-no-files-found: warn
