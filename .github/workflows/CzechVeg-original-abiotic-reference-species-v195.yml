name: "v19.5 CzechVeg original 2.51M plant taxonomic rail vs abiotic matched regional natural-reference source"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - "scripts/analyze_CzechVeg_abiotic_matched_reference_taxonomic_v195.py"
      - "tests/test_CzechVeg_abiotic_species_v195.py"
      - ".github/workflows/CzechVeg-original-abiotic-reference-species-v195.yml"
  workflow_dispatch:
concurrency:
  group: tetsu-v195-true-abiotic-matched-CzechVeg-plant
  cancel-in-progress: true
jobs:
  source-real-plants-abiotic-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 46
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Test source physical matching independence from botanical SYNTAXON
        run: python -m unittest discover -s tests -p 'test_CzechVeg_abiotic_species_v195.py' -v
      - name: Download original CzechVeg source plot header and 2.51M species rows (MD5 anchored)
        run: |
          mkdir -p source_original/v195
          curl -LfsS --retry 4 --connect-timeout 20 --max-time 750 \
            'https://zenodo.org/api/records/19231152/files/CzechVeg-Open_headers_v1-1_2026-03-26.csv/content' \
            -o source_original/v195/headers.csv
          curl -LfsS --retry 4 --connect-timeout 20 --max-time 1400 \
            'https://zenodo.org/api/records/19231152/files/CzechVeg_Open_species_v1-1_2026-03-26.csv/content' \
            -o source_original/v195/species.csv
          printf '0bc920462d1f9eac473e7b2a231e6782  source_original/v195/headers.csv\n' | md5sum -c -
          printf 'b296e5e19f03fb3bad0a8347c317f8a3  source_original/v195/species.csv\n' | md5sum -c -
      - name: Run original species and genus regional contrasts for elevation and elevation+slope physical source controls
        run: |
          python -u scripts/analyze_CzechVeg_abiotic_matched_reference_taxonomic_v195.py \
            --original-headers source_original/v195/headers.csv \
            --original-species source_original/v195/species.csv \
            --output results/audit/v195/CzechVeg_original_abiotic_reference_plant_source_v195.json
      - name: Keep only original-source aggregate QA, do not publish exact original field plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CzechVeg-original-2510340-abiotic-matched-taxon-regional-pools-v195
          path: results/audit/v195/
          if-no-files-found: warn
