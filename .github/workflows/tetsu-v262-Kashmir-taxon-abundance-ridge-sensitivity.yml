name: "v26.2 source-authentic Kashmir abundance after taxon identity ridge sensitivity"
on:
  push:
    branches: [research/tetsu-identity-abundance-holdout-v261-20261118]
    paths:
      - 'scripts/audit_Kashmir_abundance_identity_ridge_sensitivity_v262.py'
      - 'tests/test_Kashmir_abundance_identity_ridge_sensitivity_v262.py'
      - '.github/workflows/tetsu-v262-Kashmir-taxon-abundance-ridge-sensitivity.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v262-genuine-source-ridge-C-sensitivity
  cancel-in-progress: true
jobs:
  original-27-site-three-fixed-C-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install consistent C=0.2 1.0 5.0 source predictor dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn==1.7.2' 'openpyxl==3.1.5'
      - name: Test strict frozen C=1 original score replication and sensitivity invariants
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_Kashmir_abundance_identity_ridge_sensitivity_v262.py' -v
      - name: Retrieve original first-party Kashmir Dryad source and verify true workbook SHA
        run: |
          set -euo pipefail
          mkdir -p source/v262/kashmir results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/v262/kashmir/Dryad_original_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/v262/kashmir/Dryad_original_99735.zip') as z:
              files=[v for v in z.infolist() if not v.is_dir() and v.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise RuntimeError('Source archive must contain exactly one original Matrix_plot.xlsx')
              with z.open(files[0]) as i,Path('source/v262/kashmir/Matrix_plot.xlsx').open('wb') as o:
                  shutil.copyfileobj(i,o)
          PY
          test "$(stat -c%s source/v262/kashmir/Matrix_plot.xlsx)" = "122187"
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/v262/kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Source original C sensitivity with exact v26.1 C=1 regression result gate
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/audit_Kashmir_abundance_identity_ridge_sensitivity_v262.py \
            --source source/v262/kashmir/Matrix_plot.xlsx \
            --output results/audit/v262_Kashmir_abundance_after_taxon_ridge_C_0_2_1_5.json
      - name: Upload derived aggregate score summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v262-source-original-27site-ridge-abundance-after-identity
          path: results/audit/v262_Kashmir_abundance_after_taxon_ridge_C_0_2_1_5.json
          if-no-files-found: warn
