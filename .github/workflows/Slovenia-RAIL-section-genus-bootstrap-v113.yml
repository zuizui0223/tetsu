name: "v11.3 REAL Slovenian railway 261-taxon 15-section and genus cluster robustness"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/analyze_Slovenia_rail_section_genus_bootstrap_v113.py'
      - 'tests/test_Slovenia_rail_section_genus_bootstrap_v113.py'
      - '.github/workflows/Slovenia-RAIL-section-genus-bootstrap-v113.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-real-Slovenia-RAIL-v113-source-taxonomy
  cancel-in-progress: true
jobs:
  source-section-genus-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test positive-weight source section and genus resampling exact biology unit math
        run: python -m unittest discover -s tests -p 'test_Slovenia_rail_section_genus_bootstrap_v113.py' -v
      - name: Download original authenticated Slovenian 2026 railway botanical source workbook and CRC receipt
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/SLO102
      - name: Download exact authenticated v11.0 261-taxa original railway weighting result
        uses: actions/download-artifact@v4
        with:
          name: real-Slovenia-RAIL-species-frequency-estimand-reversal-v110
          run-id: 43567285954
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/SLO110
      - name: Recompute 261 original rail species wind-lifespan contrasts under positive 15-section and genus weights
        run: |
          python -u scripts/analyze_Slovenia_rail_section_genus_bootstrap_v113.py \
            --original-xlsx source/SLO102/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit102 source/SLO102/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --verified110 source/SLO110/SLO_RAIL_2026_v110_species_equal_vs_occ_frequency_weighted_wind.json \
            --output results/audit/SLO_RAIL_2026_v113_section_and_genus_source_bootstrap.json
      - name: Preserve BOTH guild directions and original taxon/genus source exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-Slovenia-RAIL-261species-section-genus-robustness-v113
          path: results/audit/SLO_RAIL_2026_v113_section_and_genus_source_bootstrap.json
          if-no-files-found: warn
