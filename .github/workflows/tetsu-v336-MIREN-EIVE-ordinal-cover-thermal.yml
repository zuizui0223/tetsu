name: "v336 MIREN original ordinal Cover classes vs species presence thermal EIVE"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_MIREN_EIVE_source_cover_class_v336.py'
      - 'tests/test_MIREN_EIVE_source_cover_class_v336.py'
      - '.github/workflows/tetsu-v336-MIREN-EIVE-ordinal-cover-thermal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic-MIREN-road-not-rail-ordinal-cover-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original author ordinal Cover class 1-8 and paired road-source tests
        run: python -m unittest discover -s tests -p 'test_MIREN_EIVE_source_cover_class_v336.py' -v
      - name: Read prior MD5-audited original MIREN 2007-2023 17.9MB road vegetation source
        uses: actions/download-artifact@v4
        with:
          name: authentic-global-MIREN-standardized-road-verge-flora-v98
          run-id: 43212464976
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/MIREN98
      - name: Get original EIVE 1.0 source temperature niche position and width values
        run: |
          set -euo pipefail
          mkdir -p source/EIVE results/audit
          curl -LfSs --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            'source/EIVE/EIVE_Paper_1.0_SM_08.xlsx' | md5sum --check
      - name: Independently observed MIREN 4 Europe regions, identical sites, presence-versus-cover-class EIVE CWM
        run: |
          python -u scripts/analyze_MIREN_EIVE_source_cover_class_v336.py \
            --miren-csv source/MIREN98/source_original/MIREN_road_survey_2007_2023_v3.csv \
            --eive-xlsx source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v336_MIREN_EIVE_road_interior_source_cover_class_comparison.json
      - name: Preserve only aggregate indices and source cover missingness counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v336-authentic-MIREN-road-EIVE-ordinal-cover-class-CWM
          path: results/audit/v336_MIREN_EIVE_road_interior_source_cover_class_comparison.json
          if-no-files-found: warn
