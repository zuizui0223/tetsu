name: "railstatus: plant height and seed size source transformation audit"
on:
  push:
    branches: [research/tetsu-railstatus-placebo-20261125]
    paths:
      - 'scripts/audit_railstatus_size_transformation.py'
      - '.github/workflows/tetsu-railstatus-size-transform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'boto3>=1.35,<2' 'openpyxl>=3.1,<4'
      - run: PYTHONPATH=scripts python -u scripts/audit_railstatus_size_transformation.py
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-railstatus-plant-size-transform-audit
          path: results/railstatus/plant_size_transform_audit.json
          if-no-files-found: error
