name: "v26.1 original Kashmir taxon-identity and abundance rank leave-spatial-site-out prediction"
on:
  push:
    branches: [research/tetsu-identity-abundance-holdout-v261-20261118]
    paths:
      - 'scripts/validate_Kashmir_abundance_after_species_site_holdout_v261.py'
      - 'tests/test_Kashmir_abundance_taxon_site_holdout_v261.py'
      - '.github/workflows/tetsu-v261-Kashmir-original-species-abundance-LOSO.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v261-original-Dryad-2014-abundance-species-identity-LOSO
  cancel-in-progress: true
jobs:
  source-original-27-spatial-site-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed numerical source parser / regression dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn==1.7.2' 'openpyxl==3.1.5'
      - name: Validate mathematical and heldout source-fold leakage checks on synthetic specimens
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_Kashmir_abundance_taxon_site_holdout_v261.py' -v
      - name: Download first-party original Dryad Kashmir workbook and strict published digest
        run: |
          set -euo pipefail
          mkdir -p source/v261/kashmir results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/v261/kashmir/official_Dryad_version_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile, shutil
          path=Path('source/v261/kashmir/official_Dryad_version_99735.zip')
          with zipfile.ZipFile(path) as z:
              options=[v for v in z.infolist() if not v.is_dir() and
                       v.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(options)!=1:
                  raise ValueError('Dryad source must contain exactly one original Matrix_plot.xlsx')
              with z.open(options[0]) as src,Path('source/v261/kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(src,out)
          PY
          test "$(stat -c%s source/v261/kashmir/Matrix_plot.xlsx)" = "122187"
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/v261/kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Perform ORIGINAL complete-location withheld M0–M4 comparison without train/test leakage
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/validate_Kashmir_abundance_after_species_site_holdout_v261.py \
            --source source/v261/kashmir/Matrix_plot.xlsx \
            --output results/audit/v261_original_Kashmir_27_site_holdout_taxon_abundance_persistence.json \
            --C 1.0
      - name: Preserve source-provenanced model score summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v261-Kashmir-source-original-27site-identity-abundance-prediction
          path: results/audit/v261_original_Kashmir_27_site_holdout_taxon_abundance_persistence.json
          if-no-files-found: warn
