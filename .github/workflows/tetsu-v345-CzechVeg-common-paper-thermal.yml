name: "v345 CzechVeg same-source-paper and plot identity thermal label control"
on:
  push:
    branches:
      - research/tetsu-v342-independent-thermal-reference-preflight-20261124
    paths:
      - 'scripts/analyze_CzechVeg_common_paper_label_thermal_v345.py'
      - 'tests/test_CzechVeg_common_paper_label_thermal_v345.py'
      - '.github/workflows/tetsu-v345-CzechVeg-common-paper-thermal.yml'
  pull_request:
    branches:
      - research/tetsu-Kashmir-Cynodon-persistence-v340-20261124
    paths:
      - 'scripts/analyze_CzechVeg_common_paper_label_thermal_v345.py'
      - 'tests/test_CzechVeg_common_paper_label_thermal_v345.py'
      - '.github/workflows/tetsu-v345-CzechVeg-common-paper-thermal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_czechveg_context_eive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original XLSX and science reader dependencies
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Synthetic temperature trait and original study block invariants
        run: python -m unittest discover -s tests -p 'test_CzechVeg_common_paper_label_thermal_v345.py' -v
      - name: Fetch publisher-verified complete CzechVeg field plots and original EIVE table
        run: |
          set -euo pipefail
          mkdir -p source_original/v345 results/audit
          curl -LfsS --retry 4 --connect-timeout 20 --max-time 160 \
            'https://zenodo.org/api/records/19231152' \
            -o source_original/v345/zenodo.json
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 900 \
            'https://zenodo.org/api/records/19231152/files/CzechVeg-Open_headers_v1-1_2026-03-26.csv/content' \
            -o source_original/v345/headers.csv
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 1400 \
            'https://zenodo.org/api/records/19231152/files/CzechVeg_Open_species_v1-1_2026-03-26.csv/content' \
            -o source_original/v345/species.csv
          printf '%s  %s\n' \
            '0bc920462d1f9eac473e7b2a231e6782' \
            source_original/v345/headers.csv | md5sum --check
          printf '%s  %s\n' \
            'b296e5e19f03fb3bad0a8347c317f8a3' \
            source_original/v345/species.csv | md5sum --check
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source_original/v345/eive.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source_original/v345/eive.xlsx | md5sum --check
      - name: Analyze same-source-paper and S2 block strict versus broad context sources
        run: |
          python -u scripts/analyze_CzechVeg_common_paper_label_thermal_v345.py \
            --zenodo-record source_original/v345/zenodo.json \
            --headers source_original/v345/headers.csv \
            --species source_original/v345/species.csv \
            --eive source_original/v345/eive.xlsx \
            --output results/audit/v345_CzechVeg_strict_broad_common_original_paper_blocks_EIVE_aggregate.json
      - name: Archive aggregate study and technical nulls; no plot species rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v345-CzechVeg-common-source-paper-EIVE-aggregate-only
          path: results/audit/v345_CzechVeg_strict_broad_common_original_paper_blocks_EIVE_aggregate.json
          if-no-files-found: warn
