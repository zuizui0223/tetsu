name: "v26.3 original Kashmir site-heldout taxon x habitat and centered rank ablation"
on:
  push:
    branches: [research/tetsu-identity-abundance-holdout-v261-20261118]
    paths:
      - 'scripts/validate_Kashmir_taxon_zone_centered_abundance_v263.py'
      - 'tests/test_Kashmir_species_zone_centered_rank_v263.py'
      - '.github/workflows/tetsu-v263-Kashmir-taxon-zone-centered-rank.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v263-source-taxonomy-zone-centered-original-study
  cancel-in-progress: true
jobs:
  source-original-27-site-taxonomy-zone-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original-source numeric and ridge regression dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn==1.7.2' 'openpyxl==3.1.5'
      - name: Synthetic species x zone heldout and train-only centered rank unit checks
        env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
        run: python -m unittest discover -s tests -p 'test_Kashmir_species_zone_centered_rank_v263.py' -v
      - name: Acquire official original Dryad Kashmir 2014/2017 plant survey
        run: |
          set -euo pipefail
          mkdir -p source/v263/kashmir results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/v263/kashmir/original_Dryad_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/v263/kashmir/original_Dryad_99735.zip') as z:
              xs=[x for x in z.infolist() if not x.is_dir() and x.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(xs)!=1:raise ValueError('Authentic Dryad must contain exactly one original Matrix_plot.xlsx')
              with z.open(xs[0]) as i,Path('source/v263/kashmir/Matrix_plot.xlsx').open('wb') as o:
                  shutil.copyfileobj(i,o)
          PY
          test "$(stat -c%s source/v263/kashmir/Matrix_plot.xlsx)" = "122187"
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/v263/kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Source original species×habitat identity and within-species centered rank models
        env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
        run: |
          python -u scripts/validate_Kashmir_taxon_zone_centered_abundance_v263.py \
            --source source/v263/kashmir/Matrix_plot.xlsx \
            --output results/audit/v263_Kashmir_original_taxon_zone_centered_rank_27site.json
      - name: Archive only source diagnostics and groups, not original flora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v263-genuine-source-taxon-zone-centered-initial-rank-holdout
          path: results/audit/v263_Kashmir_original_taxon_zone_centered_rank_27site.json
          if-no-files-found: warn
