name: "v28.8 ORIGINAL India Kashmir rail vs inland functional beta trait support gate"
on:
  push:
    branches: [research/tetsu-Kashmir-true-paired-nonrail-height-beta-v288-20261119]
    paths:
      - 'scripts/validate_Kashmir_out_of_Europe_rail_nonrail_height_beta_v288.py'
      - 'tests/test_Kashmir_original_rail_nonrail_LEDA_beta_v288.py'
      - '.github/workflows/tetsu-v288-Kashmir-outofEurope-original-rail-nonrail-trait-coverage.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v288-Kashmir-true-original-rail-inland-LEDA-support
  cancel-in-progress: true
jobs:
  authentic-original-kashmir-out-of-Europe-rail-nonrail:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install original XLSX reader dependencies
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3'
      - name: Verify synthetic site-matched beta, trait coverage gates, and missingness tests
        run: python -m unittest discover -s tests -p 'test_Kashmir_original_rail_nonrail_LEDA_beta_v288.py' -v
      - name: Authenticate original Dryad 2014/2017 source workbook
        run: |
          set -euo pipefail
          mkdir -p source/v288/India source/v288/LEDA results/audit
          # The public per-file endpoint returns HTTP 401 in hosted CI; use the
          # previously successful version-99735 publisher archive (v25.6).
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/v288/India/dryad_99735.zip
          python - <<'PY'
          from pathlib import Path
          import shutil,zipfile
          with zipfile.ZipFile('source/v288/India/dryad_99735.zip') as z:
              candidates=[f for f in z.infolist()
                          if not f.is_dir() and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(candidates)!=1:
                  raise RuntimeError('Original Dryad archive must contain exactly one Matrix_plot.xlsx')
              with z.open(candidates[0]) as handle, Path('source/v288/India/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(handle,out)
          PY
          test "$(stat -c%s source/v288/India/Matrix_plot.xlsx)" = '122187'
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/v288/India/Matrix_plot.xlsx | sha256sum --check
      - name: Download original LEDA source species-median trait tables and authenticate
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source/v288/LEDA/canopy_height.txt
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source/v288/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source/v288/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source/v288/LEDA/seed_mass.txt | sha256sum --check
      - name: Source-authentic India paired rail vs same-size inland trait coverage and conditional beta
        run: |
          python -u scripts/validate_Kashmir_out_of_Europe_rail_nonrail_height_beta_v288.py \
            --source source/v288/India/Matrix_plot.xlsx \
            --height source/v288/LEDA/canopy_height.txt \
            --seed source/v288/LEDA/seed_mass.txt \
            --output results/audit/tetsu_v288_Kashmir_original_2014_2017_rail_vs_same_100m2_inland_joint_LEDA_trait_gate.json
      - name: Archive only source-provenance, trait support counts and eligible study comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v288-original-India-rail-nonrail-LEDA-source-QA
          path: results/audit/tetsu_v288_Kashmir_original_2014_2017_rail_vs_same_100m2_inland_joint_LEDA_trait_gate.json
          if-no-files-found: warn
