name: "v16.2 ORIGINAL SI+CZ source lifeform x wind dispersal four-guild true rail-vs-ROAD heldout"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - 'scripts/analyze_two_country_original_four_guild_railroad_v162.py'
      - 'tests/test_two_country_original_four_guild_railroad_v162.py'
      - '.github/workflows/tetsu-2countries-original-four-guild-railroad-v162.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v162-two-original-study-four-guild-railroad-source
  cancel-in-progress: true
jobs:
  slovenia-original-89-field-sites-true-gps:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact author original source physical OSM data dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'osmium==4.2.0' 'openpyxl==3.1.5'
      - name: Synthetic correctness tests first — never interpret fixtures as observed biological results
        run: python -m unittest discover -s tests -p 'test_two_country_original_four_guild_railroad_v162.py' -v
      - name: Fetch independently original-authenticated Slovenia 89-site field-flora and author plot GPS
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/SLO162/authentic
      - name: Restore source-verified Geofabrik 2024 Slovenia national rail road physical route graph PBF
        uses: actions/cache/restore@v4
        with:
          path: source/SLO151/osm/slovenia-240101.osm.pbf
          key: tetsu-Geofabrik-Slovenia-20240101-source-file-280842431-bytes-v1
          fail-on-cache-miss: true
      - name: SHA validate same original 2024 Geofabrik source that reproduced original v15.1 observed taxonomic Jaccard
        run: |
          set -euo pipefail
          test "$(stat --format=%s source/SLO151/osm/slovenia-240101.osm.pbf)" = "280842431"
          printf '%s  %s\n' \
            'b572258fe000d6dfc76dc63afe5456121c5f463995e132a5dcd79957d819ae39' \
            'source/SLO151/osm/slovenia-240101.osm.pbf' | sha256sum --check
      - name: Original Slovenia 2x2 functional trait subgroup source crossvalidation; whole-flora original EXACT MSE gate
        run: |
          python -u scripts/analyze_two_country_original_four_guild_railroad_v162.py \
            --study SI \
            --si-original-xlsx source/SLO162/authentic/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --si-source-audit102 source/SLO162/authentic/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --osm-pbf source/SLO151/osm/slovenia-240101.osm.pbf \
            --output results/audit/SI_original_real_89site_2024_railroad_four_guild_v162.json
      - name: Archive only derived original-source reproducible study-level metrics, not protected XLSX/PBF/author coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Slovenian-original-89site-true-GPS-4guild-railroad-v162
          path: results/audit/SI_original_real_89site_2024_railroad_four_guild_v162.json
          if-no-files-found: warn

  czech-original-35-station-centroids-with-proxy-flag:
    runs-on: ubuntu-latest
    timeout-minutes: 43
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original 2023 OSM source sparse network and original Pladias publisher XLSX
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'osmium==4.2.0' 'openpyxl==3.1.5'
      - name: Validate true original source four guild ontology and missing-double-zero phenotype safeguards
        run: python -m unittest discover -s tests -p 'test_two_country_original_four_guild_railroad_v162.py' -v
      - name: Download actual Czech 2020-22 botanical author S1 and CORRECTED S2 and exact original publicly released Pladias traits
        run: |
          set -euo pipefail
          mkdir -p source/CZE162
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE162/S1.xlsx \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE162/S2.xlsx \
            'https://preslia.cz/appendix/file?id=540'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE162/diaspore.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/141/lang/en'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE162/lifeform.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/136/lang/en'
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/CZE162/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/CZE162/S2.xlsx | sha256sum --check
      - name: Fetch exact registry-derived SR70 2026 centroids, NEVER substitute for original botanical plant plot GPS
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            --output source/CZE162/SR70.csv \
            'https://raw.githubusercontent.com/Sap1k/jrunify-ext-geodata/main/rail/SR70.csv'
          printf '%s  %s\n' \
            'fc43a1969af64f17285c7c6e3a30b00c3994d0ba1cfda6db09d8e4baaa166019' source/CZE162/SR70.csv | sha256sum --check
      - name: Restore 2023 Czech true 816 MB country original OSM only from successful source cache
        uses: actions/cache/restore@v4
        with:
          path: source/CZE155/czech-republic-230101.osm.pbf
          key: tetsu-czech-20230101-geofabrik-original-816159635-pbf-source
          fail-on-cache-miss: true
      - name: Exact SHA validation of original true rail-vs-road Czech country PBF
        run: |
          set -euo pipefail
          test "$(stat --format=%s source/CZE155/czech-republic-230101.osm.pbf)" = "816159635"
          printf '%s  %s\n' \
            '26ff09ded5fa72dc9556b543b532d7df011f2e3c08af461ea2f537a9b0b42747' \
            'source/CZE155/czech-republic-230101.osm.pbf' | sha256sum --check
      - name: Original Czech author 2x2 source guild rail/road crossvalidation 5 stretch holdout; EXACT original v15.6 MSE checksum
        run: |
          python -u scripts/analyze_two_country_original_four_guild_railroad_v162.py \
            --study CZ \
            --cz-s1 source/CZE162/S1.xlsx \
            --cz-s2 source/CZE162/S2.xlsx \
            --cz-diaspore source/CZE162/diaspore.xlsx \
            --cz-lifeform source/CZE162/lifeform.xlsx \
            --cz-sr70 source/CZE162/SR70.csv \
            --osm-pbf source/CZE155/czech-republic-230101.osm.pbf \
            --output results/audit/CZ_original_real_35station_2023_railroad_four_guild_v162.json
      - name: Archive source-backed analysis provenance, no raw original S1/S2/Pladias/SR70/PBF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Czech-original-35station-centroid-4guild-railroad-v162
          path: results/audit/CZ_original_real_35station_2023_railroad_four_guild_v162.json
          if-no-files-found: warn
