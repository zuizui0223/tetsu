name: Tokyo N13 2024 road GIS source audit (not biological test)
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_n13_road.py'
      - '.github/workflows/n13-road-audit.yml'
  workflow_dispatch:
jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'requests>=2.31,<3' 'pyshp>=2.3,<3'
      - name: Verify N13 5339 source
        run: python scripts/audit_n13_road.py --mesh 5339 --output results/audit/n13_5339_source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n13-5339-road-source-audit
          path: results/audit/n13_5339_source.json
          if-no-files-found: warn
