name: "v330 original Kashmir 2014-2017 interior-vs-track EIVE trait-label conditional null"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/test_Kashmir_EIVE_gain_trait_label_null_v330.py'
      - 'tests/test_Kashmir_EIVE_gain_trait_label_null_v330.py'
      - '.github/workflows/tetsu-v330-Kashmir-temporal-EIVE-trait-shuffle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-Kashmir-trait-label-conditional-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only publisher XLSX reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Seven unit tests for original repeated-site taxon-label null
        run: python -m unittest discover -s tests -p 'test_Kashmir_EIVE_gain_trait_label_null_v330.py' -v
      - name: Acquire original Dryad Kashmir plot records from official verified version
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_v99735.zip
          python - <<'PY'
          from pathlib import Path
          import shutil,zipfile
          with zipfile.ZipFile('source/Kashmir/official_v99735.zip') as z:
              found=[f for f in z.infolist() if not f.is_dir()
                   and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(found)!=1:raise ValueError('Missing or duplicate original Dryad Kashmir source')
              with z.open(found[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Authenticate EIVE 1.0 source original Zenodo species thermal table
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Original two-source trait-label fixed site-year conditional null, including genus-constrained controls
        run: |
          python -u scripts/test_Kashmir_EIVE_gain_trait_label_null_v330.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v330_Kashmir_source_EIVE_gain_vs_rail_genus_shuffles.json
      - name: Archive scientific null diagnostics only, not original plot and species occurrence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v330-original-Kashmir-EIVE-thermal-gain-null-aggregates
          path: results/audit/v330_Kashmir_source_EIVE_gain_vs_rail_genus_shuffles.json
          if-no-files-found: warn
