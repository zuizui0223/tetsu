name: "v29.2 MIREN roads original within-genus trait-label null"
on:
  push:
    branches: [research/tetsu-MIREN-genus-conditioned-trait-null-v292-20261119]
    paths:
      - 'scripts/validate_MIREN_genus_conditioned_trait_label_null_v292.py'
      - 'tests/test_MIREN_genus_conditioned_trait_label_null_v292.py'
      - '.github/workflows/tetsu-v292-MIREN-within-genus-trait-source-null.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v292-original-MIREN-genus-conditional
  cancel-in-progress: true
jobs:
  original-source-genus-matched-road-vs-interior:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies for source checks and biological trait readers
        run: python -m pip install 'numpy>=1.26,<3' 'openpyxl==3.1.5' 'PyMuPDF==1.24.14'
      - name: Nine genus original species trait label synthetic invariance and support tests
        run: python -m unittest discover -s tests -p 'test_MIREN_genus_conditioned_trait_label_null_v292.py' -v
      - name: Recover original source-verified Zenodo MIREN 2007–2023 mountain ROAD species CSV
        run: |
          set -euo pipefail
          mkdir -p source_original/v292/MIREN source_original/v292/LEDA results/audit
          curl -LfsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 350 \
            'https://zenodo.org/records/15749536/files/MIREN_road_survey_%282007-2023%29_zen_v3_002507.csv?download=1' \
            -o source_original/v292/MIREN/original.csv
          test "$(stat -c%s source_original/v292/MIREN/original.csv)" = '17899241'
          printf '%s  %s\n' 'b640195cc44f252ccb6ddb28eb6fff13' \
            source_original/v292/MIREN/original.csv | md5sum --check
      - name: Restore original Oldenburg LEDA species-median trait data with original source SHA
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source_original/v292/LEDA/canopy_height.txt
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source_original/v292/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source_original/v292/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source_original/v292/LEDA/seed_mass.txt \
            | sha256sum --check
      - name: Validate v24.9 and v29.1 frozen true field cohorts before within-genus source randomizations
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/validate_MIREN_genus_conditioned_trait_label_null_v292.py \
            --miren source_original/v292/MIREN/original.csv \
            --height source_original/v292/LEDA/canopy_height.txt \
            --seed source_original/v292/LEDA/seed_mass.txt \
            --draws 199 \
            --output results/audit/v292_original_MIREN_genus_conditioned_road_interior_cwm_trait_label_null.json
      - name: Archive only region source taxonomy SUPPORT + original-source aggregate effects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v292-MIREN-original-genus-conditional-trait-placebo
          path: results/audit/v292_original_MIREN_genus_conditioned_road_interior_cwm_trait_label_null.json
          if-no-files-found: warn
