name: "railstatus: active versus inactive railway cold-climate niche pool"
on:
  push:
    branches: [research/tetsu-railstatus-placebo-20261125]
    paths:
      - 'scripts/analyze_world_railstatus_niche_pool.py'
      - 'tests/test_world_railstatus_niche_pool.py'
      - '.github/workflows/tetsu-railstatus-niche-pool.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: railstatus-niche-pool
  cancel-in-progress: true
jobs:
  status_niche:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_world_railstatus_niche_pool.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v403-original-niche-pool-coarse
          run-id: 45565523074
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsnp/pool
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsnp/niche
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v407-original-niche-pool-common
          run-id: 45570583651
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsnp/prior
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-world-rail-km-by-status
          run-id: 45556359068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsnp/status
      - run: |
          python -u scripts/analyze_world_railstatus_niche_pool.py \
            --pool source/rsnp/pool/v403_original_niche_pool_coarse.json \
            --niche source/rsnp/niche/v399_original_niche_coarse_aggregates.json \
            --prior source/rsnp/prior/v407_original_niche_pool_common.json \
            --status source/rsnp/status/world_rail_km_by_status_100km_200km.json \
            --out results/railstatus/railstatus_niche_pool.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-railstatus-niche-pool
          path: results/railstatus/railstatus_niche_pool.json
          if-no-files-found: error
