name: "railstatus: dated Japan terminal candidates vs global mapped status"
on:
  push:
    branches: [research/tetsu-dated-rail-closure-intake-20261127]
    paths:
      - scripts/audit_japan_terminal_overture.py
      - .github/workflows/tetsu-japan-terminal-overture.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  current-map-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyshp==2.3.1' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'pyarrow>=18,<25' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'boto3>=1.35,<2' 'openpyxl>=3.1,<4' 'netCDF4>=1.6,<2'
      - run: python scripts/audit_japan_terminal_rail_geometry.py --self-test
      - run: python scripts/audit_japan_terminal_overture.py --self-test
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v357-entire-128-parquet-world-rail-completeness-aggregate
          run-id: 45342573085
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/census
      - uses: actions/download-artifact@v4
        with:
          pattern: tetsu-v357-rail-geometry-*
          run-id: 45342573085
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/rail
          merge-multiple: true
      - run: python -u scripts/audit_japan_terminal_overture.py --rail-dir source/rs/rail --census source/rs/census/v357_complete_original_world_rail_source_CENSUS.json --out results/railstatus/japan_terminal_overture.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-japan-terminal-overture
          path: results/railstatus/japan_terminal_overture.json
          if-no-files-found: error
