name: Macro botanical GBIF 10-country 2010-2025 source-count coverage
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_gbif_macro_country_coverage_v18.py'
      - 'tests/test_gbif_macro_country_coverage_v18.py'
      - '.github/workflows/gbif-macro-country-coverage-v18.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-gbif-macro-country-source-v18
  cancel-in-progress: true
jobs:
  gbif-country-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public GBIF counts API client
        run: pip install 'requests>=2.31,<3'
      - name: Verify denominator counts taxonomy and missing data fail-closed
        run: python -m unittest discover -s tests -p 'test_gbif_macro_country_coverage_v18.py' -v
      - name: Fetch 10-country times 2-period GBIF actual national plant record counts
        run: python -u scripts/audit_gbif_macro_country_coverage_v18.py --output results/audit/gbif_10countries_2periods_plantae_source_counts_v18.json
      - name: Archive only country-level source counts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gbif-macro-10country-2010-2025-source-counts-v18
          path: results/audit/gbif_10countries_2periods_plantae_source_counts_v18.json
          if-no-files-found: warn
