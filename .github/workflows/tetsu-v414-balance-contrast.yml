name: "v414 original paired seasonal observer balancing contrast"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/audit_global_niche_balance_contrast_v414.py'
      - 'tests/test_global_niche_balance_contrast_v414.py'
      - 'data/derived/v414_verified_v412_v413.json'
      - '.github/workflows/tetsu-v414-balance-contrast.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'boto3>=1.35,<2'
      - run: python -m unittest discover -s tests -p 'test_global_niche_balance_contrast_v414.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v405-original-niche-temporal-coarse
          run-id: 45568291544
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v414/annual
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v412-original-balanced-annual-coarse
          run-id: 45575269539
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v414/balanced
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v414/niche
      - run: python -u scripts/audit_global_niche_balance_contrast_v414.py --source source/v414/annual/v405_original_niche_temporal_coarse.json --balanced source/v414/balanced/v412_original_balanced_annual_coarse.json --niche source/v414/niche/v399_original_niche_coarse_aggregates.json --verified data/derived/v414_verified_v412_v413.json --out results/audit/v414_original_balance_contrast.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v414-original-balance-contrast
          path: results/audit/v414_original_balance_contrast.json
          if-no-files-found: error
