name: "v26.6 source-authentic global MIREN ROAD leave-whole-road-out abundance beyond taxon"
on:
  push:
    branches: [research/tetsu-global-road-abundance-control-v265-20261118]
    paths:
      - 'scripts/analyze_MIREN_road_abundance_after_taxon_out_of_road_v266.py'
      - 'tests/test_MIREN_road_abundance_taxon_roadholdout_v266.py'
      - '.github/workflows/tetsu-v266-MIREN-ROAD-identity-abundance-roadholdout.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: tetsu-v266-miren-ROAD-taxonomy-abundance-region-roadholdout
  cancel-in-progress: true
jobs:
  original-global-road-identity-abundance-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed sparse logistic source model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'scikit-learn==1.7.2'
      - name: Synthetic source road holdout, site identity, and taxon-centering tests
        env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
        run: python -m unittest discover -s tests -p 'test_MIREN_road_abundance_taxon_roadholdout_v266.py' -v
      - name: Retrieve previously original-MD5 authenticated MIREN source Zenodo v3 2007-2023
        uses: actions/download-artifact@v4
        with:
          name: authentic-global-MIREN-standardized-road-verge-flora-v98
          run-id: 43212464976
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v266/MIREN
      - name: Verify true original MIREN source byte count and checksum
        run: |
          set -euo pipefail
          SOURCE='source/v266/MIREN/source_original/MIREN_road_survey_2007_2023_v3.csv'
          test "$(stat -c%s "$SOURCE")" = 17899241
          printf '%s  %s\n' 'b640195cc44f252ccb6ddb28eb6fff13' "$SOURCE" | md5sum --check
      - name: Source authentic fixed 20-road heldout M2/M3 and taxon-by-zone abundance models
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/analyze_MIREN_road_abundance_after_taxon_out_of_road_v266.py \
            --original-csv source/v266/MIREN/source_original/MIREN_road_survey_2007_2023_v3.csv \
            --output results/audit/v266_original_global_MIREN_ROAD_abundance_taxon_roadheldout.json
      - name: Keep original author taxa/plot rows private, export only region and road count summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v266-true-original-global-MIREN-ROAD-20road-abundance-after-taxon
          path: results/audit/v266_original_global_MIREN_ROAD_abundance_taxon_roadheldout.json
          if-no-files-found: warn
