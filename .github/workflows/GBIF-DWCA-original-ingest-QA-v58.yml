name: "v5.8 Ready DWCA original-occurrence streaming ingestion and privacy-safe dedup QA (synthetic test only)"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/ingest_GBIF_DWCA_original_events_v58.py'
      - 'tests/test_ingest_GBIF_DWCA_original_events_v58.py'
      - '.github/workflows/GBIF-DWCA-original-ingest-QA-v58.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-GBIF-original-DWCA-ingest-synthetic-only-v58
  cancel-in-progress: true
jobs:
  validate-offline-reader-before-user-authenticated-original-GBIF-download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original EPSG6933 spatial source and privacy-preserving archive QA clients
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2,<3' 'pyproj>=3.5,<4' 'requests>=2.31,<3'
      - name: Test synthetic actual-archive interpreter status/dedup/country/precision and DOI-shape contract
        run: python -m unittest discover -s tests -p 'test_ingest_GBIF_DWCA_original_events_v58.py' -v
      - name: Make sure this workflow does NOT falsely execute an authenticated original GBIF download
        run: |
          echo "Synthetic tests only; real DWCA ZIP, official DOI download key, and user-controlled credentials are NOT supplied."
          echo "No GBIF POST, no real download and no DOI generated by this workflow."
