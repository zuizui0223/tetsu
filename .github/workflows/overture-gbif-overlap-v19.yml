name: International Overture rail-road and GBIF area taxa join feasibility v1.9
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_gbif_overlap_v19.py'
      - 'tests/test_overture_gbif_overlap_v19.py'
      - '.github/workflows/overture-gbif-overlap-v19.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-overture-gbif-overlap-v19
  cancel-in-progress: true
jobs:
  cross-source-spatial-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial Parquet reader and GBIF API client
        run: pip install 'duckdb>=1.3,<2' 'requests>=2.31,<3'
      - name: Source-only validations without network access
        run: python -m unittest discover -s tests -p 'test_overture_gbif_overlap_v19.py' -v
      - name: Query real October 2026 Overture rails/roads plus area GBIF plant taxa in Japan and Germany
        run: python -u scripts/audit_overture_gbif_overlap_v19.py --regions jp_sendai de_leipzig --output results/audit/overture_gbif_two_region_source_v19.json
      - name: Upload aggregate joint-source coverage only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-gbif-jp-de-macro-source-v19
          path: results/audit/overture_gbif_two_region_source_v19.json
          if-no-files-found: warn
