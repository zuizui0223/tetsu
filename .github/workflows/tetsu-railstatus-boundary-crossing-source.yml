name: "railstatus: rebuild global direct railway boundary crossings"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: railstatus-boundary-crossing-source
  cancel-in-progress: true
jobs:
  boundary_crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'pyarrow>=18,<25' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_world_rail_boundary_crossings.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v357-entire-128-parquet-world-rail-completeness-aggregate
          run-id: 45342573085
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/census
      - uses: actions/download-artifact@v4
        with:
          pattern: tetsu-v357-rail-geometry-*
          run-id: 45342573085
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/rail
          merge-multiple: true
      - name: Extract direct boundary traversals from complete original railway geometry
        run: |
          python -u scripts/aggregate_world_rail_boundary_crossings.py \
            --rail-dir source/rs/rail \
            --census source/rs/census/v357_complete_original_world_rail_source_CENSUS.json \
            --out results/railstatus/direct_boundary_crossings.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-railstatus-direct-boundary-crossings
          path: results/railstatus/direct_boundary_crossings.json
          if-no-files-found: error
