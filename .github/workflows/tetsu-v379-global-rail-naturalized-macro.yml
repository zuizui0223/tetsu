name: "v379 global original iNat replay regional documented naturalized species fraction vs actual railway density"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_rail_documented_naturalized_v379.py'
      - '.github/workflows/tetsu-v379-global-rail-naturalized-macro.yml'
      - 'tests/test_global_rail_documented_naturalized_v379.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_source:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2' 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pyarrow>=18,<25'
      - run: |
          python -m py_compile scripts/analyze_global_rail_documented_naturalized_v379.py
          python -m unittest discover -s tests -p 'test_global_rail_documented_naturalized_v379.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v379/plants
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v379/rail
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v376b-JRC-GHSL-2020-global-builtup-100km-200km-real-source
          run-id: 45382671629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v379/built
      - name: Obtain original publisher GloNAF and pinned land/climate source
        run: |
          set -euo pipefail
          mkdir -p source/v379/glonaf source/v379/land
          for f in glonaf_2024_nol.zip glonaf_flora2.csv glonaf_list.csv glonaf_region.csv glonaf_taxon_wcvp.csv glonaf_TxR.csv; do
            curl -LfS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 "https://zenodo.org/records/17105725/files/$f?download=1" -o "source/v379/glonaf/$f"
          done
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' -o source/v379/land/ne.geojson
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 780 'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' -o source/v379/land/wc2.1_10m_bio.zip
      - name: Frozen geography assignment before biological outcome, exact global source replay, same-grid models
        run: |
          python -u scripts/analyze_global_rail_documented_naturalized_v379.py \
            --plants source/v379/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --rail source/v379/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --built source/v379/built/v376b_JRC_GHSL2020_real_world_builtup_m2_100km_200km.json \
            --ne source/v379/land/ne.geojson \
            --climate source/v379/land/wc2.1_10m_bio.zip \
            --glonaf source/v379/glonaf \
            --preflight results/audit/v379_original_region_assignment_preflight.json \
            --output results/audit/v379_original_rail_documented_naturalized_global_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetsu-v379-original-global-rail-GloNAF-aggregate-only
          path: results/audit/v379_*.json
          if-no-files-found: warn
