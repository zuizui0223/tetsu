name: "v8.3 REAL 49-state Census 2025 GBIF GRIIS flora similarity vs 2022 FAF6 RAIL/TRUCK crop OD"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/analyze_FAF6_GRIIS_US_state_OD_alignment_v83.py'
      - 'tests/test_FAF6_GRIIS_US_state_OD_alignment_v83.py'
      - '.github/workflows/US-FAF6-GRIIS-state-OD-floristic-v83.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-US-state-FAF6-crop-OD-GBIF-GRIIS-2022-v83
  cancel-in-progress: true
jobs:
  actual-FAF6-state-crop-OD-vs-country-GRIIS-floristic-similarity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prevalidated census geography, GBIF source and residual rank model packages
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'pandas>=2.2,<3' 'lxml>=5,<7' 'requests>=2.31,<3' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Validate mathematical source-only state matching and noncausal temporal inference
        run: python -m unittest discover -s tests -p 'test_FAF6_GRIIS_US_state_OD_alignment_v83.py' -v
      - name: Get genuine 2022 FAF6 51-state RAIL and TRUCK agricultural economic OD matrices
        uses: actions/download-artifact@v4
        with:
          name: real-US-2022-FAF6-RAIL-TRUCK-crop-state-OD-network-v80
          run-id: 43142647675
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/freight
      - name: Get 49 quality-eligible from 51 state Census FIPS source-matched GBIF GRIIS country-listed taxa
        uses: actions/download-artifact@v4
        with:
          name: real-US-all51-state-GRIIS-GBIF-2018-25-v82
          run-id: 43144396513
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/flora
      - name: Read official 2025 Census TIGER state centroids and area; run REAL matching RAIL-vs-TRUCK OD and floristic rarefaction with source-site controls
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/analyze_FAF6_GRIIS_US_state_OD_alignment_v83.py \
            --freight-v80 source/freight/BTS_FAF6_2022_crop_OD_RAIL_vs_TRUCK_network_v80.json \
            --flora-v82 source/flora/US_all51_state_GRIIS_GBIF_2018_25_source_v82.json \
            --output results/audit/US_2022_crop_FAF6_GRIIS_state_similarity_v83.json
      - name: Preserve real state-level source plant pair contrasts including positive-rail-only and leave-state-out, no biological seed-transport claim
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-US-2022-FAF6-GBIF-GRIIS-state-floristic-OD-source-v83
          path: results/audit/US_2022_crop_FAF6_GRIIS_state_similarity_v83.json
          if-no-files-found: warn
