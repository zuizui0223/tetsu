name: "v15.5 GENUINE Czech 2023 OSM rail road physical network through 35 original 2024 Preslia station floras"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - 'scripts/analyze_Czech_2023_true_rail_road_osm_routes_v155.py'
      - 'tests/test_Czech_2023_true_rail_road_osm_routes_v155.py'
      - '.github/workflows/Czech-2023-original-rail-road-OSM-v155.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v155-authentic-Czech2023-country-OSM-full-network
  cancel-in-progress: true
jobs:
  original-OSM-country-rail-road-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned real OSM and sparse physical graph dependencies and original XLSX reader
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'osmium==4.2.0' 'openpyxl==3.1.5'
      - name: Unit-test exact original node physical network; forbid false connector and invented 4 station positions
        run: |
          python -m unittest discover -s tests -p 'test_Czech_2023_true_rail_road_osm_routes_v155.py' -v
          python -m unittest discover -s tests -p 'test_Czech_2024_centroid_geographic_identity_v154.py' -v
          python -m unittest discover -s tests -p 'test_Slovenia_true_OSM_rail_road_paths_v150.py' -v
      - name: Download same real original Preslia 2024 author plant appendices and full Pladias strategy/source lifeform
        run: |
          set -euo pipefail
          mkdir -p source/CZE155
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE155/S1.xlsx \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE155/S2.xlsx \
            'https://preslia.cz/appendix/file?id=540'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE155/diaspore.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/141/lang/en'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE155/lifeform.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/136/lang/en'
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/CZE155/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/CZE155/S2.xlsx | sha256sum --check
      - name: Fetch 2026 third-party SR70 official-derived station centroid source; source SHA must match prior success
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            --output source/CZE155/SR70.csv \
            'https://raw.githubusercontent.com/Sap1k/jrunify-ext-geodata/main/rail/SR70.csv'
          printf '%s  %s\n' \
            'fc43a1969af64f17285c7c6e3a30b00c3994d0ba1cfda6db09d8e4baaa166019' source/CZE155/SR70.csv | sha256sum --check
      - name: Restore original Geofabrik 2023 Czech 816 MB snapshot from workflow cache if available
        uses: actions/cache@v4
        with:
          path: source/CZE155/czech-republic-230101.osm.pbf
          key: tetsu-czech-20230101-geofabrik-original-816159635-pbf-source
      - name: Download frozen 2023-01-01 Czech WHOLE COUNTRY original OSM PBF if cache absent
        run: |
          set -euo pipefail
          if ! test -s source/CZE155/czech-republic-230101.osm.pbf; then
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --max-time 1650 \
              --user-agent 'tetsu-source-rail-road-geofabrik/1.0' \
              --output source/CZE155/czech-republic-230101.osm.pbf \
              'https://download.geofabrik.de/europe/czech-republic-230101.osm.pbf'
          fi
          test "$(stat --format=%s source/CZE155/czech-republic-230101.osm.pbf)" = "816159635"
          sha256sum source/CZE155/czech-republic-230101.osm.pbf
      - name: Compute authentic fully connected physical rail and drivable road paths for the matched 35 original stations
        run: |
          python -u scripts/analyze_Czech_2023_true_rail_road_osm_routes_v155.py \
            --s1 source/CZE155/S1.xlsx \
            --s2 source/CZE155/S2.xlsx \
            --pladias-diaspore source/CZE155/diaspore.xlsx \
            --pladias-lifeform source/CZE155/lifeform.xlsx \
            --sr70 source/CZE155/SR70.csv \
            --osm-pbf source/CZE155/czech-republic-230101.osm.pbf \
            --output results/audit/Czech_2023_true_rail_road_35_authentic_source_station_paths_v155.json
      - name: Archive only aggregate source provenance, graph connectivity, access and ratio; not original PBF/XLSX/CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentic-Czech2023-OSM-35station-network-routes-v155
          path: results/audit/Czech_2023_true_rail_road_35_authentic_source_station_paths_v155.json
          if-no-files-found: warn
