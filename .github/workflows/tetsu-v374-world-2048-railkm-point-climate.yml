name: "v374 source true worldwide 2048 rail-km WGS84 point macroclimate versus 100km 200km grid"
on:
  push:
    branches:
      - research/tetsu-v368-world-rail-pps-biodiversity-20261124
    paths:
      - 'scripts/analyze_true_world_railkm_pps_point_climate_v374.py'
      - 'tests/test_true_world_railkm_pps_point_climate_v374.py'
      - '.github/workflows/tetsu-v374-world-2048-railkm-point-climate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_2048_rail_point_macroclimate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original railway point WorldClim and climate grid dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'rasterio>=1.3,<2'
      - name: Run 10 original-source global railway rail-km and geodetic climate tests
        run: |
          python -m unittest discover -s tests -p 'test_true_world_railkm_pps_point_climate_v374.py' -v
          python -m py_compile scripts/analyze_true_world_railkm_pps_point_climate_v374.py
      - name: Download verified worldwide Overture physical railway exact 2048 original length-weighted random points
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v368b-original-world-railkm-sampled-source-points
          run-id: 45373590287
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v374/railpoints
      - name: Download independent original v373 full-world 100km 200km railway length mapped into climate bands
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v373-true-global-railkm-WorldClim-climate-frame-by-continent
          run-id: 45378280660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v374/railclimate
      - name: Source pinned original Natural Earth global continents and WorldClim2.1 annual physical temperature raster
        run: |
          set -euo pipefail
          mkdir -p source/v374/land results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 \
            'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' \
            -o source/v374/land/ne_original_admin0.geojson
          printf '%s  %s\n' \
            '718ac51d68ed2bf5de4f563fff2e2e045db706c1d3222805f3e317140a64213b' \
            source/v374/land/ne_original_admin0.geojson | sha256sum --check
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 780 \
            'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' \
            -o source/v374/land/wc2.1_10m_bio.zip
          printf '%s  %s\n' \
            '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf' \
            source/v374/land/wc2.1_10m_bio.zip | sha256sum --check
      - name: Genuine global railway PPS point-specific climate and cell-centre resolution comparison to original v373 full world source
        run: |
          python -u scripts/analyze_true_world_railkm_pps_point_climate_v374.py \
            --original-2048-railkm-points source/v374/railpoints/v368b_global_2048_world_GERS_rail_km_random_points.json \
            --natural-earth source/v374/land/ne_original_admin0.geojson \
            --worldclim-zip source/v374/land/wc2.1_10m_bio.zip \
            --verified-v373-global-grid-climate source/v374/railclimate/v373_true_global_railkm_worldclim_by_continent_biome.json \
            --output results/audit/v374_true_original_world_rail2048_macroclimate_grid_bias.json
      - name: Archive global 2048 independent rail km climate means, NOT original point GPS or botanical source IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v374-2048-true-global-railkm-point-climate-vs-v373-grid
          path: results/audit/v374_true_original_world_rail2048_macroclimate_grid_bias.json
          if-no-files-found: warn
