name: "v376c real global iNaturalist plants versus railway km after JRC GHSL2020 urban builtup control"
on:
  push:
    branches:
      - research/tetsu-v368-world-rail-pps-biodiversity-20261124
    paths:
      - 'scripts/analyze_global_original_railkm_biodiversity_GHSL_control_v376c.py'
      - 'tests/test_global_original_railkm_biodiversity_GHSL_control_v376c.py'
      - '.github/workflows/tetsu-v376c-GHSL2020-urban-adjusted-global-rail-plants.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_world_full_botanical_rail_and_independent_builtup:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install global original biological model and independent builtup raster data join dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - name: Eight tests source only confirmed JRC units and no false urban zero imputations
        run: |
          python -m unittest discover -s tests -p 'test_global_original_railkm_biodiversity_GHSL_control_v376c.py' -v
          python -m py_compile scripts/analyze_global_original_railkm_biodiversity_GHSL_control_v376c.py
      - name: Confirm separate official JRC global 1km source area archive completed successfully first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            status="$(gh api 'repos/zuizui0223/tetsu/actions/runs/45382671629' --jq '.status')"
            conclusion="$(gh api 'repos/zuizui0223/tetsu/actions/runs/45382671629' --jq '.conclusion // "null"')"
            echo "Independent GHSL2020 full-world area-source status: ${status}/${conclusion}"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then exit 0; fi
              echo "JRC GHSL original source not valid; cannot fit urbanization-adjusted worldwide rail model" >&2
              exit 1
            fi
            sleep 8
          done
          echo "Original JRC source global raster aggregation not complete; no urban-adjusted source inference" >&2
          exit 1
      - name: Retrieve completed authenticated JRC full-world 2020 built-up area 100/200km source aggregate
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v376b-JRC-GHSL-2020-global-builtup-100km-200km-real-source
          run-id: 45382671629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v376c/urban
      - name: Retrieve published 2025 iNaturalist full-world plant richness and neighboring whole landscape beta source
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v376c/plants
      - name: Retrieve published full 2.237million km original world GERS railway exposure
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v376c/rail
      - name: Acquire original source WorldClim 1970–2000 physical BIO1 and NaturalEarth world land map
        run: |
          set -euo pipefail
          mkdir -p source/v376c/land results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 \
            'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' \
            -o source/v376c/land/wc2.1_10m_bio.zip
          printf '%s  %s\n' \
            '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf' \
            source/v376c/land/wc2.1_10m_bio.zip | sha256sum --check
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 240 \
            'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' \
            -o source/v376c/land/ne_110m_admin_0_map_units.geojson
          printf '%s  %s\n' \
            '718ac51d68ed2bf5de4f563fff2e2e045db706c1d3222805f3e317140a64213b' \
            source/v376c/land/ne_110m_admin_0_map_units.geojson | sha256sum --check
      - name: Real six-continent heldout M0 versus GHSL2020 only versus GHSL2020 and railway km on same original world plant source
        run: |
          python -u scripts/analyze_global_original_railkm_biodiversity_GHSL_control_v376c.py \
            --original-v369-global-plants source/v376c/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --original-v370-global-rail source/v376c/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --original-JRC-GHSL2020-global-builtup source/v376c/urban/v376b_JRC_GHSL2020_real_world_builtup_m2_100km_200km.json \
            --natural-earth source/v376c/land/ne_110m_admin_0_map_units.geojson \
            --worldclim-zip source/v376c/land/wc2.1_10m_bio.zip \
            --output results/audit/v376c_true_global_railkm_botany_after_GHSL2020_urbanization.json
      - name: Archive only 100/200km source global continent-heldout urban-adjusted predictive models, no original GPS or observer IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v376c-global-original-rail-plants-GHSL2020-urban-adjusted
          path: results/audit/v376c_true_global_railkm_botany_after_GHSL2020_urbanization.json
          if-no-files-found: warn
