name: "v408 original genus support-selection audit"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/audit_global_niche_genus_support_v408.py'
      - 'tests/test_global_niche_genus_support_v408.py'
      - 'data/derived/v408_verified_v407_decomposition.json'
      - '.github/workflows/tetsu-v408-genus-support-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_niche_genus_support_v408.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v403-original-niche-pool-coarse
          run-id: 45565523074
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v408/pool
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v408/niche
      - run: python -u scripts/audit_global_niche_genus_support_v408.py --source source/v408/pool/v403_original_niche_pool_coarse.json --niche source/v408/niche/v399_original_niche_coarse_aggregates.json --verified data/derived/v408_verified_v407_decomposition.json --out results/audit/v408_original_genus_support_audit.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v408-original-genus-support-audit
          path: results/audit/v408_original_genus_support_audit.json
          if-no-files-found: error
