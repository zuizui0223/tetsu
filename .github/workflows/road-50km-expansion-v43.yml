name: "v4.3b Four independent 50km macro ROAD shortest-path source blocks"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - '.github/workflows/road-50km-expansion-v43.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-road-50km-four-new-blocks-v43
  cancel-in-progress: true
jobs:
  source-road-paths:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        block:
          - ca_ontario
          - gb_yorkshire
          - de_saxony
          - au_southeast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Overture road physical graph and GIS clients
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Verify road connector topology and physical route path source gates
        run: python -m unittest discover -s tests -p 'test_overture_50km_road_paths_v33.py' -v
      - name: Query actual Overture road paths, same EPSG6933 50km cells and 75km graph halo
        run: |
          python -u scripts/audit_overture_50km_road_paths_v33.py \
            --blocks ${{ matrix.block }} \
            --output results/audit/overture_50km_road_paths_${{ matrix.block }}_v43.json
      - name: Preserve source 50km ROAD physical distances and both fixed anchor strategies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-50km-road-physical-paths-${{ matrix.block }}-v43
          path: results/audit/overture_50km_road_paths_${{ matrix.block }}_v43.json
          if-no-files-found: warn
