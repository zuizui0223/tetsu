name: "v4.8b REAL 6-country GBIF DETECTED facet plus bounded original row quality reconciliation"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_gbif_detected_original_rows_v48b.py'
      - 'tests/test_gbif_detected_original_rows_v48b.py'
      - '.github/workflows/gbif-detected-original-rows-v48b.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-GBIF-source-detected-records-original-quality-v48b
  cancel-in-progress: true
jobs:
  real-24-country-cell-period-status-source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original GBIF and 50km geographic source dependencies
        run: pip install 'requests>=2.31,<3' 'numpy>=1.26,<3' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Test DETECTED source facet contract, firstpage privacy, and historical source count consistency
        run: python -m unittest discover -s tests -p 'test_gbif_detected_original_rows_v48b.py' -v
      - name: Read original 8-country 50km GRIIS indexed flora source to verify present-source denominator
        uses: actions/download-artifact@v4
        with:
          name: griis-50km-10block-8country-introduced-species-source-v36
          run-id: 42761140912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/flora
      - name: Query 24 frozen actual GBIF original-row FIRST pages matched to full current DETECTED/NOT_DETECTED facets
        run: |
          python -u scripts/audit_gbif_detected_original_rows_v48b.py             --flora source/flora/griis_50km_10blocks_country_mask_v36.json             --output results/audit/GBIF_detected_status_original_rows_6country_v48b.json
      - name: Preserve privacy-safe aggregated occurrence and status quality with zero personal names or exact coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GBIF-detected-facet-matched-original-rows-sixcountry-v48b
          path: results/audit/GBIF_detected_status_original_rows_6country_v48b.json
          if-no-files-found: warn
