name: "v29.1 REAL MIREN roadside vs inland trait-label placebo (railway negative control)"
on:
  push:
    branches: [research/tetsu-MIREN-road-trait-shuffle-counterfactual-v291-20261119]
    paths:
      - 'scripts/validate_MIREN_ROAD_original_site_frozen_trait_label_counterfactual_v291.py'
      - 'tests/test_MIREN_original_ROAD_trait_label_source_placebo_v291.py'
      - '.github/workflows/tetsu-v291-original-MIREN-road-plot-frozen-trait-label-null.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v291-authentic-original-MIREN-road-frozen-incidence-trait-shuffle
  cancel-in-progress: true
jobs:
  original-25region-miren-source-verified-road-trait-null:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install stable source parsers for validated v24.9 original scripts
        run: python -m pip install 'numpy>=1.26,<3' 'openpyxl==3.1.5' 'PyMuPDF==1.24.14'
      - name: Check eight mathematical and authentic-site-placebo source invariance tests
        run: python -m unittest discover -s tests -p 'test_MIREN_original_ROAD_trait_label_source_placebo_v291.py' -v
      - name: Fetch genuine 2025 MIREN mountain roads v3 first-party CSV with pinned original MD5
        run: |
          set -euo pipefail
          mkdir -p source_original/v291/MIREN source_original/v291/LEDA results/audit
          curl -LfsS --retry 3 --retry-all-errors --connect-timeout 20 --max-time 350 \
            'https://zenodo.org/records/15749536/files/MIREN_road_survey_%282007-2023%29_zen_v3_002507.csv?download=1' \
            -o source_original/v291/MIREN/original.csv
          test "$(stat -c%s source_original/v291/MIREN/original.csv)" = '17899241'
          printf '%s  %s\n' 'b640195cc44f252ccb6ddb28eb6fff13' \
            source_original/v291/MIREN/original.csv | md5sum --check
      - name: Reacquire actual Oldenburg LEDA canopy height and seed mass, validate both original SHA-256
        run: |
          set -euo pipefail
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source_original/v291/LEDA/canopy_height.txt
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source_original/v291/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source_original/v291/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source_original/v291/LEDA/seed_mass.txt | sha256sum --check
      - name: Reproduce v24.9 8-region result before source trait-label experiment and test two original source support strata
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/validate_MIREN_ROAD_original_site_frozen_trait_label_counterfactual_v291.py \
            --miren source_original/v291/MIREN/original.csv \
            --height source_original/v291/LEDA/canopy_height.txt \
            --seed source_original/v291/LEDA/seed_mass.txt \
            --output results/audit/v291_original_MIREN_road_site_trait_label_null_vs_interior.json \
            --draws 299
      - name: Archive only MIREN region/road/site COUNTS and aggregated 2D/height/seed source effects; never raw plots/GPS/species vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v291-authentic-MIREN-roadsite-original-incidence-frozen-trait-null
          path: results/audit/v291_original_MIREN_road_site_trait_label_null_vs_interior.json
          if-no-files-found: warn
