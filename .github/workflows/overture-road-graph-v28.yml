name: v2.8 Overture road physical connectivity / route-distance control (Japan and Britain)
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_road_network_v28.py'
      - 'tests/test_overture_road_network_v28.py'
      - '.github/workflows/overture-road-graph-v28.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-overture-road-graph-v28-jp-gb
  cancel-in-progress: true
jobs:
  road-graph-jp-gb:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Overture geospatial and graph dependencies
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Test source roads physical connectors and representative 9-cell network distances
        run: python -m unittest discover -s tests -p 'test_overture_road_network_v28.py' -v
      - name: Fetch actual Overture mapped roads and compute cell-centroid road network routes
        run: |
          python -u scripts/audit_overture_road_network_v28.py \
            --regions jp_sendai gb_york \
            --output results/audit/overture_road_connector_paths_jp_gb_v28.json
      - name: Retain aggregated road cell route distances only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-jp-gb-physical-road-cell-paths-v28
          path: results/audit/overture_road_connector_paths_jp_gb_v28.json
          if-no-files-found: warn
