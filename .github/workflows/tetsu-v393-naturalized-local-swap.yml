name: "v393 original local region block naturalized enrichment falsification"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_naturalized_local_swap_v393.py'
      - 'tests/test_global_naturalized_local_swap_v393.py'
      - '.github/workflows/tetsu-v393-naturalized-local-swap.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_naturalized_local_swap_v393.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v383-coarse-cell-naturalized-counts-only
          run-id: 45404886620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v393/cells
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v393/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v393/road
      - name: Exact v389 replay, local region-block FE and matched exposure swaps
        run: |
          python -u scripts/analyze_global_naturalized_local_swap_v393.py \
            --cells source/v393/cells/v383_original_coarse_cell_counts.json \
            --tree source/v393/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road source/v393/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --out results/audit/v393_original_naturalized_local_swap.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v393-original-naturalized-local-swap
          path: results/audit/v393_original_naturalized_local_swap.json
          if-no-files-found: error
