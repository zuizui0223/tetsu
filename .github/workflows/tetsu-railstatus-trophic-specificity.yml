name: "railstatus: matched plant-insect-bird trophic specificity"
on:
  push:
    branches: [research/tetsu-trophic-specificity-20261126]
    paths:
      - 'scripts/analyze_world_railstatus_trophic_specificity.py'
      - 'tests/test_world_railstatus_trophic_specificity.py'
      - '.github/workflows/tetsu-railstatus-trophic-specificity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: railstatus-trophic-specificity
  cancel-in-progress: true
jobs:
  trophic_specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'netCDF4>=1.6,<2' 'boto3>=1.35,<2'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_world_railstatus_trophic_specificity.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-world-rail-km-by-status
          run-id: 45556359068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/status
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/plants
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/rail
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v376b-JRC-GHSL-2020-global-builtup-100km-200km-real-source
          run-id: 45382671629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/built
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/road
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v391-original-JRC-GHS-POP2020-global-coarse-counts
          run-id: 45425219960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/pop
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-four-taxa-2025-grid-counts
          run-id: 45560367041
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/taxa
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-ESA-CCI-woody-AGB-coarse
          run-id: 45600821930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/agb
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-plant-bird-biomass
          run-id: 45600821930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/agb_model
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-observer-split-beta
          run-id: 45568727573
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/split
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-observer-annual-beta
          run-id: 45572306696
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/annual
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-plant-bird-disjoint
          run-id: 45658829436
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/disjoint
      - name: Verify fixed upstream diet run completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Wait only for the already launched, fixed source run; no rescan.
          for i in $(seq 1 80); do
            s=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/45715350503 --jq '.status + ":" + (.conclusion // "")')
            echo "Upstream diet: $s"
            if [ "$s" = "completed:success" ]; then exit 0; fi
            if [[ "$s" == completed:* ]]; then exit 1; fi
            sleep 45
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-bird-diet-cells
          run-id: 45715350503
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/diet
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-plant-bird-diet
          run-id: 45715350503
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/diet_model
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-plant-insect-bird
          run-id: 45715639136
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/insect_model
      - name: Frozen land units and climate
        run: |
          set -euo pipefail
          mkdir -p source/rs/land
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' -o source/rs/land/ne.geojson
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 780 'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' -o source/rs/land/wc2.1_10m_bio.zip
      - name: Joint insect and plant slopes by bird diet on identical cells
        run: |
          cd scripts
          python -u analyze_world_railstatus_trophic_specificity.py \
            --diet ../source/rs/diet/bird_diet_cells.json \
            --diet_model ../source/rs/diet_model/railstatus_plant_bird_diet.json \
            --insect_model ../source/rs/insect_model/railstatus_plant_insect_bird.json \
            --disjoint ../source/rs/disjoint/railstatus_plant_bird_disjoint.json \
            --agb ../source/rs/agb/ESA_CCI_woody_AGB_2020_2024.json \
            --agb_model ../source/rs/agb_model/railstatus_plant_bird_biomass.json \
            --split ../source/rs/split/observer_split_beta.json \
            --annual ../source/rs/annual/observer_annual_beta.json \
            --taxa ../source/rs/taxa/four_taxa_counts.json \
            --plant ../source/rs/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --rail ../source/rs/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --status ../source/rs/status/world_rail_km_by_status_100km_200km.json \
            --built ../source/rs/built/v376b_JRC_GHSL2020_real_world_builtup_m2_100km_200km.json \
            --tree ../source/rs/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road ../source/rs/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --population ../source/rs/pop/v391_original_global_GHS_POP2020_100km_200km.json \
            --ne ../source/rs/land/ne.geojson \
            --climate ../source/rs/land/wc2.1_10m_bio.zip \
            --out ../results/railstatus/railstatus_trophic_specificity.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-railstatus-trophic-specificity
          path: results/railstatus/railstatus_trophic_specificity.json
          if-no-files-found: error
