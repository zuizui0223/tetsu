name: "v27.0 original RAIL ROAD source site richness and species frequency fixed beta null"
on:
  push:
    branches: [research/tetsu-rail-road-replacement-v269-20261118]
    paths:
      - 'scripts/audit_RAIL_ROAD_source_frequency_fixed_reference_null_v270.py'
      - 'tests/test_RAIL_ROAD_fixed_source_frequency_null_v270.py'
      - '.github/workflows/tetsu-v270-source-frequency-fixed-rail-road-beta.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: tetsu-v270-source-original-rail-road-fixed-margins
  cancel-in-progress: true
jobs:
  original-rail-and-global-road-marginal-frequency-null:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Synthetic exact site richness and within-road taxon occupancy fixed matrix tests
        run: python -m unittest discover -s tests -p 'test_RAIL_ROAD_fixed_source_frequency_null_v270.py' -v
      - name: Download previously original-MD5 authenticated 167804 ROWS mountain ROADS source
        uses: actions/download-artifact@v4
        with:
          name: authentic-global-MIREN-standardized-road-verge-flora-v98
          run-id: 43212464976
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v270/miren
      - name: Strict original MIREN ROAD CSV source checksum/size
        run: |
          set -euo pipefail
          MIREN='source/v270/miren/source_original/MIREN_road_survey_2007_2023_v3.csv'
          test "$(stat -c%s "$MIREN")" = 17899241
          printf '%s  %s\n' 'b640195cc44f252ccb6ddb28eb6fff13' "$MIREN" | md5sum --check
      - name: Download original Kashmir railway source workbook from official version
        run: |
          set -euo pipefail
          mkdir -p source/v270/kashmir results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/v270/kashmir/dryad_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/v270/kashmir/dryad_99735.zip') as z:
              matches=[v for v in z.infolist() if not v.is_dir() and v.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(matches)!=1:raise ValueError('Source authentic Dryad ZIP missing sole original matrix')
              with z.open(matches[0]) as i,Path('source/v270/kashmir/Matrix_plot.xlsx').open('wb') as o:
                  shutil.copyfileobj(i,o)
          PY
          test "$(stat -c%s source/v270/kashmir/Matrix_plot.xlsx)" = 122187
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            'source/v270/kashmir/Matrix_plot.xlsx' | sha256sum --check
      - name: Source-original frequency preserving within-road and Kashmir group taxon matrix null
        run: |
          python -u scripts/audit_RAIL_ROAD_source_frequency_fixed_reference_null_v270.py \
            --miren-csv source/v270/miren/source_original/MIREN_road_survey_2007_2023_v3.csv \
            --kashmir-xlsx source/v270/kashmir/Matrix_plot.xlsx \
            --output results/audit/v270_original_RAIL_ROAD_site_species_margins_freq_null.json \
            --draws 99 --burnin 3000 --spacing 350
      - name: Archive derived aggregate/null statistics only, never author raw plant site rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v270-original-rail-global-road-fixed-species-frequency-beta-null
          path: results/audit/v270_original_RAIL_ROAD_site_species_margins_freq_null.json
          if-no-files-found: warn
