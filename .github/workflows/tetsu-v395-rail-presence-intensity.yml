name: "v395 original mapped rail presence versus positive rail length"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_rail_presence_intensity_v395.py'
      - 'tests/test_global_rail_presence_intensity_v395.py'
      - '.github/workflows/tetsu-v395-rail-presence-intensity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_rail_presence_intensity_v395.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v383-coarse-cell-naturalized-counts-only
          run-id: 45404886620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v395/cells
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v395/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v395/road
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v391-original-JRC-GHS-POP2020-global-coarse-counts
          run-id: 45425219960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v395/pop
      - name: Exact v394 replay then presence and positive-length decomposition
        run: |
          python -u scripts/analyze_global_rail_presence_intensity_v395.py \
            --cells source/v395/cells/v383_original_coarse_cell_counts.json \
            --tree source/v395/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road source/v395/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --population source/v395/pop/v391_original_global_GHS_POP2020_100km_200km.json \
            --out results/audit/v395_original_rail_presence_intensity.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v395-original-rail-presence-intensity
          path: results/audit/v395_original_rail_presence_intensity.json
          if-no-files-found: error
