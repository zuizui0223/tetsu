name: "v5.7 Six-country GRIIS species source dominant dataset LEAVEOUT vs physical RAIL/ROAD paths"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/analyze_GRIIS_topdataset_leaveout_rail_macro_v57.py'
      - 'tests/test_GRIIS_topdataset_leaveout_rail_macro_v57.py'
      - '.github/workflows/GBIF-GRIIS-dominant-dataset-rail-leaveout-v57.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-GRIIS-sixcountry-dominant-dataset-source-leaveout-v57
  cancel-in-progress: true
jobs:
  all-country-source-partition-network-join:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source numerical/GIS dependencies
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'requests>=2.31,<3' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Test strictly same-K-specific source cell pair comparisons full vs WITHOUT_TOP GRIIS flora
        run: python -m unittest discover -s tests -p 'test_GRIIS_topdataset_leaveout_rail_macro_v57.py' -v
      - name: Original six-country GRIIS plant species record source (from 10-block unselected geography)
        uses: actions/download-artifact@v4
        with:
          name: griis-50km-10block-8country-introduced-species-source-v36
          run-id: 42761140912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/plants
      - name: Actual newly retrieved source GRIIS speciesKey all-vs-top-dataset-vs-remaining species composition, six country regions
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-GRIIS-50km-dominant-dataset-vs-other-*-v56'
          run-id: 42831989148
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/species_splits
          merge-multiple: false
      - name: Actual all-Plantae GBIF datasetKey source composition for source overlap covariate
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-GBIF-50km-dataset-composition-*-v50'
          run-id: 42796286437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/datasets
          merge-multiple: false
      - name: Existing US FR physical RAIL source paths
        uses: actions/download-artifact@v4
        with:
          name: overture-50km-continuous-rail-physical-paths-threeblocks-v32
          run-id: 42759357722
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rail_old
      - name: Existing US FR physical ROAD source paths
        uses: actions/download-artifact@v4
        with:
          name: overture-50km-continuous-road-physical-paths-us-fr-v33
          run-id: 42759664602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/road_old
      - name: Actual four extra country RAIL shortest source routes
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-rail-physical-paths-*-v43'
          run-id: 42780398147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rail_new
          merge-multiple: false
      - name: Actual four extra country ROAD shortest source routes with missing-connector audit
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-road-physical-paths-*-v43'
          run-id: 42781107642
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/road_new
          merge-multiple: false
      - name: Require complete REAL external sources and execute six independent country source recording leaveout
        run: |
          test "$(find source/species_splits -name '*.json' | wc -l)" -eq 6
          test "$(find source/datasets -name '*.json' | wc -l)" -eq 6
          test "$(find source/rail_new -name '*.json' | wc -l)" -eq 4
          test "$(find source/road_new -name '*.json' | wc -l)" -eq 4
          python -u scripts/analyze_GRIIS_topdataset_leaveout_rail_macro_v57.py \
            --flora source/plants/griis_50km_10blocks_country_mask_v36.json \
            --rail-sources source/rail_old/overture_50km_continuous_rail_routes_v32.json source/rail_new/*/*.json \
            --road-sources source/road_old/overture_50km_macro_road_paths_v33.json source/road_new/*/*.json \
            --species-sources source/species_splits/*/*.json \
            --dataset-sources source/datasets/*/*.json \
            --output results/audit/GBIF_sixcountry_topdataset_leaveout_flora_rail_v57.json
      - name: Archive all original historical periods source denominators and matched full-vs-leaveout country ecological signs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-country-GRIIS-50km-dominant-dataset-leaveout-RAIL-flora-v57
          path: results/audit/GBIF_sixcountry_topdataset_leaveout_flora_rail_v57.json
          if-no-files-found: warn
