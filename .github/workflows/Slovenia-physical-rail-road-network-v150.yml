name: "v15.0 REAL historical Slovenia 2024 OSM rail-vs-road paths for 89 original plant sites"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - 'scripts/analyze_Slovenia_true_OSM_rail_road_paths_v150.py'
      - 'tests/test_Slovenia_true_OSM_rail_road_paths_v150.py'
      - '.github/workflows/Slovenia-physical-rail-road-network-v150.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-Slovenia-2024-original-rail-road-OSM-network-v150
  cancel-in-progress: true
jobs:
  exact-original-89-site-rail-road-network:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed physical OSM PBF parser and sparse graph solver
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'osmium==4.2.0'
      - name: Validate physical topology/source GPS snap using synthetic unit tests (never biological fakes)
        run: python -m unittest discover -s tests -p 'test_Slovenia_true_OSM_rail_road_paths_v150.py' -v
      - name: Retrieve authenticated original Slovenian publisher plant and original route transect GPS data
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/SLO150/authentic
      - name: Read fixed 2024-01 historical OSM geofabrik Slovenia graph; no current 2026 map hindsight
        run: |
          set -euo pipefail
          mkdir -p source/SLO150/osm
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --max-time 600 \
            --user-agent 'tetsu-research-topology-audit/1.0' \
            --output source/SLO150/osm/slovenia-240101.osm.pbf \
            'https://download.geofabrik.de/europe/slovenia-240101.osm.pbf'
          test "$(stat --format=%s source/SLO150/osm/slovenia-240101.osm.pbf)" = "280842431"
          sha256sum source/SLO150/osm/slovenia-240101.osm.pbf
      - name: Compute ONLY original-OSM-node physical rail/road network paths, sites snap, cross-border truncation QC
        run: |
          python -u scripts/analyze_Slovenia_true_OSM_rail_road_paths_v150.py \
            --original-xlsx source/SLO150/authentic/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --source-audit102 source/SLO150/authentic/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --osm-pbf source/SLO150/osm/slovenia-240101.osm.pbf \
            --output results/audit/SLO_89site_2024_OSM_true_rail_road_paths_v150.json
      - name: Archive only SHA-audited aggregated topology checks, not source photos/Osm PBF/XLSX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Slovenia-89-original-field-rail-road-topology-v150
          path: results/audit/SLO_89site_2024_OSM_true_rail_road_paths_v150.json
          if-no-files-found: warn
