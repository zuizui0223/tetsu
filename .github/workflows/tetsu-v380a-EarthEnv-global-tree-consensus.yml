name: "v380a original independent global EarthEnv tree-cover consensus to exact railway plant macro grids"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/aggregate_global_tree_consensus_EarthEnv_v380a.py'
      - '.github/workflows/tetsu-v380a-EarthEnv-global-tree-consensus.yml'
      - 'tests/test_global_tree_consensus_EarthEnv_v380a.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_tree_layers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'rasterio>=1.4,<2' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_tree_consensus_EarthEnv_v380a.py' -v
      - name: Download all four official full-version original global EarthEnv consensus layers
        run: |
          set -euo pipefail
          mkdir -p source/v380a/trees
          for c in 1 2 3 4; do
            f=consensus_full_class_$c.tif
            url="https://data.earthenv.org/consensus_landcover/with_DISCover/$f"
            curl -LfS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 "$url" -o "source/v380a/trees/$f"
            sha256sum "source/v380a/trees/$f"
          done
      - name: Source alignment, range, projected original pixel area aggregation and 2x2 conservation
        run: |
          python -u scripts/aggregate_global_tree_consensus_EarthEnv_v380a.py --source-dir source/v380a/trees --output results/audit/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          path: results/audit/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json
          if-no-files-found: error
