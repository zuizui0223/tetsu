name: "v8.6 REAL US2022 directed crop RAIL vs TRUCK OD versus 2018-21 and 2023-25 GRIIS recorded-source taxa"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/analyze_US_FAF6_directional_source_taxa_v86.py'
      - 'tests/test_US_FAF6_directional_source_taxa_v86.py'
      - '.github/workflows/US-FAF6-directional-first-records-v86.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-US51-2022-FAF6-directional-records-v86
  cancel-in-progress: true
jobs:
  genuine-directional-freight-vs-first-recorded-taxa-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified Census GBIF FAF6 GRIIS model dependencies
        run: pip install 'requests>=2.31,<3' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Verify original source-year and no-imputed-colonization directionality tests
        run: python -m unittest discover -s tests -p 'test_US_FAF6_directional_source_taxa_v86.py' -v
      - name: Download official 2022 FAF6 51 state RAIL vs TRUCK crop directional freight economic OD
        uses: actions/download-artifact@v4
        with:
          name: real-US-2022-FAF6-RAIL-TRUCK-crop-state-OD-network-v80
          run-id: 43142647675
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/FAF
      - name: Download all-source Census 51-state 2018–2025 US country-GRIIS GBIF plant matrix
        uses: actions/download-artifact@v4
        with:
          name: real-US-all51-state-GRIIS-GBIF-2018-25-v82
          run-id: 43144396513
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/GBIF82
      - name: Download independently verified two-period disjoint 2018-21 and 2023-25 USA GBIF indexed speciesKey sources
        uses: actions/download-artifact@v4
        with:
          name: real-US51-state-GRIIS-GBIF-before-after-FAF2022-v85
          run-id: 43153476962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/GBIF85
      - name: Calculate actual source-recorded taxon candidates origin BEFORE 2022 to destination AFTER 2022 vs direction-specific 2022 crop freight OD
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/analyze_US_FAF6_directional_source_taxa_v86.py \
            --temporal source/GBIF85/US_51_state_GRIIS_GBIF_pre2018_21_post2023_25_v85.json \
            --freight source/FAF/BTS_FAF6_2022_crop_OD_RAIL_vs_TRUCK_network_v80.json \
            --flora82 source/GBIF82/US_all51_state_GRIIS_GBIF_2018_25_source_v82.json \
            --output results/audit/US_FA6_2022_directional_source_recorded_taxa_v86.json
      - name: Preserve directionally linked RAIL vs TRUCK record-source descriptive contrasts and support gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-US-FAF6-2022-directional-recorded-source-taxa-v86
          path: results/audit/US_FA6_2022_directional_source_recorded_taxa_v86.json
          if-no-files-found: warn
