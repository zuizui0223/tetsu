name: Utsunomiya Sentinel-2 Collection 1 harmonized source and offset audit
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_utsunomiya_s2_c1.py'
      - '.github/workflows/utsunomiya-s2-c1-source.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-utsunomiya-s2-c1-source
  cancel-in-progress: true
jobs:
  c1-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public STAC source client
        run: pip install 'requests>=2.31,<3'
      - name: Screen actual C1 L2A source 2017/2024/2025 and red NIR scale/offset
        run: python scripts/audit_utsunomiya_s2_c1.py --output results/audit/utsunomiya_s2_collection1_source.json
      - name: Upload public source metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utsunomiya-s2-collection1-harmonized-source-calibration
          path: results/audit/utsunomiya_s2_collection1_source.json
          if-no-files-found: warn
