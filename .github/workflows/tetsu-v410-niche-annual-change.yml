name: "v410 original annual within-cell niche changes"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_niche_annual_change_v410.py'
      - 'tests/test_global_niche_annual_change_v410.py'
      - 'data/derived/v410_verified_v405_annual.json'
      - '.github/workflows/tetsu-v410-niche-annual-change.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'boto3>=1.35,<2'
      - run: python -m unittest discover -s tests -p 'test_global_niche_annual_change_v410.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v405-original-niche-temporal-coarse
          run-id: 45568291544
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v410/annual
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v410/niche
      - run: python -u scripts/analyze_global_niche_annual_change_v410.py --source source/v410/annual/v405_original_niche_temporal_coarse.json --niche source/v410/niche/v399_original_niche_coarse_aggregates.json --verified data/derived/v410_verified_v405_annual.json --out results/audit/v410_original_niche_annual_change.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v410-original-niche-annual-change
          path: results/audit/v410_original_niche_annual_change.json
          if-no-files-found: error
