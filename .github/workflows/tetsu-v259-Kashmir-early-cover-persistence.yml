name: "v25.9 Kashmir authentic 2014 source plot cover predicts 2017 persistence"
on:
  push:
    branches: [research/tetsu-local-source-2014-2017-v258-20261118]
    paths:
      - 'scripts/audit_Kashmir_2014_species_cover_persistence_2017_v259.py'
      - 'tests/test_Kashmir_early_cover_persistence_v259.py'
      - '.github/workflows/tetsu-v259-Kashmir-early-cover-persistence.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v259-original-Dryad-track-early-cover-2017-persistence
  cancel-in-progress: true
jobs:
  source-authentic-early-cover-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned openpyxl read-only original XLSX parser
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Test ordinal source cover risk sets and within-plot label randomization
        run: python -m unittest discover -s tests -p 'test_Kashmir_early_cover_persistence_v259.py' -v
      - name: Download true original Dryad 2021 archive and validate published workbook SHA
        run: |
          set -euo pipefail
          mkdir -p source/v259/india results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/v259/india/original_Dryad_archive.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/v259/india/original_Dryad_archive.zip') as z:
              files=[v for v in z.infolist() if not v.is_dir() and v.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Not exactly one original matrix')
              with z.open(files[0]) as f,Path('source/v259/india/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(f,out)
          PY
          test "$(stat -c%s source/v259/india/Matrix_plot.xlsx)" = "122187"
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/v259/india/Matrix_plot.xlsx | sha256sum --check
      - name: Original numeric cover source sign and plot persistence AUC
        run: |
          python -u scripts/audit_Kashmir_2014_species_cover_persistence_2017_v259.py \
            --source source/v259/india/Matrix_plot.xlsx \
            --output results/audit/v259_Kashmir_2014_source_cover_vs_2017_plant_persistence.json \
            --draws 999
      - name: Publish only aggregate source sensitivity, never species-by-site matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v259-Dryad-original-2014-cover-to-2017-records
          path: results/audit/v259_Kashmir_2014_source_cover_vs_2017_plant_persistence.json
          if-no-files-found: warn
