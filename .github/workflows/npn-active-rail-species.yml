name: NPN 2024 actually observed railway-near vs matched-far site/species eligibility
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_npn_active_rail_sites.py'
      - 'src/tetsu/npn_individuals.py'
      - '.github/workflows/npn-active-rail-species.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-npn-active-rail-species
  cancel-in-progress: true
jobs:
  actual-cohort-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted NPN/GIS dependencies
        run: pip install 'requests>=2.31,<3' 'shapely>=2,<3' 'pyproj>=3.5,<4'
      - name: Run actual station×same species×2024 repeat-phenology census on frozen matching frame
        run: python scripts/audit_npn_active_rail_sites.py --pairs-per-state 12 --output results/audit/npn_rail_active_sites_2024.json
      - name: Save only aggregate eligibility numbers and real source/failure flags
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usa-npn-2024-rail-near-matched-active-site-species
          path: results/audit/npn_rail_active_sites_2024.json
          if-no-files-found: warn
