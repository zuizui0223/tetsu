name: "v407 original common-cell taxonomic null decomposition"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_niche_pool_common_v407.py'
      - 'tests/test_global_niche_pool_common_v407.py'
      - 'data/manifests/v407_verified_v403_coefficients.json'
      - '.github/workflows/tetsu-v407-global-niche-pool-common.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_niche_pool_common_v407.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v403-original-niche-pool-coarse
          run-id: 45565523074
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v407/pool
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v399-original-niche-coarse-aggregates
          run-id: 45554651105
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v407/niche
      - run: python -u scripts/analyze_global_niche_pool_common_v407.py --source source/v407/pool/v403_original_niche_pool_coarse.json --niche source/v407/niche/v399_original_niche_coarse_aggregates.json --expected data/manifests/v407_verified_v403_coefficients.json --out results/audit/v407_original_niche_pool_common.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v407-original-niche-pool-common
          path: results/audit/v407_original_niche_pool_common.json
          if-no-files-found: error
