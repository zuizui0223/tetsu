name: "v373 true fullworld railway 2.237M km macroclimate source exposure census"
on:
  push:
    branches:
      - research/tetsu-v368-world-rail-pps-biodiversity-20261124
    paths:
      - 'scripts/analyze_world_railkm_climate_distribution_v373.py'
      - 'tests/test_world_railkm_climate_distribution_v373.py'
      - '.github/workflows/tetsu-v373-fullworld-rail-climate-exposure.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-global-rail-km-biome-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install global land and original macrotemperature source reader
        run: python -m pip install 'numpy>=1.26,<3' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'rasterio>=1.3,<2'
      - name: Eight true global railway km and climate-banding source checks
        run: python -m unittest discover -s tests -p 'test_world_railkm_climate_distribution_v373.py' -v
      - name: Download source-verified full world 2026 original normal rail track 100km and 200km km exposure
        uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v373/rail
      - name: Download genuine source WorldClim2.1 BIO1 climate and original NaturalEarth 110m global land
        run: |
          set -euo pipefail
          mkdir -p source/v373/map results/audit
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' \
            -o source/v373/map/wc2.1_10m_bio.zip
          printf '%s  %s\n' \
            '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf' \
            source/v373/map/wc2.1_10m_bio.zip | sha256sum --check
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 240 \
            'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' \
            -o source/v373/map/ne_original_admin0_units.geojson
          printf '%s  %s\n' \
            '718ac51d68ed2bf5de4f563fff2e2e045db706c1d3222805f3e317140a64213b' \
            source/v373/map/ne_original_admin0_units.geojson | sha256sum --check
      - name: True original full-world rail km weighted climate distribution vs each global landcell climate band
        run: |
          python -u scripts/analyze_world_railkm_climate_distribution_v373.py \
            --original-v370-rail-grid source/v373/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --natural-earth source/v373/map/ne_original_admin0_units.geojson \
            --worldclim-zip source/v373/map/wc2.1_10m_bio.zip \
            --output results/audit/v373_true_global_railkm_worldclim_by_continent_biome.json
      - name: Publish source-only infrastructure climate confounding baseline (NOT railway plant ecological result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v373-true-global-railkm-WorldClim-climate-frame-by-continent
          path: results/audit/v373_true_global_railkm_worldclim_by_continent_biome.json
          if-no-files-found: warn
