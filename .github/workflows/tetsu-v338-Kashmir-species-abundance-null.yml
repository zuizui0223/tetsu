name: "v338 Kashmir species-conditioned original abundance thermal association null"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_Kashmir_species_conditioned_abundance_null_v338.py'
      - 'tests/test_Kashmir_species_conditioned_abundance_null_v338.py'
      - '.github/workflows/tetsu-v338-Kashmir-species-abundance-null.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-railway-species-abundance-conditional-source-null:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source XLSX and frozen EIVE/GEO matcher dependencies
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Verify 9 synthetic species-conditional abundance label shuffles
        run: python -m unittest discover -s tests -p 'test_Kashmir_species_conditioned_abundance_null_v338.py' -v
      - name: Acquire authentic original 2014/2017 Kashmir railway Dryad species abundance plot table
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir()
                      and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Original Dryad source file not exactly one')
              with z.open(files[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
           '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
           source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Verify independent source-authentic EIVE temperature ecology values
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Replay v334 source observed station pairs and compute species abundance-conditioned original-sample null
        run: |
          python -u scripts/analyze_Kashmir_species_conditioned_abundance_null_v338.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v338_Kashmir_species_specific_abundance_conditional_null.json
      - name: Archive aggregate-only conditional source results; no original plot species matrix or coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v338-authentic-Kashmir-species-specific-abundance-null-aggregates
          path: results/audit/v338_Kashmir_species_specific_abundance_conditional_null.json
          if-no-files-found: warn
