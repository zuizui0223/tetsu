name: "v16.5 REAL original top20 railway plant iNaturalist 30m polyline proximity SI CZ photorecords"
on:
  push:
    branches: [research/railway-seed-dispersal-v01]
    paths:
      - 'scripts/audit_20_original_rail_plants_inat_30m_two_regions_v165.py'
      - 'tests/test_inat_rail_top20_actual_polyline_30m_v165.py'
      - '.github/workflows/rail-iNat-source-top20-photo30m-SI-CZ-v165.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v165-SI-CZ-source-rank20-iNaturalist-true-rail-polyline30m
  cancel-in-progress: true
jobs:
  real-source-20-species-rail-30m-public-photo-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 49
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact GIS polyline index, 2023/2024 original PBF geometry and public iNaturalist API dependencies
        run: python -m pip install 'requests==2.32.3' 'shapely==2.1.2' 'pyproj==3.6.1' 'osmium==4.2.0'
      - name: Synthetic GIS test for actual 0-30m nearest railway POLYLINE, 30m geolocation uncertainty and privacy
        run: python -m unittest discover -s tests -p 'test_inat_rail_top20_actual_polyline_30m_v165.py' -v
      - name: Download source-preselected 20 EXACT real botanical railway binomials BEFORE inspecting any iNaturalist positions
        uses: actions/download-artifact@v4
        with:
          name: original-SI-CZ-rail-flora-top20-photo-candidates-v164
          run-id: 43692256719
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v165/predeclared
      - name: Restore source-verified Slovenia 2024 original historic entire country OSM PBF
        uses: actions/cache/restore@v4
        with:
          path: source/SLO151/osm/slovenia-240101.osm.pbf
          key: tetsu-Geofabrik-Slovenia-20240101-source-file-280842431-bytes-v1
          fail-on-cache-miss: true
      - name: Restore source-verified Czech 2023 original historic entire country OSM PBF
        uses: actions/cache/restore@v4
        with:
          path: source/CZE155/czech-republic-230101.osm.pbf
          key: tetsu-czech-20230101-geofabrik-original-816159635-pbf-source
          fail-on-cache-miss: true
      - name: Guard no alternative geography or modified original OSM source allowed
        run: |
          set -euo pipefail
          test "$(stat -c%s source/SLO151/osm/slovenia-240101.osm.pbf)" = "280842431"
          test "$(stat -c%s source/CZE155/czech-republic-230101.osm.pbf)" = "816159635"
          printf '%s  %s\n' \
            'b572258fe000d6dfc76dc63afe5456121c5f463995e132a5dcd79957d819ae39' source/SLO151/osm/slovenia-240101.osm.pbf \
            '26ff09ded5fa72dc9556b543b532d7df011f2e3c08af461ea2f537a9b0b42747' source/CZE155/czech-republic-230101.osm.pbf | sha256sum --check
      - name: Full source-region iNaturalist photo census all original 20 species nearest genuine historic RAIL polyline within 30m and GPS uncertainty below 30m
        run: |
          python -u scripts/audit_20_original_rail_plants_inat_30m_two_regions_v165.py \
            --candidates source/v165/predeclared/Real_two_original_rail_botanist_20_taxa_inat_first_proximity_v164.json \
            --si-osm-pbf source/SLO151/osm/slovenia-240101.osm.pbf \
            --cz-osm-pbf source/CZE155/czech-republic-230101.osm.pbf \
            --api-delay 1.10 \
            --output results/audit/REAL_SI_CZ_original20_iNat_30m_railway_polyline_photo_v165.json
      - name: Archive only aggregate original source 30m counts, NEVER public observation IDs, photo pixels or coordinate pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-rail-top20-INat-30m-real-line-SI-CZ-v165
          path: results/audit/REAL_SI_CZ_original20_iNat_30m_railway_polyline_photo_v165.json
          if-no-files-found: warn
