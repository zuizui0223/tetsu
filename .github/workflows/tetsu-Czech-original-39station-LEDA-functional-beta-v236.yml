name: "v23.6 authentic Czech 39 railway stations continuous height-seed functional convergence five-stretch fixed-margin null"
on:
  push:
    branches: [research/tetsu-slovenia-identity-guild-v210-20261116]
    paths:
      - 'scripts/analyze_Czech_39station_original_LEDA_height_seed_functional_beta_v236.py'
      - 'tests/test_Czech_station_LEDA_continuous_beta_v236.py'
      - '.github/workflows/tetsu-Czech-original-39station-LEDA-functional-beta-v236.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v236-original-Czech-LEDA-continuous-beta-null
  cancel-in-progress: true
jobs:
  czech-original-39station-5stretch-LEDA-trait-centroid:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original XLSX reader only
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Validate genuine station fixed margins / centroid math on synthetic inputs only
        run: python -m unittest discover -s tests -p 'test_Czech_station_LEDA_continuous_beta_v236.py' -v
      - name: Fetch original 2024 Preslia publisher Czech 39station survey S1 and corrected erratum S2
        run: |
          set -euo pipefail
          mkdir -p source/v236/Czech
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx' \
            -o source/v236/Czech/S1.xlsx
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://preslia.cz/appendix/file?id=540' \
            -o source/v236/Czech/S2.xlsx
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/v236/Czech/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/v236/Czech/S2.xlsx \
            | sha256sum --check
      - name: Fetch original University Oldenburg LEDA species-median canopy height and seed mass
        run: |
          set -euo pipefail
          mkdir -p source/v236/LEDA
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source/v236/LEDA/canopy_height.txt
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source/v236/LEDA/seed_mass.txt
          printf '%s  %s\n' \
            'cbf5e761390d78a843512dfc1139acfc1154d46d6c1995a827354840a9f78a92' source/v236/LEDA/canopy_height.txt \
            '34aa12c333fc1ba6de2e560a495ac5d693aa0722a09ecf68418ad94ac1c19cef' source/v236/LEDA/seed_mass.txt \
            | sha256sum --check
      - name: Analyze REAL original 39 published station rec taxa and LEDA 2D beta with exact within-stretch source incidence margins
        run: |
          python -u scripts/analyze_Czech_39station_original_LEDA_height_seed_functional_beta_v236.py \
            --cz-s1 source/v236/Czech/S1.xlsx \
            --cz-s2 source/v236/Czech/S2.xlsx \
            --height source/v236/LEDA/canopy_height.txt \
            --seed source/v236/LEDA/seed_mass.txt \
            --output results/audit/v236_Czech_39_2020_22_railway_stations_LEDA_2D_functional_beta_stretch_internal_null.json
      - name: Store only true source aggregate estimates and SHA QA (no raw publisher XLSX / LEDA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v236-real-39-Czech-stations-five-stretch-height-seed-functional-beta-null
          path: results/audit/v236_Czech_39_2020_22_railway_stations_LEDA_2D_functional_beta_stretch_internal_null.json
          if-no-files-found: warn
