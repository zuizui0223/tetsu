name: "v335 original Kashmir source positive weight thermal CWM reversal outlier audit"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/audit_Kashmir_original_weight_sign_reversal_v335.py'
      - 'tests/test_Kashmir_original_weight_sign_reversal_v335.py'
      - '.github/workflows/tetsu-v335-Kashmir-original-positive-weight-CWM.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-rail-dominance-outlier-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original read-only plant observation and geographic matching dependencies
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Check frozen exponent and positive-value source outlier sensitivity
        run: python -m unittest discover -s tests -p 'test_Kashmir_original_weight_sign_reversal_v335.py' -v
      - name: Download source-authenticated published Kashmir 2021 original Dryad species quantitative records
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/dryad_v99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/dryad_v99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir()
                   and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Not exactly one original Dryad Matrix_plot.xlsx')
              with z.open(files[0]) as f,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(f,out)
          PY
          printf '%s  %s\n' \
           '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
           source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Authenticate original European EIVE 1.0 source thermal niche position indicators
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
           '0f0ce19cd2a781eeed027d8b0acadbcb' \
           source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Run original 103.6 outlier control, source value power gradient and one species omission
        run: |
          python -u scripts/audit_Kashmir_original_weight_sign_reversal_v335.py \
           --kashmir-original source/Kashmir/Matrix_plot.xlsx \
           --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
           --output results/audit/v335_Kashmir_weight_power_outlier_and_taxon_null.json
      - name: Preserve scientific summary only, not original publisher rows or coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v335-Kashmir-original-cover-weight-reversal-robustness
          path: results/audit/v335_Kashmir_weight_power_outlier_and_taxon_null.json
          if-no-files-found: warn
