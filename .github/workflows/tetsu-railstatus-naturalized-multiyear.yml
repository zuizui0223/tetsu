name: "railstatus: documented naturalized versus unlisted plant richness 2023-2025"
on:
  push:
    branches: [research/tetsu-railstatus-placebo-20261125]
    paths:
      - 'scripts/analyze_world_railstatus_naturalized_multiyear.py'
      - 'tests/test_world_railstatus_naturalized_multiyear.py'
      - '.github/workflows/tetsu-railstatus-naturalized-multiyear.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: railstatus-naturalized-multiyear
  cancel-in-progress: true
jobs:
  status_naturalized:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_world_railstatus_naturalized_multiyear.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v397-original-multiyear-coarse-counts
          run-id: 45548846372
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsn/annual
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v383-coarse-cell-naturalized-counts-only
          run-id: 45404886620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsn/v383
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-world-rail-km-by-status
          run-id: 45556359068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsn/status
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsn/road
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsn/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v391-original-JRC-GHS-POP2020-global-coarse-counts
          run-id: 45425219960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rsn/pop
      - name: Compare status effects on documented and unlisted plant richness
        run: |
          python -u scripts/analyze_world_railstatus_naturalized_multiyear.py \
            --annual source/rsn/annual/v397_original_multiyear_coarse_counts.json \
            --v383 source/rsn/v383/v383_original_coarse_cell_counts.json \
            --status source/rsn/status/world_rail_km_by_status_100km_200km.json \
            --road source/rsn/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --tree source/rsn/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --population source/rsn/pop/v391_original_global_GHS_POP2020_100km_200km.json \
            --out results/railstatus/railstatus_naturalized_multiyear.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-railstatus-naturalized-multiyear
          path: results/railstatus/railstatus_naturalized_multiyear.json
          if-no-files-found: error
