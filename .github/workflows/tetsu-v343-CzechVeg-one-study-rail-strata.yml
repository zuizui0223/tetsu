name: "v343 Czech original single-study railway yard vs embankment EIVE temperature confound"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_CzechVeg_within_one_study_rail_strata_v343.py'
      - 'tests/test_CzechVeg_within_one_study_rail_strata_v343.py'
      - '.github/workflows/tetsu-v343-CzechVeg-one-study-rail-strata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-original-publication-two-rail-habitats:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install one-to-one true original geodesic study controls
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Test exactly one Czech source publication two types and near-source altitude grouping
        run: python -m unittest discover -s tests -p 'test_CzechVeg_within_one_study_rail_strata_v343.py' -v
      - name: Authenticate complete original Czech vegetation plot metadata 2026-03-26
        run: |
          set -euo pipefail
          mkdir -p source/CzechVeg source/EIVE results/audit
          curl -LfSs --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
            'https://zenodo.org/records/19231152/files/CzechVeg-Open_headers_v1-1_2026-03-26.csv?download=1' \
            -o source/CzechVeg/CzechVeg-Open_headers_v1-1_2026-03-26.csv
          printf '%s  %s\n' \
            '0bc920462d1f9eac473e7b2a231e6782' \
            source/CzechVeg/CzechVeg-Open_headers_v1-1_2026-03-26.csv | md5sum --check
      - name: Authenticate original full Czech vegetation vascular cover rows
        run: |
          curl -LfSs --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1400 \
            'https://zenodo.org/records/19231152/files/CzechVeg_Open_species_v1-1_2026-03-26.csv?download=1' \
            -o source/CzechVeg/CzechVeg_Open_species_v1-1_2026-03-26.csv
          printf '%s  %s\n' \
            'b296e5e19f03fb3bad0a8347c317f8a3' \
            source/CzechVeg/CzechVeg_Open_species_v1-1_2026-03-26.csv | md5sum --check
      - name: Authenticate source EIVE 1.0 plant thermal niche centre and width data
        run: |
          curl -LfSs --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Recompute both railway habitat types within the SAME authentic Czech source publication
        run: |
          python -u scripts/analyze_CzechVeg_within_one_study_rail_strata_v343.py \
            --source-headers source/CzechVeg/CzechVeg-Open_headers_v1-1_2026-03-26.csv \
            --source-species source/CzechVeg/CzechVeg_Open_species_v1-1_2026-03-26.csv \
            --eive-xlsx source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v343_CzechVeg_same_source_rail_yard_and_embankment_EIVE.json
      - name: Save anonymized original-study aggregates only, no source GPS, plot IDs or original species table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v343-CzechVeg-one-source-two-rail-habitats-EIVE
          path: results/audit/v343_CzechVeg_same_source_rail_yard_and_embankment_EIVE.json
          if-no-files-found: warn
