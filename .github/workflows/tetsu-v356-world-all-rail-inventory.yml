name: "v356 entire global Overture railway original file inventory and connector schema"
on:
  push:
    branches: [research/tetsu-v356-global-complete-rail-graph-20261124]
    paths:
      - 'scripts/audit_global_Overture_all_rail_parquet_inventory_v356.py'
      - 'tests/test_global_Overture_all_rail_inventory_v356.py'
      - '.github/workflows/tetsu-v356-world-all-rail-inventory.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: tetsu-v356-official-global-all-rail-inventory
  cancel-in-progress: true
jobs:
  official_Oveture_all_world_parquet_source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install original source AWS anonymous inventory and Overture rail schema readers
        run: python -m pip install 'boto3>=1.35,<2' 'overturemaps==2.1.1' 'pyarrow>=18,<25'
      - name: Test immutable full source release and inventory source boundaries
        run: |
          python -m unittest discover -s tests -p 'test_global_Overture_all_rail_inventory_v356.py' -v
          python -m py_compile scripts/audit_global_Overture_all_rail_parquet_inventory_v356.py
      - name: List EVERY original global transportation segment source parquet, inspect physical connector and source OSM IDs
        run: |
          python -u scripts/audit_global_Overture_all_rail_parquet_inventory_v356.py \
            --output results/audit/v356_full_world_transportation_parquet_inventory_and_real_rail_schema.json
      - name: Archive official source object inventory with full completeness QA, NO duplicated raw geometry or source plants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v356-entire-global-transportation-object-registry
          path: results/audit/v356_full_world_transportation_parquet_inventory_and_real_rail_schema.json
          if-no-files-found: warn
