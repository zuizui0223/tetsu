name: "v4.6 Six-country 50km GRIIS plants versus RAIL circuit effective resistance Q"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/analyze_6country_circuit_macro_plants_v46.py'
      - 'tests/test_6country_circuit_macro_plants_v46.py'
      - '.github/workflows/6country-rail-circuit-plants-v46.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-six-country-rail-circuit-flora-v46
  cancel-in-progress: true
jobs:
  macro-country-source-circuit-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical sources for GRIIS plant and physical graph geographic join
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'requests>=2.31,<3' 'pyproj>=3.5,<4' 'shapely>=2,<3'
      - name: Validate six independent countries and exact positive-circuit Q source metadata
        run: python -m unittest discover -s tests -p 'test_6country_circuit_macro_plants_v46.py' -v
      - name: Fetch predeclared 8-country country GRIIS introduced plant positive source facets
        uses: actions/download-artifact@v4
        with:
          name: griis-50km-10block-8country-introduced-species-source-v36
          run-id: 42761140912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/plants
      - name: Fetch old two-country actual physical Overture RAIL shortest paths (plus known JP Tohoku provenance)
        uses: actions/download-artifact@v4
        with:
          name: overture-50km-continuous-rail-physical-paths-threeblocks-v32
          run-id: 42759357722
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rail_old
      - name: Fetch old two-country actual physical ROAD shortest paths
        uses: actions/download-artifact@v4
        with:
          name: overture-50km-continuous-road-physical-paths-us-fr-v33
          run-id: 42759664602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/road_old
      - name: Fetch four NEW independent country RAIL physical shortest paths
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-rail-physical-paths-*-v43'
          run-id: 42780398147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rail_new
          merge-multiple: false
      - name: Fetch four NEW country ROAD physical shortest paths after endpoint-connectivity source audit
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-road-physical-paths-*-v43'
          run-id: 42781107642
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/road_new
          merge-multiple: false
      - name: Fetch validated original US and French 50km mapped railway electric resistor source
        uses: actions/download-artifact@v4
        with:
          name: 50km-rail-physical-circuit-effective-resistance-v37
          run-id: 42766118921
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/circuit_old
      - name: Fetch new four independently calculated 50km railway circuit effective resistances
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-rail-circuit-*-v45'
          run-id: 42781597862
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/circuit_new
          merge-multiple: false
      - name: Require four verified paths and four real rail circuits before country macro inference
        run: |
          test "$(find source/rail_new -name '*.json' | wc -l)" -eq 4
          test "$(find source/road_new -name '*.json' | wc -l)" -eq 4
          test "$(find source/circuit_new -name '*.json' | wc -l)" -eq 4
          python -u scripts/analyze_6country_circuit_macro_plants_v46.py \
            --flora source/plants/griis_50km_10blocks_country_mask_v36.json \
            --rail-sources source/rail_old/overture_50km_continuous_rail_routes_v32.json source/rail_new/*/*.json \
            --road-sources source/road_old/overture_50km_macro_road_paths_v33.json source/road_new/*/*.json \
            --circuit-sources source/circuit_old/50km_rail_circuit_resistance_v37.json source/circuit_new/*/*.json \
            --output results/audit/6country_50km_GRIIS_circuit_increment_v46.json
      - name: Archive all six independent regional source results, anchor and response sensitivities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-country-50km-GRIIS-flora-rail-circuit-increment-v46
          path: results/audit/6country_50km_GRIIS_circuit_increment_v46.json
          if-no-files-found: warn
