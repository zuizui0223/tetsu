name: v3.2 Continuous Overture railway shortest paths for 50km macro source cells
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_50km_rail_paths_v32.py'
      - 'tests/test_overture_50km_rail_paths_v32.py'
      - '.github/workflows/overture-50km-rail-paths-v32.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-overture-rail-50km-continuous-v32
  cancel-in-progress: true
jobs:
  three-block-source-rail-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geo source and parquet clients
        run: pip install 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Test 50km physical rail route lengths, anchors, crossing separation and source errors
        run: python -m unittest discover -s tests -p 'test_overture_50km_rail_paths_v32.py' -v
      - name: Query real October-2026 Overture rail connector shortest paths in JP US FR 50km blocks
        run: |
          python -u scripts/audit_overture_50km_rail_paths_v32.py \
            --blocks jp_tohoku us_midwest fr_burgundy \
            --output results/audit/overture_50km_continuous_rail_routes_v32.json
      - name: Preserve only source cell route lengths and geometric quality checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-50km-continuous-rail-physical-paths-threeblocks-v32
          path: results/audit/overture_50km_continuous_rail_routes_v32.json
          if-no-files-found: warn
