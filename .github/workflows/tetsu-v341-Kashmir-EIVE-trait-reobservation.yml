name: "v341 source-true Kashmir thermal affinity and 2014-17 re-observation"
on:
  push:
    branches:
      - research/tetsu-Kashmir-Cynodon-persistence-v340-20261124
    paths:
      - 'scripts/analyze_Kashmir_EIVE_species_reobservation_v341.py'
      - 'tests/test_Kashmir_EIVE_species_reobservation_v341.py'
      - '.github/workflows/tetsu-v341-Kashmir-EIVE-trait-reobservation.yml'
  pull_request:
    branches:
      - research/tetsu-Kashmir-C4-thermal-mechanism-v339-20261123
    paths:
      - 'scripts/analyze_Kashmir_EIVE_species_reobservation_v341.py'
      - 'tests/test_Kashmir_EIVE_species_reobservation_v341.py'
      - '.github/workflows/tetsu-v341-Kashmir-EIVE-trait-reobservation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_trait_reobservation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific original-source readers
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Validate trait-reobservation and shuffle machinery using synthetic data
        run: python -m unittest discover -s tests -p 'test_Kashmir_EIVE_species_reobservation_v341.py' -v
      - name: Download checksum-fixed authentic 2014/2017 Kashmir railway survey
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir() and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Authentic original matrix source is not unique')
              with z.open(files[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Download independent checksum-fixed EIVE thermal-indicator source
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: True same-site thermal trait of re-observed vs lost-from-record species
        run: |
          python -u scripts/analyze_Kashmir_EIVE_species_reobservation_v341.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v341_Kashmir_species_thermal_2014_2017_reobservation_aggregate.json
      - name: Archive only aggregate temperature trait reobservation summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v341-Kashmir-EIVE-trait-reobservation-aggregate-only
          path: results/audit/v341_Kashmir_species_thermal_2014_2017_reobservation_aggregate.json
          if-no-files-found: warn
