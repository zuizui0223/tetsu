name: "v416 family ecology conditional HWI railway connectivity"
on:
  push:
    branches: [research/tetsu-v416-bird-hwi-conditional-20261125]
    paths:
      - 'scripts/scan_world_railstatus_bird_hwi_conditional_v416.py'
      - 'scripts/analyze_world_railstatus_bird_hwi_conditional_v416.py'
      - 'tests/test_world_railstatus_bird_hwi_conditional_v416.py'
      - '.github/workflows/tetsu-v416-bird-hwi-conditional.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tetsu-v416-conditional-HWI
  cancel-in-progress: false
jobs:
  bird_avonet:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'boto3>=1.35,<2' 'openpyxl>=3.1,<4' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_world_railstatus_bird_hwi_conditional_v416.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-direct-boundary-crossings
          run-id: 45568209801
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/edges
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-world-rail-km-by-status
          run-id: 45556359068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/status
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/plants
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/rail
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v376b-JRC-GHSL-2020-global-builtup-100km-200km-real-source
          run-id: 45382671629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/built
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/road
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v391-original-JRC-GHS-POP2020-global-coarse-counts
          run-id: 45425219960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/pop
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-observer-split-beta
          run-id: 45568727573
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/split
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-four-taxa-2025-grid-counts
          run-id: 45560367041
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/prior
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-observer-annual-beta
          run-id: 45572306696
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/annual
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-bird-avonet-guilds
          run-id: 45578805811
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/old-guild
      - name: Exact prior source and conditional HWI guild replay
        run: |
          python -u scripts/scan_world_railstatus_bird_hwi_conditional_v416.py \
            --split source/rs/split/observer_split_beta.json \
            --annual source/rs/annual/observer_annual_beta.json \
            --prior-guild source/rs/old-guild/bird_avonet_guilds.json \
            --audit results/railstatus/v416_conditional_HWI_source_audit.json \
            --out results/railstatus/v416_conditional_HWI_guilds.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetsu-v416-conditional-HWI-source-audit
          path: results/railstatus/v416_conditional_HWI_source_audit.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-v416-conditional-HWI-guilds
          path: results/railstatus/v416_conditional_HWI_guilds.json
          if-no-files-found: error
      - name: Frozen land units and climate
        run: |
          set -euo pipefail
          mkdir -p source/rs/land
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' -o source/rs/land/ne.geojson
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 780 'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' -o source/rs/land/wc2.1_10m_bio.zip
      - name: Guild contrasts on identical all-year pair support
        run: |
          cd scripts
          python -u analyze_world_railstatus_bird_hwi_conditional_v416.py \
            --guild ../results/railstatus/v416_conditional_HWI_guilds.json \
            --annual ../source/rs/annual/observer_annual_beta.json \
            --split ../source/rs/split/observer_split_beta.json \
            --prior ../source/rs/prior/four_taxa_counts.json \
            --edges ../source/rs/edges/direct_boundary_crossings.json \
            --plant ../source/rs/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --rail ../source/rs/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --status ../source/rs/status/world_rail_km_by_status_100km_200km.json \
            --built ../source/rs/built/v376b_JRC_GHSL2020_real_world_builtup_m2_100km_200km.json \
            --tree ../source/rs/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road ../source/rs/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --population ../source/rs/pop/v391_original_global_GHS_POP2020_100km_200km.json \
            --ne ../source/rs/land/ne.geojson \
            --climate ../source/rs/land/wc2.1_10m_bio.zip \
            --out ../results/railstatus/v416_conditional_HWI_connectivity.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-v416-conditional-HWI-connectivity
          path: results/railstatus/v416_conditional_HWI_connectivity.json
          if-no-files-found: error
