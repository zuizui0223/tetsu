name: "v340 original Kashmir Cynodon 2014-2017 re-observation"
on:
  push:
    branches:
      - research/tetsu-Kashmir-Cynodon-persistence-v340-20261124
    paths:
      - 'scripts/analyze_Kashmir_Cynodon_transition_v340.py'
      - 'tests/test_Kashmir_Cynodon_transition_v340.py'
      - '.github/workflows/tetsu-v340-Kashmir-Cynodon-transition.yml'
  pull_request:
    branches:
      - research/tetsu-Kashmir-C4-thermal-mechanism-v339-20261123
    paths:
      - 'scripts/analyze_Kashmir_Cynodon_transition_v340.py'
      - 'tests/test_Kashmir_Cynodon_transition_v340.py'
      - '.github/workflows/tetsu-v340-Kashmir-Cynodon-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-same-site-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly the source XLSX reader
        run: python -m pip install 'openpyxl==3.1.5' 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Synthetic repeated-site and abundance invariants
        run: python -m unittest discover -s tests -p 'test_Kashmir_Cynodon_transition_v340.py' -v
      - name: Acquire authentic immutable original Kashmir species by plot source (not archived)
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_99735.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          with zipfile.ZipFile('source/Kashmir/official_99735.zip') as z:
              files=[f for f in z.infolist() if not f.is_dir() and f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(files)!=1:raise ValueError('Original Dryad Matrix_plot.xlsx must be unique')
              with z.open(files[0]) as inp,Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(inp,out)
          PY
          printf '%s  %s\n' \
           '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
           source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Re-observation and source-positive abundance 2014 to 2017
        run: |
          python -u scripts/analyze_Kashmir_Cynodon_transition_v340.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --output results/audit/v340_original_Kashmir_Cynodon_2014_2017_transitions_aggregate.json
      - name: Archive only year zone aggregate 2x2 tables, never original raw source site data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v340-Kashmir-Cynodon-temporal-aggregate-only
          path: results/audit/v340_original_Kashmir_Cynodon_2014_2017_transitions_aggregate.json
          if-no-files-found: warn
