name: "v7.1 REAL six-country GIFT growth form x GRIIS alien flora x RAIL/ROAD macro diagnostic"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/harvest_gift_growth_form_v70.py'
      - 'scripts/analyze_sixcountry_functional_rail_v71.py'
      - 'tests/test_rail_functional_macro_v70_v71.py'
      - '.github/workflows/GIFT-sixcountry-functional-rail-v71.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-sixcountry-real-GIFT-source-growthform-v71
  cancel-in-progress: true
jobs:
  original-sixcountry-growth-form-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original-network and direct official public GIFT species trait source requirements
        run: pip install 'requests>=2.31,<3' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3'
      - name: Validate frozen six-country growth form taxonomy, provenance, and common-pair macro model, synthetic only
        run: python -m unittest discover -s tests -p 'test_rail_functional_macro_v70_v71.py' -v
      - name: Download frozen original six-country GRIIS 50km indexed botanical species facets
        uses: actions/download-artifact@v4
        with:
          name: griis-50km-10block-8country-introduced-species-source-v36
          run-id: 42761140912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/flora
      - name: Download measured real US and France RAIL shortest source routes
        uses: actions/download-artifact@v4
        with:
          name: overture-50km-continuous-rail-physical-paths-threeblocks-v32
          run-id: 42759357722
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rail_old
      - name: Download measured real US and France ROAD shortest source routes
        uses: actions/download-artifact@v4
        with:
          name: overture-50km-continuous-road-physical-paths-us-fr-v33
          run-id: 42759664602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/road_old
      - name: Download four additional country railway route source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-rail-physical-paths-*-v43'
          run-id: 42780398147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rail_new
          merge-multiple: false
      - name: Download four additional country road route source artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'tetsu-50km-road-physical-paths-*-v43'
          run-id: 42781107642
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/road_new
          merge-multiple: false
      - name: Fetch public GIFT growth form 1.2.1 and exact currently accepted GBIF species names; record all unmatched taxa
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/harvest_gift_growth_form_v70.py \
            --flora source/flora/griis_50km_10blocks_country_mask_v36.json \
            --output results/audit/sixcountry_GIFT_growth_form_source_v70.json
      - name: Run six-country within-trait source rarefaction with identical paired physical rail and road networks
        run: |
          test "$(find source/rail_new -name '*.json' | wc -l)" -eq 4
          test "$(find source/road_new -name '*.json' | wc -l)" -eq 4
          OPENBLAS_NUM_THREADS=1 python -u scripts/analyze_sixcountry_functional_rail_v71.py \
            --flora source/flora/griis_50km_10blocks_country_mask_v36.json \
            --growth-form results/audit/sixcountry_GIFT_growth_form_source_v70.json \
            --rail-sources source/rail_old/overture_50km_continuous_rail_routes_v32.json source/rail_new/*/*.json \
            --road-sources source/road_old/overture_50km_macro_road_paths_v33.json source/road_new/*/*.json \
            --output results/audit/sixcountry_GIFT_growthform_vs_railroad_macro_v71.json
      - name: Preserve actual 6-country species trait coverage and signed outcomes, including unestimable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sixcountry-real-GIFT-growthform-railroad-macro-v71
          path: results/audit/*.json
          if-no-files-found: warn