name: v3.5 Natural Earth 10m country fraction in independent 50km macro GBIF blocks
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_naturalearth_macro_country_v35.py'
      - 'tests/test_naturalearth_macro_country_v35.py'
      - '.github/workflows/naturalearth-macro-country-v35.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-naturalearth-country-50km-v35
  cancel-in-progress: true
jobs:
  ten-block-land-jurisdiction-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source polygon and public GBIF source clients
        run: pip install 'requests>=2.31,<3' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'pyshp>=2.3,<3'
      - name: Unit-test country fraction geometry and missing botanical source protection
        run: python -m unittest discover -s tests -p 'test_naturalearth_macro_country_v35.py' -v
      - name: Retrieve real prior 10-block 50km GBIF record opportunity source artifact
        uses: actions/download-artifact@v4
        with:
          name: gbif-50km-independent-macro-10block-source-v29
          run-id: 42738021553
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/gbif
      - name: Audit real 10m Natural Earth country polygon fraction for 160 50km source cells
        run: |
          python -u scripts/audit_naturalearth_macro_country_v35.py \
            --gbif-coverage source/gbif/gbif_50km_10macroblocks_source_v29.json \
            --blocks jp_tohoku jp_kyushu us_midwest us_southeast ca_ontario gb_yorkshire fr_burgundy au_southeast de_saxony nz_north \
            --output results/audit/50km_naturalearth_country_fraction_v35.json
      - name: Archive quality summaries and source hash, not original country shapefile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naturalearth-10country-country-fraction-50km-macro-v35
          path: results/audit/50km_naturalearth_country_fraction_v35.json
          if-no-files-found: warn
