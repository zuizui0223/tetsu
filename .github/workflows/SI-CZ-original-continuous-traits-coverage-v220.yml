name: "v22.0 genuine SI/CZ railway original-source LEDA continuous-trait coverage"
on:
  push:
    branches: [research/tetsu-slovenia-identity-guild-v210-20261116]
    paths:
      - 'scripts/audit_SI_CZ_original_continuous_trait_coverage_v220.py'
      - '.github/workflows/SI-CZ-original-continuous-traits-coverage-v220.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v220-original-SI-CZ-LEDA-coverage
  cancel-in-progress: true
jobs:
  original-authenticated-trait-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original Czech source XLSX parser only
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Get genuine 2026 Slovenia author source from existing authenticated SUCCESS
        uses: actions/download-artifact@v4
        with:
          name: genuine-Slovenia-2026-railway-92site-vegetation-supplement-v102
          run-id: 43538799032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v220/Slovenia
      - name: Gate author original Slovenian bytes and SHA256
        run: |
          set -euo pipefail
          F='source/v220/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx'
          test "$(stat -c%s "$F")" = "401279"
          printf '%s  %s\n' '26be7ca9513dd54136d4ec499d8413c1cb288045f87fe3cf8814731f2edac99f' "$F" | sha256sum --check
      - name: Fetch original published Czech S1 and corrected S2 authors' station flora
        run: |
          set -euo pipefail
          mkdir -p source/v220/Czech
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx' \
            -o source/v220/Czech/S1.xlsx
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://preslia.cz/appendix/file?id=540' \
            -o source/v220/Czech/S2.xlsx
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/v220/Czech/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/v220/Czech/S2.xlsx \
            | sha256sum --check
      - name: Download public LEDA original canopy height and seed mass tables
        run: |
          set -euo pipefail
          mkdir -p source/v220/LEDA
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/canopy_height.txt' \
            -o source/v220/LEDA/canopy_height.txt
          curl -LfsS --retry 3 --connect-timeout 20 --max-time 180 \
            'https://uol.de/f/5/inst/biologie/ag/landeco/download/LEDA/Data_files/seed_mass.txt' \
            -o source/v220/LEDA/seed_mass.txt
          test "$(stat -c%s source/v220/LEDA/canopy_height.txt)" -ge 50000
          test "$(stat -c%s source/v220/LEDA/seed_mass.txt)" -ge 50000
          sha256sum source/v220/LEDA/{canopy_height,seed_mass}.txt
      - name: Strict original taxon-by-trait coverage and paired SI BS/BT support (NO claimed biological effect)
        run: |
          python -u scripts/audit_SI_CZ_original_continuous_trait_coverage_v220.py \
            --si-original source/v220/Slovenia/source_original/SLO_2026_rail_vegetation_microhabitats_original.xlsx \
            --si-audit source/v220/Slovenia/results/audit/Slovenia_2026_RAIL_92sites_plant_supplement_source_v102.json \
            --cz-s1 source/v220/Czech/S1.xlsx \
            --cz-s2 source/v220/Czech/S2.xlsx \
            --height source/v220/LEDA/canopy_height.txt \
            --seed source/v220/LEDA/seed_mass.txt \
            --output results/audit/v220_original_SI_CZ_continuous_trait_coverage.json
      - name: Archive aggregate QA and sample support counts ONLY (no raw originals or individual GPS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v220-source-SI-CZ-continuous-LEDA-trait-coverage-aggregate
          path: results/audit/v220_original_SI_CZ_continuous_trait_coverage.json
          if-no-files-found: warn
