name: "v15.6 ORIGINAL Czech 35 Preslia stations: historic ROAD-versus-rail network heldout ecology"
on:
  workflow_dispatch:
concurrency:
  group: tetsu-v156-czech2023-real-road-adjusted-ecological-source
  cancel-in-progress: true
jobs:
  original-Czech-botanical-rail-road-5stretch-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed source PBF reader, numeric solver, and read-only original XLSX parser
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'osmium==4.2.0' 'openpyxl==3.1.5'
      - name: Synthetic math tests, no field observations fabricated
        run: |
          python -m unittest discover -s tests -p 'test_Czech_2023_real_road_rail_heldout_identity_v156.py' -v
          python -m unittest discover -s tests -p 'test_Czech_2023_true_rail_road_osm_routes_v155.py' -v
      - name: Fetch ORIGINAL 2020-22 Czech author plant station XLSX and original Pladias trait files
        run: |
          set -euo pipefail
          mkdir -p source/CZE156
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE156/S1.xlsx \
            'https://www.preslia.cz/appendices/P24302KutlvasrSupplTableS1.xlsx'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE156/S2.xlsx \
            'https://preslia.cz/appendix/file?id=540'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE156/diaspore.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/141/lang/en'
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE156/lifeform.xlsx \
            'https://pladias.ibot.cas.cz/public/traits/downloadTraitData/feature/136/lang/en'
          printf '%s  %s\n' \
            'df6bc0b949e7f6a5cb57755dc8f9c86187223f66ddfbef959cf0e03ef7c46b06' source/CZE156/S1.xlsx \
            '00c7cfdf5047854ba99d47dc8ec8c55b1b7df72731ce647c22b286ddef24a5a2' source/CZE156/S2.xlsx | sha256sum --check
      - name: Fetch pinned official-derived 2026 SR70 station centroids (NOT original plot GPS)
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 180 \
            --output source/CZE156/SR70.csv \
            'https://raw.githubusercontent.com/Sap1k/jrunify-ext-geodata/main/rail/SR70.csv'
          printf '%s  %s\n' \
            'fc43a1969af64f17285c7c6e3a30b00c3994d0ba1cfda6db09d8e4baaa166019' source/CZE156/SR70.csv | sha256sum --check
      - name: Restore 2023 Czech original OSM 816MB source from successful v15.5 Actions cache
        uses: actions/cache/restore@v4
        with:
          path: source/CZE155/czech-republic-230101.osm.pbf
          key: tetsu-czech-20230101-geofabrik-original-816159635-pbf-source
          fail-on-cache-miss: true
      - name: Verify exact ORIGINAL historical PBF size plus SHA256 before biological analysis
        run: |
          set -euo pipefail
          test "$(stat --format=%s source/CZE155/czech-republic-230101.osm.pbf)" = "816159635"
          sha256sum source/CZE155/czech-republic-230101.osm.pbf
      - name: Fit 35 genuine station botanically measured assemblages with 5 original stretches held out
        run: |
          python -u scripts/analyze_Czech_2023_true_rail_road_heldout_taxon_identity_v156.py \
            --s1 source/CZE156/S1.xlsx \
            --s2 source/CZE156/S2.xlsx \
            --pladias-diaspore source/CZE156/diaspore.xlsx \
            --pladias-lifeform source/CZE156/lifeform.xlsx \
            --sr70 source/CZE156/SR70.csv \
            --osm-pbf source/CZE155/czech-republic-230101.osm.pbf \
            --output results/audit/Czech_2023_35station_5stretch_railroad_heldout_v156.json
      - name: Archive ONLY source-provenance and comparative model results, no original PBF or XLSX or raw registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Czech-original-2023-35station-rail-vs-road-heldout-v156
          path: results/audit/Czech_2023_35station_5stretch_railroad_heldout_v156.json
          if-no-files-found: warn
