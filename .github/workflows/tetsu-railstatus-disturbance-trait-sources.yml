name: "railstatus: authentic disturbance and movement trait source audit"
on:
  push:
    branches: [research/tetsu-railstatus-placebo-20261125]
    paths:
      - 'scripts/audit_railstatus_disturbance_trait_sources.py'
      - 'tests/test_railstatus_disturbance_trait_sources.py'
      - '.github/workflows/tetsu-railstatus-disturbance-trait-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: railstatus-disturbance-trait-sources
  cancel-in-progress: true
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'boto3>=1.35,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'openpyxl>=3.1,<4'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_railstatus_disturbance_trait_sources.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-four-taxa-2025-grid-counts
          run-id: 45560367041
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/taxa
      - name: Audit original trait sources and exact taxonomy
        run: python -u scripts/audit_railstatus_disturbance_trait_sources.py --taxa source/rs/taxa/four_taxa_counts.json --out results/railstatus/disturbance_trait_source_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetsu-railstatus-disturbance-trait-source-audit
          path: results/railstatus/disturbance_trait_source_audit.json
          if-no-files-found: warn
