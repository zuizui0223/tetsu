name: Audit actual Sentinel-2 COG radiometric offsets before railway NDVI
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_s2_utsunomiya_calibration.py'
      - '.github/workflows/s2-utsunomiya-radiometry.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-s2-radiometry-v12
  cancel-in-progress: true
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install remote STAC client
        run: pip install 'requests>=2.31,<3'
      - name: Inspect real S2 L2A 2017/2024/2025 red NIR calibration and BOA metadata
        run: python scripts/audit_s2_utsunomiya_calibration.py --output results/audit/s2_utsunomiya_radiometry_metadata.json
      - name: Upload source metadata only, no pixel-valued imagery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utsunomiya-s2-2017-2024-2025-boa-calibration
          path: results/audit/s2_utsunomiya_radiometry_metadata.json
          if-no-files-found: warn
