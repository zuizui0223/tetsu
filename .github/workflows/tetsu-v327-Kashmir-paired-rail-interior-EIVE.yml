name: "v327 genuine Kashmir railway vs local interior EIVE thermal centre and width"
on:
  push:
    branches:
      - research/tetsu-typical-species-climate-hypotheses-20261122
    paths:
      - 'scripts/analyze_Kashmir_rail_interior_EIVE_thermal_v327.py'
      - 'tests/test_Kashmir_rail_interior_EIVE_thermal_v327.py'
      - '.github/workflows/tetsu-v327-Kashmir-paired-rail-interior-EIVE.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-authenticated-Kashmir-rail-and-inland-thermal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen source XLSX reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Run 8 source original site-year thermal coverage and missingness tests
        run: python -m unittest discover -s tests -p 'test_Kashmir_rail_interior_EIVE_thermal_v327.py' -v
      - name: Get original Dryad source version ZIP and verify exact Kashmir XLSX SHA256
        run: |
          set -euo pipefail
          mkdir -p source/Kashmir source/EIVE results/audit
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 \
            'https://datadryad.org/api/v2/versions/99735/download' \
            -o source/Kashmir/official_version_99735.zip
          python - <<'PY'
          from pathlib import Path
          import shutil,zipfile
          with zipfile.ZipFile('source/Kashmir/official_version_99735.zip') as z:
              items=[f for f in z.infolist() if not f.is_dir() and
                     f.filename.split('/')[-1]=='Matrix_plot.xlsx']
              if len(items)!=1: raise RuntimeError('Expected exactly one original Matrix_plot.xlsx')
              with z.open(items[0]) as fh, Path('source/Kashmir/Matrix_plot.xlsx').open('wb') as out:
                  shutil.copyfileobj(fh,out)
          PY
          test "$(stat -c%s source/Kashmir/Matrix_plot.xlsx)" = '122187'
          printf '%s  %s\n' \
            '529f3b97521933018e12623b61f531f012c67241cae2602a6675dbd534192474' \
            source/Kashmir/Matrix_plot.xlsx | sha256sum --check
      - name: Authenticate exact EIVE 1.0 source niche centre and width file
        run: |
          curl -LfsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            'https://zenodo.org/records/7534792/files/EIVE_Paper_1.0_SM_08.xlsx?download=1' \
            -o source/EIVE/EIVE_Paper_1.0_SM_08.xlsx
          printf '%s  %s\n' \
            '0f0ce19cd2a781eeed027d8b0acadbcb' \
            source/EIVE/EIVE_Paper_1.0_SM_08.xlsx | md5sum --check
      - name: Original true Asian railway track vs same field site inland thermal centre and width
        run: |
          python -u scripts/analyze_Kashmir_rail_interior_EIVE_thermal_v327.py \
            --kashmir-original source/Kashmir/Matrix_plot.xlsx \
            --eive-original source/EIVE/EIVE_Paper_1.0_SM_08.xlsx \
            --output results/audit/v327_Kashmir_original_same_site_rail_vs_interior_EIVE_T.json
      - name: Archive scientific audit summary only, no original plot species records or GPS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetsu-v327-actual-Kashmir-rail-interior-EIVE-temperature-aggregate
          path: results/audit/v327_Kashmir_original_same_site_rail_vs_interior_EIVE_T.json
          if-no-files-found: warn
