name: "v382 global original plant richness and Jaccard road and tree falsification"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/analyze_global_rail_road_tree_richness_v382.py'
      - 'tests/test_global_rail_road_tree_richness_v382.py'
      - '.github/workflows/tetsu-v382-global-rail-road-tree-richness.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python -m unittest discover -s tests -p 'test_global_rail_road_tree_richness_v382.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v382/plants
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v382/rail
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v376b-JRC-GHSL-2020-global-builtup-100km-200km-real-source
          run-id: 45382671629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v382/built
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v382/tree
      - name: Retrieve independent publisher road and land-area grids and original geographic sources
        run: |
          set -euo pipefail
          mkdir -p source/v382/land
          curl -LfS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 180 'https://zenodo.org/records/6420961/files/GRIP4_density_total.zip?download=1' -o source/v382/land/GRIP4_density_total.zip
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' -o source/v382/land/ne.geojson
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 780 'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' -o source/v382/land/wc2.1_10m_bio.zip
          python -u scripts/aggregate_original_GRIP4_road_density_v381a.py --archive source/v382/land/GRIP4_density_total.zip --out source/v382/land/road.json
      - name: Frozen same-support continent-heldout nested models and direction estimates
        run: |
          python -u scripts/analyze_global_rail_road_tree_richness_v382.py \
            --plant source/v382/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --rail source/v382/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --built source/v382/built/v376b_JRC_GHSL2020_real_world_builtup_m2_100km_200km.json \
            --tree source/v382/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road source/v382/land/road.json --ne source/v382/land/ne.geojson \
            --climate source/v382/land/wc2.1_10m_bio.zip --out results/audit/v382_world_rail_road_tree_plant_richness_Jaccard.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v382-original-rail-road-tree-global-plant-prediction
          path: results/audit/v382_world_rail_road_tree_plant_richness_Jaccard.json
          if-no-files-found: error
