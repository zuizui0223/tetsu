name: v3.9 Skeptical Overture railway Circuitscape parallel-link duplication sensitivity
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - 'scripts/audit_overture_50km_circuit_v37.py'
      - 'scripts/audit_rail_circuit_parallel_source_v39.py'
      - 'tests/test_rail_circuit_parallel_source_v39.py'
      - '.github/workflows/rail-circuit-parallel-source-v39.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-v39-rail-circuit-parallel-source
  cancel-in-progress: true
jobs:
  rail-circuit-independent-physical-route-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse circuit and geospatial sources
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Check skeptical physical parallel labels versus real independently connected loops
        run: python -m unittest discover -s tests -p 'test_rail_circuit_parallel_source_v39.py' -v
      - name: Recompute both parallel assumptions on actual 50km rail networks in JP US FR
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/audit_rail_circuit_parallel_source_v39.py \
            --blocks jp_tohoku us_midwest fr_burgundy \
            --output results/audit/rail_circuit_parallel_source_sensitivity_v39.json
      - name: Archive aggregate all-source sensitivity, not proprietary source line or raw connector geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rail-physical-circuit-parallel-source-sensitivity-threeblocks-v39
          path: results/audit/rail_circuit_parallel_source_sensitivity_v39.json
          if-no-files-found: warn
