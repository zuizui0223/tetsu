name: "railstatus: independent sPlotOpen vegetation plot stature transfer"
on:
  push:
    branches: [research/tetsu-hwi-road-crossing-20261128]
    paths:
      - 'scripts/scan_splotopen_stature.py'
      - 'scripts/analyze_splotopen_stature.py'
      - 'tests/test_splotopen_stature.py'
      - '.github/workflows/tetsu-splotopen-stature.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: tetsu-splotopen-stature
  cancel-in-progress: true
jobs:
  plant_size_temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'netCDF4>=1.6,<2' 'boto3>=1.35,<2' 'openpyxl>=3.1,<4' 'fiona>=1.10,<2'
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_splotopen_stature.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-world-rail-km-by-status
          run-id: 45556359068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/status
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v369-original-world-plant-2025-coarse-100km-200km-gridded-richness-and-effort
          run-id: 45375453375
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/plants
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v370-original-fullworld-normal-rail-100km-200km-grid-exposure
          run-id: 45373985228
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/rail
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v376b-JRC-GHSL-2020-global-builtup-100km-200km-real-source
          run-id: 45382671629
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/built
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v380a-EarthEnv-original-global-tree-consensus-macro-grid
          run-id: 45394188340
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/tree
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v381a-original-GRIP4-global-road-density-grid
          run-id: 45394776556
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/road
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v391-original-JRC-GHS-POP2020-global-coarse-counts
          run-id: 45425219960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/pop
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-ESA-CCI-woody-AGB-coarse
          run-id: 45600821930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/agb
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-railstatus-annual-plant-size-cells
          run-id: 45919124522
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/annual_size
      - uses: actions/download-artifact@v4
        with:
          pattern: grip4-actual-road-lengths-*
          run-id: 46105819255
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/rs/vector
      - name: Original independent vegetation plot species summaries
        run: |
          python -u scripts/scan_splotopen_stature.py --archive source/splot/splotopen.zip --out results/railstatus/splotopen_stature_cells.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-splotopen-stature-cells
          path: results/railstatus/splotopen_stature_cells.json
          if-no-files-found: error
      - name: Frozen land units and climate
        run: |
          set -euo pipefail
          mkdir -p source/rs/land
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_admin_0_map_units.geojson' -o source/rs/land/ne.geojson
          curl -LfsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 780 'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_bio.zip' -o source/rs/land/wc2.1_10m_bio.zip
      - name: Independent sPlotOpen stature comparison
        run: |
          cd scripts
          python -u analyze_splotopen_stature.py \
            --source ../results/railstatus/splotopen_stature_cells.json \
            --annual_size ../source/rs/annual_size/annual_plant_size_cells.json \
            --road_vectors ../source/rs/vector \
            --agb ../source/rs/agb/ESA_CCI_woody_AGB_2020_2024.json \
            --plant ../source/rs/plants/v369_original_fullworld_2025_plant_100km_200km_grid_counts.json \
            --rail ../source/rs/rail/v370_original_fullworld_railkm_100km_200km_grid_counts.json \
            --status ../source/rs/status/world_rail_km_by_status_100km_200km.json \
            --built ../source/rs/built/v376b_JRC_GHSL2020_real_world_builtup_m2_100km_200km.json \
            --tree ../source/rs/tree/v380a_original_global_EarthEnv_tree_consensus_100km_200km.json \
            --road ../source/rs/road/v381a_original_GRIP4_global_road_density_100km_200km.json \
            --population ../source/rs/pop/v391_original_global_GHS_POP2020_100km_200km.json \
            --ne ../source/rs/land/ne.geojson \
            --climate ../source/rs/land/wc2.1_10m_bio.zip \
            --out ../results/railstatus/splotopen_stature_association.json
      - uses: actions/upload-artifact@v4
        with:
          name: tetsu-splotopen-stature-association
          path: results/railstatus/splotopen_stature_association.json
          if-no-files-found: error
