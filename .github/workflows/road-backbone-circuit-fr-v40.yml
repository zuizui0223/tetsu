name: "v4.0b France independent MAJOR ROAD backbone circuit negative-control source"
on:
  push:
    branches:
      - research/railway-seed-dispersal-v01
    paths:
      - '.github/workflows/road-backbone-circuit-fr-v40.yml'
  workflow_dispatch:
concurrency:
  group: tetsu-road-backbone-circuit-v40-france
  cancel-in-progress: true
jobs:
  fr-burgundy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sparse numerical resistor solver and Overture GIS dependencies
        run: pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'duckdb>=1.3,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3' 'requests>=2.31,<3'
      - name: Validate major road source class and exact electrical/shortest calculations
        run: python -m unittest discover -s tests -p 'test_road_backbone_circuit_v40.py' -v
      - name: Source actual FR Burgundy equal-area 50km major road network circuit and redundancy
        run: |
          OPENBLAS_NUM_THREADS=1 python -u scripts/audit_overture_50km_road_backbone_circuit_v40.py \
            --blocks fr_burgundy \
            --output results/audit/road_backbone_france_circuit_v40.json
      - name: Archive source class model with explicit size gates and mathematical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-major-road-backbone-circuit-france-v40
          path: results/audit/road_backbone_france_circuit_v40.json
          if-no-files-found: warn
