name: "v384 GloNAF original matrix classification audit and v382 continent influence"
on:
  push:
    branches: [research/tetsu-v378-global-regional-hypotheses-20261124]
    paths:
      - 'scripts/audit_original_GloNAF_matrix_v384.py'
      - 'scripts/audit_v382_heldout_continent_influence_v384b.py'
      - 'tests/test_global_GloNAF_matrix_v384.py'
      - '.github/workflows/tetsu-v384-GloNAF-matrix-and-v382-fold-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'rasterio>=1.4,<2' 'geopandas>=1,<2' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pyarrow>=18,<25'
      - run: python -m unittest discover -s tests -p 'test_global_GloNAF_matrix_v384.py' -v
      - name: Download all publisher originals
        run: |
          set -euo pipefail
          mkdir -p source/v384
          for f in glonaf_2024_nol.zip glonaf_flora2.csv glonaf_list.csv glonaf_region.csv glonaf_taxon_wcvp.csv glonaf_TxR.csv glonaf_decision_nol_region.csv glonaf_flora2_datadictionary.csv; do
            curl -LfS --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 "https://zenodo.org/records/17105725/files/$f?download=1" -o "source/v384/$f"
          done
      - run: python -u scripts/audit_original_GloNAF_matrix_v384.py --source source/v384 --out results/audit/v384_original_GloNAF_matrix_comparison.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v384-GloNAF-original-matrix-source-comparison
          path: results/audit/v384_original_GloNAF_matrix_comparison.json
          if-no-files-found: error
  existing_fold_influence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          name: tetsu-v382-original-rail-road-tree-global-plant-prediction
          run-id: 45394951127
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source/v384b
      - run: python -u scripts/audit_v382_heldout_continent_influence_v384b.py --source source/v384b/v382_world_rail_road_tree_plant_richness_Jaccard.json --out results/audit/v384b_v382_continent_influence.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tetsu-v384b-v382-source-continent-influence
          path: results/audit/v384b_v382_continent_influence.json
          if-no-files-found: error
